<!doctype html><html><head><style>
@font-face{font-family:d7;src:url(DSEG7Classic-Bold.woff2)} @font-face{font-family:d14;src:url(DSEG14Classic-Bold.woff2)}
body{margin:0;background:#3a3631;width:1000px;height:1300px;overflow:hidden;display:grid;place-items:center;font-family:Arial}
.meter{width:620px;height:820px;border-radius:40px;background:linear-gradient(160deg,#e8ecef,#b7c0c8);position:relative;box-shadow:0 30px 60px #0008}
.brand{position:absolute;top:60px;left:60px;font:700 34px Arial;color:#1d4f91}
.lcdwrap{position:absolute;top:150px;left:60px;width:500px;height:190px;background:#222;border-radius:14px;padding:14px}
.lcd{position:relative;width:100%;height:100%;border-radius:6px;background:linear-gradient(180deg,#c3cdac,#aab792);overflow:hidden}
.ghost,.val{position:absolute;right:56px;top:50px;font:400 60px d7;letter-spacing:2px}
.ghost{color:#00000014} .val{color:#1b1f17}
.unit{position:absolute;font:700 30px Arial;color:#1b1f17}
.tag{position:absolute;left:14px;bottom:10px;font:400 26px d14;color:#1b1f17}
.btn{position:absolute;top:420px;left:270px;width:80px;height:80px;border-radius:50%;background:#1d4f91}
.plate{position:absolute;bottom:60px;left:60px;font:15px Arial;color:#333;line-height:1.5}
.glare{position:absolute;inset:0;background:radial-gradient(ellipse at var(--gx) 30%,#ffffffaa,transparent 35%);pointer-events:none}
</style></head><body><div class="meter" id="m"><div class="brand" id="brand"></div><div class="lcdwrap"><div class="lcd">
<div class="ghost" id="ghost"></div><div class="val" id="val"></div><div class="unit" id="unit"></div><div class="tag" id="tag"></div><div class="glare" id="gl"></div></div></div>
<div class="btn"></div><div class="plate" id="plate"></div></div>
<script>
window.setCase = (c) => {
  brand.textContent = c.brand || ''; val.textContent = c.v; ghost.textContent = c.v.replace(/[0-9A-Za-z-]/g,'8');   // непогашенные сегменты под цифрами, буквами (E, C) и прочерками
  unit.textContent = c.u || ''; tag.textContent = c.tag || ''; plate.innerHTML = c.plate || '';
  unit.style.cssText = c.corner ? 'right:14px;top:6px;font-size:24px' : 'right:14px;bottom:10px';
  m.style.transform = `perspective(1200px) rotateX(${c.rx||0}deg) rotateY(${c.ry||0}deg) rotate(${c.rz||0}deg) scale(${c.s||1})`;
  document.body.style.filter = `blur(${c.blur||0}px) brightness(${c.br||1})`;
  gl.style.setProperty('--gx', (c.glare ?? -100) + '%');
};
</script></body></html>
