<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1200px;height:1600px;overflow:hidden;position:relative;background:#555}
#bg{position:absolute;inset:0}
#m{position:absolute;left:0;top:0;transform-origin:50% 50%}
#fx{position:absolute;inset:0;pointer-events:none}
</style></head><body><canvas id="bg" width="1200" height="1600"></canvas><canvas id="m" width="900" height="900"></canvas><canvas id="m2" width="900" height="900" style="position:absolute;left:0;top:0;transform-origin:50% 50%"></canvas><div id="fx"></div>
<script>
/*
 * Синтетический водомер (стиль Novator ЛК-15 и похожих): белый циферблат, кольцо (синее — холодная, красное — горячая),
 * окно барабана: N чёрных ячеек с белыми цифрами (м³) + красные (дробные), стрелочный круг «x0,0001», заводской №, год.
 * setCase(c): c = {v:'00502', red:'347', style:'red'|'redtxt', ring:'blue'|'red'|'none', rot, rx, ry, s, x, y, blur, br, glare, half, bg, warm,
 *   half — последний чёрный ролик между цифрами (доля поворота), halfs: [..] — доля для каждого ролика (перенос 239→240),
 *   curve — ролик-цилиндр (0…1: видимая дуга ±curve·90°), lead: N — блик стекла на N ведущих чёрных роликах (их не видно), brandc — цвет печати, pair: {…второй водомер в кадре}}
 */
function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function drawBg(c) {
  const g = bg.getContext('2d'), r = rnd(c.seed || 1);
  const pal = c.bg === 'dark' ? ['#1d1f22', '#2b2d30', '#3a3a3a'] : c.bg === 'tile' ? ['#d9d6cf', '#c9c4ba', '#e8e4dc'] : ['#6d6559', '#857b6c', '#5a5348'];
  const gr = g.createLinearGradient(0, 0, 1200, 1600); gr.addColorStop(0, pal[0]); gr.addColorStop(1, pal[1]); g.fillStyle = gr; g.fillRect(0, 0, 1200, 1600);
  if (c.bg === 'tile') { g.strokeStyle = '#a9a398'; g.lineWidth = 4; for (let x = 0; x < 1200; x += 300) { g.beginPath(); g.moveTo(x + 20, 0); g.lineTo(x + 20, 1600); g.stroke(); } for (let y = 0; y < 1600; y += 300) { g.beginPath(); g.moveTo(0, y + 40); g.lineTo(1200, y + 40); g.stroke(); } }
  // трубы и тени
  for (let i = 0; i < 3; i++) { const y = 200 + r() * 1200, h = 60 + r() * 80; const pg = g.createLinearGradient(0, y, 0, y + h); pg.addColorStop(0, '#222'); pg.addColorStop(0.4, c.bg === 'dark' ? '#555' : '#b8b2a8'); pg.addColorStop(1, '#111'); g.fillStyle = pg; g.fillRect(0, y, 1200, h); }
  for (let i = 0; i < 2; i++) { g.fillStyle = 'rgba(0,0,0,' + (0.2 + r() * 0.3) + ')'; g.fillRect(r() * 1000, r() * 1400, 200 + r() * 300, 100 + r() * 300); }
  // шум
  const id = g.getImageData(0, 0, 1200, 1600), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n; } g.putImageData(id, 0, 0);
}
function digitCell(g, x, y, w, h, ch, next, frac, bgc, fg, font, curve) {
  if (curve) return digitCellCurved(g, x, y, w, h, ch, next, frac, bgc, fg, font, curve);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, shade(bgc, -0.35)); gr.addColorStop(0.5, bgc); gr.addColorStop(1, shade(bgc, -0.35));
  g.fillStyle = gr; g.fillRect(x, y, w, h);
  g.fillStyle = fg; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  const dy = -frac * h * 1.15;
  g.fillText(ch, x + w / 2, y + h / 2 + dy + h * 0.04);
  if (frac) g.fillText(next, x + w / 2, y + h / 2 + dy + h * 1.15 + h * 0.04);
  g.restore();
}
// Ролик — цилиндр: в окне видна дуга ±curve·90°, цифры у краёв окна сжаты по высоте (как на настоящем счётчике).
// Рисуем развёртку (дуга = высота) и переносим строки: экранная y = R·sin(s/R).
function digitCellCurved(g, x, y, w, h, ch, next, frac, bgc, fg, font, curve) {
  const tm = curve * Math.PI / 2, R = h / 2 / Math.sin(tm), Hf = Math.ceil(2 * R * tm), o = document.createElement('canvas'); o.width = w; o.height = Hf;
  const q = o.getContext('2d'), gr = q.createLinearGradient(0, 0, 0, Hf); gr.addColorStop(0, shade(bgc, -0.45)); gr.addColorStop(0.5, bgc); gr.addColorStop(1, shade(bgc, -0.45));
  q.fillStyle = gr; q.fillRect(0, 0, w, Hf); q.fillStyle = fg; q.font = font; q.textAlign = 'center'; q.textBaseline = 'middle';
  const dy = -frac * h * 1.15; q.fillText(ch, w / 2, Hf / 2 + dy + h * 0.04); if (frac) q.fillText(next, w / 2, Hf / 2 + dy + h * 1.15 + h * 0.04);
  for (let yy = 0; yy < h; yy++) { const yc = yy + 0.5 - h / 2, sv = R * Math.asin(Math.max(-1, Math.min(1, yc / R))); g.drawImage(o, 0, sv + Hf / 2 - 0.5, w, 1, x, y + yy, w, 1); }
}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16), r = n >> 16, gg = (n >> 8) & 255, b = n & 255, f = v => Math.max(0, Math.min(255, Math.round(v + (k < 0 ? v * k : (255 - v) * k)))); return 'rgb(' + f(r) + ',' + f(gg) + ',' + f(b) + ')'; }
function drawMeter(c, cv) {
  const g = (cv || m).getContext('2d'), S = 900, cx = 450, cy = 450, R = 420; g.clearRect(0, 0, S, S);
  // корпус (латунь) и кольцо
  let gr = g.createRadialGradient(cx - 120, cy - 120, 50, cx, cy, R); gr.addColorStop(0, '#e9d48a'); gr.addColorStop(0.7, '#b8973e'); gr.addColorStop(1, '#6e5a22');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
  g.fillStyle = c.ring === 'red' ? '#c4202a' : c.ring === 'none' ? '#c9ccd0' : '#1d5fb0'; g.beginPath(); g.arc(cx, cy, R * 0.9, 0, 7); g.fill();
  gr = g.createRadialGradient(cx, cy - 60, 40, cx, cy, R * 0.8); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#dfe3e6');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R * 0.8, 0, 7); g.fill();
  // надписи
  g.fillStyle = c.brandc || '#123f8a'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = 'bold 54px "DejaVu Sans"'; g.fillText(c.brand || 'NOVATOR', cx, 205);
  g.fillStyle = '#222'; g.font = 'bold 34px "DejaVu Sans"'; g.fillText(c.model || 'ЛК-15Г', cx, 252);
  g.font = '26px "DejaVu Sans"'; g.fillText('Qn 1,5 m³/h   R80-H', cx, 292);
  // окно барабана
  const nb = c.v.length, nr = (c.red || '').length, cw = c.cw || 46, ch = cw * 1.55, gap = c.gap ?? 5, tw = (nb + nr) * cw + (nb + nr - 1) * gap + (c.sep || 0);
  const wx = cx - tw / 2 + 20, wy = 330;
  g.fillStyle = c.frame || '#8a8f94'; g.fillRect(wx - 12, wy - 12, tw + 24, ch + 24);
  g.fillStyle = c.gapc || '#d7dadd'; g.fillRect(wx - 4, wy - 4, tw + 8, ch + 8);
  const font = 'bold ' + Math.round(ch * 0.78) + 'px ' + (c.font || '"DejaVu Sans Condensed", "DejaVu Sans"');
  for (let i = 0; i < nb; i++) {
    const last = i === nb - 1, d = +c.v[i], frac = last && c.half ? c.half : c.halfs ? c.halfs[i] || 0 : 0;
    digitCell(g, wx + i * (cw + gap), wy, cw, ch, c.v[i], String((d + 1) % 10), frac, c.black || '#16181a', c.ink || '#f4f4f4', font, c.curve);
  }
  for (let j = 0; j < nr; j++) {
    const x = wx + (nb + j) * (cw + gap) + (c.sep || 0);
    if (c.style === 'redtxt') digitCell(g, x, wy, cw, ch, c.red[j], '0', 0, '#f2f2f2', '#d0161e', font, c.curve);
    else digitCell(g, x, wy, cw, ch, c.red[j], '0', 0, c.redbg || '#c8151d', '#fbeaea', font, c.curve);
  }
  // окно утоплено: тень сверху; стекло запотело; вспышка
  if (c.shadow) { const sg = g.createLinearGradient(0, wy - 4, 0, wy + ch * 0.6); sg.addColorStop(0, 'rgba(0,0,0,' + c.shadow + ')'); sg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = sg; g.fillRect(wx - 4, wy - 4, tw + 8, ch * 0.6); }
  if (c.fog) { g.save(); g.filter = 'blur(6px)'; const r2 = rnd(c.seed + 7); for (let k = 0; k < 60; k++) { g.fillStyle = 'rgba(235,240,242,' + (c.fog * (0.4 + r2() * 0.6)) + ')'; g.beginPath(); g.arc(wx - 30 + r2() * (tw + 60), wy - 20 + r2() * (ch + 40), 8 + r2() * 26, 0, 7); g.fill(); } g.restore(); }
  if (c.flash) { const fg2 = g.createRadialGradient(wx + tw * c.flash, wy + ch * 0.5, 2, wx + tw * c.flash, wy + ch * 0.5, ch * 0.9); fg2.addColorStop(0, 'rgba(255,255,255,1)'); fg2.addColorStop(0.35, 'rgba(255,255,255,0.8)'); fg2.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = fg2; g.fillRect(wx - 40, wy - 40, tw + 80, ch + 80); }
  // блик стекла на ведущих роликах: белое пятно вытянуто вдоль окна, цифр под ним не видно
  if (c.lead) { const lw = c.lead * (cw + gap), gx = wx + lw / 2 - gap; g.save(); g.translate(gx, wy + ch / 2); g.scale(1, ch / lw * 0.9);
    const lg = g.createRadialGradient(0, 0, 2, 0, 0, lw * 0.85); lg.addColorStop(0, 'rgba(255,255,255,1)'); lg.addColorStop(0.6, 'rgba(250,250,250,0.97)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg; g.beginPath(); g.arc(0, 0, lw * 0.85, 0, 7); g.fill(); g.restore(); }
  g.fillStyle = '#222'; g.font = 'bold 34px "DejaVu Sans"'; g.textAlign = 'right'; g.fillText('m³', wx - 22, wy + ch * 0.68);
  // стрелочный круг
  const px = cx + 120, py = 600, pr = 58; g.strokeStyle = '#333'; g.lineWidth = 2; g.beginPath(); g.arc(px, py, pr, 0, 7); g.stroke();
  for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2 - Math.PI / 2; g.beginPath(); g.moveTo(px + Math.cos(a) * pr * 0.8, py + Math.sin(a) * pr * 0.8); g.lineTo(px + Math.cos(a) * pr, py + Math.sin(a) * pr); g.stroke(); }
  g.fillStyle = '#d0161e'; g.beginPath(); const a0 = (c.ptr || 0.3) * Math.PI * 2 - Math.PI / 2; g.moveTo(px + Math.cos(a0) * pr * 0.85, py + Math.sin(a0) * pr * 0.85); g.lineTo(px + Math.cos(a0 + 1.6) * 8, py + Math.sin(a0 + 1.6) * 8); g.lineTo(px + Math.cos(a0 - 1.6) * 8, py + Math.sin(a0 - 1.6) * 8); g.fill();
  g.fillStyle = '#222'; g.font = '24px "DejaVu Sans"'; g.textAlign = 'center'; g.fillText('x0,0001', px, py + pr + 30);
  // звёздочка-индикатор
  g.fillStyle = '#c4202a'; g.beginPath(); g.arc(cx - 130, 600, 26, 0, 7); g.fill();
  // заводской № и год
  g.fillStyle = '#222'; g.font = '30px "DejaVu Sans"'; g.textAlign = 'center';
  g.fillText('№ ' + (c.serial || '1234567'), cx, 730); g.font = '26px "DejaVu Sans"'; g.fillText((c.year || '2021') + '   1 MPa   ДСТУ', cx, 770);
  // блик
  if (c.glare) { gr = g.createRadialGradient(cx + c.glare, wy + ch / 2, 10, cx + c.glare, wy + ch / 2, 160); gr.addColorStop(0, 'rgba(255,255,255,0.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R * 0.8, 0, 7); g.fill(); }
}
const place = (cv, c) => { const s = c.s || 1; cv.style.transform = `translate(${150 + (c.x || 0)}px, ${350 + (c.y || 0)}px) perspective(1400px) rotateX(${c.rx || 0}deg) rotateY(${c.ry || 0}deg) rotate(${c.rot || 0}deg) scale(${s})`; };
window.setCase = (c) => {
  drawBg(c); drawMeter(c, m); place(m, c);
  m2.style.display = c.pair ? '' : 'none'; if (c.pair) { drawMeter(Object.assign({ seed: c.seed + 50 }, c.pair), m2); place(m2, c.pair); }
  document.body.style.filter = `blur(${c.blur || 0}px) brightness(${c.br || 1})` + (c.warm ? ` sepia(${c.warm})` : '');
};
</script></body></html>
