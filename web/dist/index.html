<title>Лічильники — тепло й вода</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Теплосервис — стили. Токены: design/02-brandbook.md, компоненты: design/03-design-system.md */
:root {
  --c-housing: #E9EEEB; --c-surface: #FFFFFF; --c-ink: #17211E; --c-ink-2: #4A5652; --c-line: #CFD7D3;
  /* границы полей ввода и других элементов управления — не меньше 3:1 к фону (WCAG 2.1 / ДСТУ EN 301 549:2022, п. 1.4.11) */
  --c-field-line: #768480; --c-field-bg: #FFFFFF;
  --c-lcd: #BCC8A2; --c-lcd-ink: #1C2618; --c-lcd-off: #AAB78E; --c-bezel: #8E9A94;
  --c-supply: #B53D15; --c-return: #2F68B0;
  --c-ok: #18693F; --c-ok-soft: #DFF1E7; --c-warn: #8F5600; --c-warn-soft: #FBEFD5;
  --c-bad: #A3142E; --c-bad-soft: #F9E1E5; --c-info: #2F68B0; --c-info-soft: #E2ECF8;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
  --r-lcd: 10px; --r-field: 10px; --r-btn: 12px; --r-pill: 999px;
  --fs-s: 15px; --fs-m: 17px; --fs-l: 20px; --fs-xl: 26px; --fs-xxl: 34px;
  --tap: 48px;
  --c-surface-2: #F3F6F4; --c-on-ink: #FFFFFF; --c-ink-hover: #2A3733; --c-ghost-hover: rgba(23, 33, 30, .06); --c-bezel-in: #DCE2DE;
  --c-info-ink: #173A61; --c-warn-ink: #5C3700; --c-bad-ink: #6E0D1F; --c-ok-ink: #134D30; --c-warn-line: #C98A1E; --c-seg-sample: #66745A;
  --c-scrim: rgba(23, 33, 30, .35); --c-scrim-strong: rgba(23, 33, 30, .75); --c-shadow: rgba(23, 33, 30, .14); --c-shadow-strong: rgba(23, 33, 30, .25);
  --c-focus-ring: rgba(47, 104, 176, .25); --c-tip-bg: #17211E; --c-tip-ink: #FFFFFF; --lcd-glow: 0 0 0 transparent;
  --ch-ax: #4A5652; --ch-vl: #17211E; --ch-grid: #E3E8E5; --ch-bar: #2F68B0; --ch-bar-soft: #9DB5D6; --ch-ok: #18693F; --ch-low: #B7791F; --ch-bad: #A3142E; --ch-none: #4A5652; --ch-off: #8E9A94; --ch-dot-ring: #FFFFFF;
  --wx-cold-bg: #E2ECF8; --wx-cold-ink: #24508A; --wx-zero-bg: #EEF1EF; --wx-zero-ink: #4A5652; --wx-warm-bg: #FBEFD5; --wx-warm-ink: #7A4A00;
  --spark-cold: #2F68B0; --spark-warm: #C98A1E; --spark-axis: #CFD7D3;
  color-scheme: light;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", monospace;
}
/* Тёмная тема — «котельная ночью»: графит с зелёным оттенком корпуса (не чистый чёрный), глубина — светлее поверхность,
   а не тень; акценты подачи/обратки и статусы осветлены и приглушены; ЖК-экран светится, как настоящая подсветка. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --c-housing: #0E1412; --c-surface: #161E1B; --c-surface-2: #1E2824; --c-ink: #E3EBE7; --c-ink-2: #9EACA6; --c-line: #2D3934;
  --c-field-line: #7B8A84; --c-field-bg: #0B110F;
  --c-lcd: #A8BB7C; --c-lcd-ink: #10170C; --c-lcd-off: #97AA6C; --c-bezel: #46534E; --c-bezel-in: #27312D; --c-seg-sample: #5E6E4C;
  --lcd-glow: 0 0 28px rgba(168, 187, 124, .22), 0 0 2px rgba(168, 187, 124, .35);
  --c-supply: #F0906A; --c-return: #8DB4EE; --c-info: #8DB4EE;
  --c-ok: #74CFA0; --c-ok-soft: #12291E; --c-ok-ink: #A9E5C5; --c-warn: #E7B86A; --c-warn-soft: #2C2310; --c-warn-ink: #F1D39C; --c-warn-line: #D9A24A;
  --c-bad: #F5949F; --c-bad-soft: #34161C; --c-bad-ink: #F9C4CB; --c-info-soft: #142235; --c-info-ink: #BCD3F5;
  --c-on-ink: #0E1412; --c-ink-hover: #C6D2CC; --c-ghost-hover: rgba(227, 235, 231, .07);
  --c-scrim: rgba(0, 0, 0, .6); --c-scrim-strong: rgba(0, 0, 0, .7); --c-shadow: rgba(0, 0, 0, .45); --c-shadow-strong: rgba(0, 0, 0, .6);
  --c-focus-ring: rgba(141, 180, 238, .35); --c-tip-bg: #E3EBE7; --c-tip-ink: #0E1412;
  --ch-ax: #9EACA6; --ch-vl: #E3EBE7; --ch-grid: #24302B; --ch-bar: #7EA6E0; --ch-bar-soft: #34496A; --ch-ok: #74CFA0; --ch-low: #E7B86A; --ch-bad: #F5949F; --ch-none: #9EACA6; --ch-off: #5F6D67; --ch-dot-ring: #161E1B;
  --wx-cold-bg: #142235; --wx-cold-ink: #A9C8F2; --wx-zero-bg: #1E2824; --wx-zero-ink: #C4CFCA; --wx-warm-bg: #2C2310; --wx-warm-ink: #F1D39C;
  --spark-cold: #7EA6E0; --spark-warm: #D9A24A; --spark-axis: #2D3934;
}
:root[data-theme="dark"] .btn.danger { color: var(--c-on-ink); }
:root[data-theme="dark"] img { filter: brightness(.92); }
@media (prefers-reduced-motion: no-preference) { body { transition: background-color .25s ease, color .25s ease; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--c-housing); color: var(--c-ink); font: 400 var(--fs-m)/1.5 var(--font); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 var(--sp-3); font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: var(--fs-xl); } h2 { font-size: var(--fs-l); } h3 { font-size: var(--fs-m); }
p { margin: 0 0 var(--sp-3); max-width: 68ch; }
a { color: var(--c-return); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--c-return); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--c-ink-2); }
.small { font-size: var(--fs-s); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- оболочка ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: var(--fs-m); color: var(--c-ink); text-decoration: none; }
.brand svg { flex: none; }
.top .spacer { flex: 1; }
.main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: var(--sp-2) var(--sp-4) calc(var(--tap) + 48px); }
.main.bare { padding-bottom: var(--sp-7); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(var(--nav-n, 5), auto); padding-left: 4px; padding-right: 4px; background: var(--c-surface);
  border-top: 1px solid var(--c-line); box-shadow: 0 -6px 18px var(--c-ghost-hover); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; font-size: 13px; color: var(--c-ink-2); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--c-ink); font-weight: 600; }
.nav a[aria-current="page"] svg { stroke: var(--c-ink); }
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: auto 1fr; }
  .top { grid-column: 1 / -1; padding: var(--sp-4) var(--sp-5); }
  .nav { position: sticky; top: 0; align-self: start; grid-template-columns: 1fr; box-shadow: none; border: 0; background: transparent; padding: var(--sp-2) var(--sp-3); gap: 2px; }
  .nav a { flex-direction: row; justify-content: flex-start; gap: var(--sp-3); padding: 0 var(--sp-4); min-height: 48px; font-size: var(--fs-m); border-radius: var(--r-btn); }
  .nav a[aria-current="page"] { background: var(--c-surface); }
  .main { max-width: 1040px; margin: 0; padding: var(--sp-2) var(--sp-6) var(--sp-7); }
  .app.bare-app { grid-template-columns: 1fr; }
}

/* ---------- кнопки ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); min-height: var(--tap); padding: 0 var(--sp-5);
  border-radius: var(--r-btn); border: 1.5px solid var(--c-ink); background: var(--c-ink); color: var(--c-on-ink); font: 600 var(--fs-m)/1 var(--font);
  cursor: pointer; text-decoration: none; transition: background .15s, transform .05s; }
.btn:hover { background: var(--c-ink-hover); border-color: var(--c-ink-hover); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { background: var(--c-line); border-color: var(--c-line); color: var(--c-ink-2); cursor: not-allowed; }
.btn.sec { background: var(--c-surface); color: var(--c-ink); border-color: var(--c-field-line); }
.btn.sec:hover { border-color: var(--c-ink-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--c-ink); padding: 0 var(--sp-3); }
.btn.ghost:hover { background: var(--c-ghost-hover); }
.btn.danger { background: var(--c-bad); border-color: var(--c-bad); }
.btn.block { width: 100%; }
.btn.big { min-height: 56px; font-size: var(--fs-l); }
.row-actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }
.row-actions .btn { flex: 1 1 auto; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--c-return); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; }

/* ---------- экран счётчика (подпись — главная вещь) ---------- */
.lcd { background: var(--c-lcd); border: 6px solid var(--c-bezel-in); outline: 1.5px solid var(--c-bezel); border-radius: var(--r-lcd);
  padding: 14px 16px 12px; position: relative; color: var(--c-lcd-ink); box-shadow: inset 0 2px 6px rgba(28, 38, 24, .25), var(--lcd-glow); }
.lcd svg.seg { display: block; height: 52px; width: auto; max-width: 100%; }
.lcd .tag { font: 600 15px/1 var(--font); letter-spacing: .02em; }
.lcd .tag.corner { position: absolute; top: 10px; right: 14px; }
.lcd .line { display: flex; align-items: flex-end; gap: 12px; }
.lcd .line + .line { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(28, 38, 24, .25); }
.lcd .line .tag { padding-bottom: 6px; }
.lcd.hero svg.seg { height: 64px; }
.lcd.small svg.seg { height: 30px; }
.lcd.small { padding: 8px 10px; border-width: 4px; }
.lcd-cap { font-size: var(--fs-s); color: var(--c-ink-2); margin-top: var(--sp-2); }
@media (prefers-reduced-motion: no-preference) {
  .lcd.boot .on { animation: segon .5s ease-out both; }
  @keyframes segon { from { fill: var(--c-lcd-off); } to { fill: var(--c-lcd-ink); } }
}

/* ---------- метки и баннеры ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pill); font-size: 14px; font-weight: 500; background: var(--c-line); color: var(--c-ink); white-space: nowrap; }
.pill.ok { background: var(--c-ok-soft); color: var(--c-ok); } .pill.warn { background: var(--c-warn-soft); color: var(--c-warn); }
.pill.bad { background: var(--c-bad-soft); color: var(--c-bad); } .pill.info { background: var(--c-info-soft); color: var(--c-info); }
.banner { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-btn); background: var(--c-info-soft); color: var(--c-info-ink); margin: 0 0 var(--sp-4); }
.banner.warn { background: var(--c-warn-soft); color: var(--c-warn-ink); } .banner.bad { background: var(--c-bad-soft); color: var(--c-bad-ink); } .banner.ok { background: var(--c-ok-soft); color: var(--c-ok-ink); }
.banner svg { flex: none; margin-top: 2px; }
.banner p { margin: 0; } .banner p + p { margin-top: 4px; font-size: var(--fs-s); }

/* ---------- блоки ---------- */
.panel { background: var(--c-surface); border-radius: 14px; padding: var(--sp-4); margin: 0 0 var(--sp-4); }
.panel > h2:first-child, .panel > h3:first-child { margin-top: 0; }
.section-title { font-size: var(--fs-m); font-weight: 600; margin: var(--sp-5) 0 var(--sp-2); }
.list { list-style: none; margin: 0; padding: 0; background: var(--c-surface); border-radius: 14px; }
.list > li { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-housing); min-height: 56px; }
.list > li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.list a.rowlink { display: flex; align-items: center; gap: var(--sp-3); color: inherit; text-decoration: none; width: 100%; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- главная ---------- */
.hero-grid { display: grid; gap: var(--sp-4); }
@media (min-width: 960px) { .hero-grid { grid-template-columns: 1.2fr 1fr; align-items: start; } }
.meter-row { display: flex; align-items: center; gap: var(--sp-3); }

/* ---------- приветствие ---------- */
.welcome { max-width: 860px; margin: 0 auto; }
.welcome h1 { font-size: var(--fs-xxl); max-width: 16ch; margin-bottom: var(--sp-3); }
.welcome .lead { font-size: var(--fs-l); color: var(--c-ink-2); max-width: 40ch; }
.welcome ul { padding: 0; list-style: none; margin: var(--sp-5) 0; display: grid; gap: var(--sp-3); }
.welcome li { display: flex; gap: var(--sp-3); align-items: flex-start; max-width: 52ch; }
.welcome li svg { flex: none; margin-top: 3px; }
@media (min-width: 960px) { .welcome-grid { display: grid; grid-template-columns: 1fr 360px; gap: var(--sp-7); align-items: center; } }

/* ---------- поля ---------- */
.field { margin: 0 0 var(--sp-4); }
.field label, .field .lbl { display: block; font-weight: 500; margin-bottom: 6px; }
.field .ctl { display: flex; align-items: stretch; background: var(--c-field-bg); border: 1.5px solid var(--c-field-line); border-radius: var(--r-field); overflow: hidden; }
.field .ctl:focus-within { border-color: var(--c-ink); box-shadow: 0 0 0 3px var(--c-focus-ring); }
.field input, .field select, .field textarea { flex: 1; min-width: 0; min-height: 52px; border: 0; padding: 0 var(--sp-4); font: 500 var(--fs-l) var(--font); color: var(--c-ink); background: transparent; }
.field textarea { min-height: 96px; padding: var(--sp-3) var(--sp-4); font-size: var(--fs-m); font-weight: 400; }
.field input.num { font-family: var(--mono); letter-spacing: .02em; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; }
.field .unit { display: flex; align-items: center; padding: 0 var(--sp-4); color: var(--c-ink-2); background: var(--c-surface-2); border-left: 1.5px solid var(--c-field-line); font-size: var(--fs-s); white-space: nowrap; }
.field .help { font-size: var(--fs-s); color: var(--c-ink-2); margin-top: 6px; min-height: 1.5em; }
.field .help.ok { color: var(--c-ok); } .field .help.warn { color: var(--c-warn); } .field .help.block { color: var(--c-bad); font-weight: 500; }
.field.is-block .ctl { border-color: var(--c-bad); } .field.is-warn .ctl { border-color: var(--c-warn-line); }
.field .ctl.supply { border-left: 5px solid var(--c-supply); } .field .ctl.return { border-left: 5px solid var(--c-return); }
.grid2 { display: grid; gap: 0 var(--sp-4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 600px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.choice { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.choice label { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 var(--sp-4); border: 1.5px solid var(--c-field-line); border-radius: var(--r-btn); background: var(--c-surface); cursor: pointer; font-weight: 500; }
.choice input { accent-color: var(--c-ink); width: 18px; height: 18px; }
.choice label:has(input:checked) { border-color: var(--c-ink); box-shadow: inset 0 0 0 1px var(--c-ink); }

/* ---------- мастер ---------- */
.wiz-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px var(--sp-3); margin-bottom: var(--sp-4); }   /* узкий экран: полоска прогресса уходит строкой ниже */
.wiz-top .count { font-weight: 600; white-space: nowrap; }
.progress { height: 6px; background: var(--c-line); border-radius: 3px; overflow: hidden; flex: 1 1 64px; min-width: 64px; }
.progress i { display: block; height: 100%; background: var(--c-ink); border-radius: 3px; transition: width .25s; }
.wiz { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); }
@media (min-width: 960px) { .wiz { grid-template-columns: minmax(320px, 440px) 1fr; align-items: start; } }
.press { display: flex; align-items: center; gap: var(--sp-3); margin: 0 0 var(--sp-3); font-size: var(--fs-l); font-weight: 600; }
.press .times { font-family: var(--mono); background: var(--c-ink); color: var(--c-on-ink); border-radius: 8px; padding: 2px 10px; font-size: var(--fs-l); }
.hint { color: var(--c-ink-2); margin-top: var(--sp-3); }
.sleep { display: flex; gap: var(--sp-2); align-items: flex-start; font-size: var(--fs-s); color: var(--c-ink-2); margin-top: var(--sp-3); }
.wiz-actions { display: flex; flex-wrap: wrap-reverse; gap: var(--sp-3); margin-top: var(--sp-5); }
.wiz-actions .btn { flex: 1 1 auto; white-space: nowrap; }
.wiz-actions .btn:only-child { white-space: normal; text-wrap: balance; }   /* одна кнопка на всю ширину — длинной подписи можно в 2 строки (320 px) */
.wiz-actions .btn:last-child { flex: 3 1 auto; }
.wiz-actions + p { margin-top: var(--sp-3); }

/* ---------- проверка ---------- */
.verdict { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-4); border-radius: 14px; margin: 0 0 var(--sp-4); font-size: var(--fs-l); font-weight: 600; }
.verdict.ok { background: var(--c-ok-soft); color: var(--c-ok-ink); } .verdict.warn { background: var(--c-warn-soft); color: var(--c-warn-ink); } .verdict.block { background: var(--c-bad-soft); color: var(--c-bad-ink); }
.issues { list-style: none; margin: 0 0 var(--sp-4); padding: 0; background: var(--c-surface); border-radius: 14px; }
.issues li { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-housing); }
.issues li:last-child { border-bottom: 0; }
.issues .ic { grid-row: span 3; margin-top: 2px; }
.issues .msg { font-weight: 500; } .issues .fix { color: var(--c-ink-2); font-size: var(--fs-s); }
.vals { width: 100%; border-collapse: collapse; background: var(--c-surface); border-radius: 14px; overflow: hidden; }
.vals th, .vals td { text-align: left; padding: 10px var(--sp-4); border-bottom: 1px solid var(--c-housing); font-size: var(--fs-s); vertical-align: middle; }
.vals th { font-weight: 400; color: var(--c-ink-2); }
.vals td { font-family: var(--mono); font-size: var(--fs-m); text-align: right; white-space: nowrap; }
.vals tr.is-block td { color: var(--c-bad); font-weight: 600; } .vals tr.is-warn td { color: var(--c-warn); font-weight: 600; }
.vals tr:last-child th, .vals tr:last-child td { border-bottom: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }   /* minmax(0,…): поле ввода не распирает колонку шире экрана (вход на телефоне ездил вбок) */
@media (min-width: 960px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }

/* ---------- передача ---------- */
.copy-list { list-style: none; margin: 0; padding: 0; background: var(--c-surface); border-radius: 14px; }
.copy-list li { display: grid; grid-template-columns: 1fr auto auto; gap: var(--sp-3); align-items: center; padding: 8px var(--sp-2) 8px var(--sp-4); border-bottom: 1px solid var(--c-housing); }
.copy-list li:last-child { border-bottom: 0; }
.copy-list .k { font-size: var(--fs-s); color: var(--c-ink-2); }
.copy-list .v { font-family: var(--mono); font-size: var(--fs-l); font-weight: 500; font-variant-numeric: tabular-nums; }
.copy-list .btn { min-height: 44px; padding: 0 var(--sp-3); font-size: var(--fs-s); }
.copy-list .btn.done { background: var(--c-ok); border-color: var(--c-ok); color: var(--c-on-ink); }
.steps { margin: 0; padding-left: 1.4em; } .steps li { margin: 0 0 var(--sp-2); padding-left: 4px; }
.soon { border: 1.5px dashed var(--c-line); background: transparent; }

/* ---------- модели ---------- */
.models > li { cursor: pointer; }
.models > li:hover { background: var(--c-surface-2); }
.models label { display: flex; align-items: center; gap: var(--sp-3); width: 100%; cursor: pointer; }
.models input { width: 20px; height: 20px; accent-color: var(--c-ink); flex: none; }
.models .name { font-weight: 600; } .models .vendor { color: var(--c-ink-2); font-size: var(--fs-s); }
details.where { margin: var(--sp-3) 0 var(--sp-4); }
details.where summary { cursor: pointer; color: var(--c-return); text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }
details.where p { margin-top: var(--sp-2); }

/* ---------- справка ---------- */
.help-doc h2 { margin-top: var(--sp-6); }
.help-doc h2:first-of-type { margin-top: var(--sp-3); }
.help-doc ul, .help-doc ol { padding-left: 1.3em; max-width: 68ch; } .help-doc li { margin-bottom: 6px; }
.toc { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: 0 0 var(--sp-4); }
.toc a, .toc .tocb { border: 0; cursor: pointer; font-family: var(--font); display: inline-flex; align-items: center; min-height: 40px; padding: 0 var(--sp-3); background: var(--c-surface); border-radius: var(--r-pill); text-decoration: none; color: var(--c-ink); font-size: var(--fs-s); }

/* ---------- тост и сегмент ---------- */
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--c-ink); color: var(--c-on-ink); padding: 12px 18px; border-radius: var(--r-btn); font-weight: 500; z-index: 10; max-width: calc(100% - 32px); }
@media (min-width: 960px) { .toast { bottom: 32px; } }
.seg-ctl { display: inline-flex; background: var(--c-field-bg); border: 1.5px solid var(--c-field-line); border-radius: var(--r-pill); padding: 2px; }
.seg-ctl button { border: 0; background: transparent; min-height: 36px; min-width: 44px; padding: 0 12px; border-radius: var(--r-pill); font: 600 14px var(--font); color: var(--c-ink-2); cursor: pointer; }
.seg-ctl button[aria-pressed="true"] { background: var(--c-ink); color: var(--c-on-ink); }
.confirm { background: var(--c-bad-soft); border-radius: var(--r-btn); padding: var(--sp-4); margin-top: var(--sp-3); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* сегменты и иконки уровней */
.seg .on { fill: var(--c-lcd-ink); } .seg .off { fill: var(--c-lcd-off); opacity: .55; }
.lcd .line.sample .seg .on { fill: var(--c-seg-sample); }
.c-ok { color: var(--c-ok); } .c-warn { color: var(--c-warn); } .c-bad { color: var(--c-bad); } .c-info { color: var(--c-info); }

.linkbtn { text-align: left; }
.meta-row { display: flex; gap: var(--sp-4); align-items: baseline; }
.welcome-lcd { margin: 0 0 var(--sp-5); max-width: 360px; }
@media (min-width: 960px) { .welcome-lcd { order: 2; margin: 0; } }
@media (max-width: 959px) { .ho-steps { order: -1; } }

/* ---------- фото ---------- */
.thumbs { list-style: none; margin: 0 0 var(--sp-4); padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp-2); }
.thumbs li { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--c-surface); border: 1px solid var(--c-line); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs .n { position: absolute; left: 6px; top: 6px; background: var(--c-ink); color: var(--c-on-ink); font-size: 13px; font-weight: 600; border-radius: 6px; padding: 0 6px; }
.thumbs .rm { position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--c-scrim-strong); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ph-fields li { gap: var(--sp-3); }
.ph-fields .src { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; border: 1px solid var(--c-line); }
.ph-fields .src.none { background: repeating-linear-gradient(45deg, var(--c-housing), var(--c-housing) 6px, var(--c-surface) 6px, var(--c-surface) 12px); }
.ph-in { width: 100%; min-height: 44px; background: var(--c-field-bg); color: var(--c-ink); border: 1.5px solid var(--c-field-line); border-radius: var(--r-field); padding: 0 var(--sp-3); font: 500 var(--fs-l) var(--mono); background: var(--c-surface); margin-top: 4px; }
.ph-in:focus { outline: none; border-color: var(--c-ink); box-shadow: 0 0 0 3px var(--c-focus-ring); }
label.btn { cursor: pointer; }

/* ---------- тестовая версия, отзыв ---------- */
.beta { font: 600 12px/1 var(--font); letter-spacing: .02em; color: var(--c-warn); background: var(--c-warn-soft); border-radius: var(--r-pill); padding: 5px 9px; }
.fab { position: fixed; right: var(--sp-4); bottom: calc(58px + env(safe-area-inset-bottom) + var(--sp-3)); z-index: 6; display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 16px 0 12px; border-radius: var(--r-pill); border: 1.5px solid var(--c-field-line); background: var(--c-surface); color: var(--c-ink);
  font: 600 var(--fs-s)/1 var(--font); box-shadow: 0 6px 18px var(--c-shadow); cursor: pointer; }
.fab:hover { border-color: var(--c-ink); }
.fab.fab-bare { bottom: calc(env(safe-area-inset-bottom) + var(--sp-4)); }
@media (max-width: 420px) { .fab span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } .fab { padding: 0; width: 48px; justify-content: center; } }
@media (min-width: 960px) { .fab { bottom: var(--sp-5); right: var(--sp-5); } }
.fb-back { position: fixed; inset: 0; background: var(--c-scrim); z-index: 20; }
.fb { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto;
  background: var(--c-surface); border-radius: 16px; padding: var(--sp-5); box-shadow: 0 20px 50px var(--c-shadow-strong); }
.fb textarea, .fb input { width: 100%; box-sizing: border-box; font: 400 var(--fs-m)/1.4 var(--font); padding: 10px 12px; background: var(--c-field-bg); color: var(--c-ink); border: 1.5px solid var(--c-field-line); border-radius: var(--r-field); margin-bottom: var(--sp-3); background: #fff; color: var(--c-ink); }
.fb .lbl { display: block; font-weight: 600; margin: var(--sp-2) 0 6px; }
@media (max-width: 600px) { .fb { top: auto; bottom: 0; transform: translateX(-50%); border-radius: 16px 16px 0 0; width: 100vw; padding-bottom: calc(var(--sp-5) + env(safe-area-inset-bottom)); } }
.test-reset { margin-top: var(--sp-6); border: 1.5px dashed var(--c-line); background: transparent; }

/* карточка показаний в истории */
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 8px; }
.num.big { font-size: 28px; line-height: 1.2; }

/* дата «дд.мм.рррр»: своё текстовое поле + кнопка-календарь; настоящее type=date — невидимое, под кнопкой */
.has-dmy { position: relative; display: flex; align-items: center; }
.has-dmy .dmy { flex: 1; min-width: 0; }
.has-dmy .dmy.bad { color: var(--c-bad); }
.dmy-cal { flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin-left: 4px; border: 0; background: transparent; color: inherit; cursor: pointer; border-radius: 10px; }
.dmy-cal:hover { background: var(--c-ghost-hover); }
.dmy-native { position: absolute; right: 0; bottom: 0; width: 44px; height: 44px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
/* телефоны: календарь открывается только прямым нажатием на сам input[type=date] (iOS не умеет showPicker/focus) —
   кладём невидимое родное поле поверх кнопки-календаря */
@media (pointer: coarse) { .dmy-native { pointer-events: auto; z-index: 1; top: 50%; bottom: auto; transform: translateY(-50%); font-size: 16px; -webkit-appearance: none; appearance: none; min-width: 0; color: transparent; background: transparent; } }

/* экономия тепла */
.tips { padding-left: 22px; } .tips li { margin-bottom: 14px; } .tips h3 { margin: 0 0 4px; font-size: 17px; } .tips p { margin: 0; }
.tip h3 { margin: 4px 0; font-size: 16px; } .tip { margin-top: 16px; }
.date-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--c-surface); color: inherit; text-decoration: none; border: 1px solid var(--c-line); white-space: nowrap; }
@media (max-width: 420px) { .nav a span { font-size: 11px; letter-spacing: -0.1px; } }
@media (max-width: 359px) { .nav a span { font-size: 10px; letter-spacing: -0.2px; } }

/* статистика */
.chart { width: 100%; height: auto; display: block; margin-top: 8px; overflow: visible; }
.chart .ax { font: 11px var(--font, sans-serif); fill: var(--ch-ax); }
.chart .vl { font: 600 11px var(--font, sans-serif); fill: var(--ch-vl); }
.chart .mk { cursor: default; outline: none; }
.chart .mk:hover path, .chart .mk:focus path, .chart .mk:hover circle, .chart .mk:focus circle { filter: brightness(1.12); }
.chart .mk:focus-visible rect { stroke: var(--c-ink); stroke-dasharray: 3 3; }
.chart-panel h2 { margin-bottom: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--c-ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .ring { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid var(--c-ink-2); box-sizing: border-box; }
.stat-tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin: 12px 0 16px; }
.ctip { position: fixed; z-index: 50; background: var(--c-tip-bg); color: var(--c-tip-ink); padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; pointer-events: none; max-width: 300px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.ctip .ctip-v { font-weight: 600; font-size: 14px; }
.tbl-wrap { overflow-x: auto; } .tbl { border-collapse: collapse; width: 100%; font-size: 13px; } .tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--c-line); text-align: left; white-space: nowrap; } .tbl td.num { text-align: right; }
.legend .dash { width: 18px; height: 0; border-top: 2px dashed var(--c-ink-2); display: inline-block; } .legend .dash.dot2 { border-top: 2px dotted var(--ch-off); }
.chart .ax.ref { font-weight: 600; }
.chart .ax.x2 { fill: var(--c-info); font-weight: 600; }

/* погода в истории */
.wx { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 5px; border-radius: 999px; font-size: 13px; margin-right: 8px; white-space: nowrap; flex: none; }
.wx .num { font-weight: 600; }
.wx-cold { background: var(--wx-cold-bg); color: var(--wx-cold-ink); } .wx-zero { background: var(--wx-zero-bg); color: var(--wx-zero-ink); } .wx-warm { background: var(--wx-warm-bg); color: var(--wx-warm-ink); }
.wx-panel h2 { display: flex; align-items: center; gap: 6px; }
.wx-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.num.mid { font-size: 20px; line-height: 1.3; }
.wx-t-cold { color: var(--wx-cold-ink); } .wx-t-warm { color: var(--wx-warm-ink); }
.spark { width: 100%; height: 56px; display: block; margin-top: 12px; }
.ctip[hidden] { display: none; } .wx:focus-visible { outline: 2px solid var(--c-ink); outline-offset: 2px; }

/* квартиры */
.place-sw { display: inline-flex; align-items: center; gap: 8px; background: var(--c-field-bg); border: 1.5px solid var(--c-field-line); border-radius: 999px; padding: 4px 6px 4px 12px; margin-bottom: 16px; }
.place-sw select { border: 0; background: transparent; font: inherit; font-weight: 600; padding: 6px 4px; max-width: 70vw; }
.pl-in { width: 100%; color: var(--c-ink); border: 0; border-bottom: 1.5px dashed var(--c-field-line); background: transparent; font: inherit; font-weight: 600; padding: 4px 0; }
.pl-in:focus { outline: none; border-bottom-color: var(--c-ink); }
.docs { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
.docs li { display: flex; align-items: center; gap: 12px; background: var(--c-housing); border-radius: 12px; padding: 8px; }
.doc-th { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; background: var(--c-surface); display: grid; place-items: center; flex: none; }
.doc-th img { width: 100%; height: 100%; object-fit: cover; } .doc-th .pdf { font: 700 13px var(--mono); color: var(--c-bad); }
/* платёжки к записям истории */
.panel.bills { margin-top: var(--sp-4); }
.panel.bills h2 { display: flex; align-items: center; gap: 8px; }
.bills .docs .grow { min-width: 0; }
.bills .bill-name { display: block; overflow-wrap: anywhere; }
.bills .doc-th img { cursor: zoom-in; }
/* узкий экран: в строке истории — текст на всю ширину, погода и статус строкой ниже */
@media (max-width: 480px) {
  [data-key="reading-list"] .rowlink { flex-wrap: wrap; row-gap: 6px; }
  [data-key="reading-list"] .rowlink > .grow { flex: 1 1 100%; }
  [data-key="reading-list"] .rowlink > .wx { margin-left: 0; }
}
.theme-btn { display: grid; place-items: center; width: var(--tap); height: var(--tap); border: 1.5px solid var(--c-field-line); border-radius: 50%; background: var(--c-surface); color: var(--c-ink); cursor: pointer; flex: none; }
.theme-btn:hover { border-color: var(--c-ink-2); }
.top .theme-btn + .btn { margin-left: var(--sp-2); }
/* узкие телефоны (320–359 px): шапка «логотип · ТЕСТ · тема · ✕» не влезала — страница ездила вбок */
.brand { min-width: 0; } .brand span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 359px) {
  .top { gap: 4px; padding: var(--sp-3); } .brand { gap: 6px; }
  .beta { font-size: 10px; padding: 4px 6px; }
  .top .theme-btn { width: 44px; height: 44px; } .top .btn { min-height: 44px; padding: 0 10px; } .top .theme-btn + .btn { margin-left: 0; }
}

/* просмотр фото на весь экран */
.pv { position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, .94); touch-action: none; overflow: hidden; overscroll-behavior: contain; }
.pv img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; }
.pv-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: calc(env(safe-area-inset-top) + 10px) 12px 10px; background: linear-gradient(rgba(0,0,0,.6), transparent); color: #fff; }
.pv-n { margin-right: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.pv-b { width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .16); color: #fff; font-size: 28px; line-height: 1; display: grid; place-items: center; cursor: pointer; }
.pv-b:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.thumbs img[data-pv], .ph-fields img[data-pv] { cursor: zoom-in; }
/* узкий телефон (≤ 420 px): «Закрити» — только крестиком, иначе шапка шире экрана и страница уменьшается */
@media (max-width: 420px) { .cl-txt { display: none; } .pv-bar { box-sizing: border-box; } }

/* загрузка: значок-кольцо, кнопка «в работе», полоса хода */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; flex: none; width: 20px; height: 20px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -4px; }
.banner > .spin { width: 22px; height: 22px; margin-top: 2px; }
.btn[aria-busy="true"] { pointer-events: none; opacity: .85; }
.btn[aria-busy="true"]::before { content: ''; flex: none; width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.pbar { height: 6px; border-radius: 3px; background: var(--c-line); overflow: hidden; margin-top: 10px; }
.pbar i { display: block; height: 100%; background: var(--c-accent, var(--c-ink)); border-radius: 3px; transition: width .4s ease; }
@media (prefers-reduced-motion: reduce) { .spin, .btn[aria-busy="true"]::before { animation-duration: 2.4s; } .pbar i { transition: none; } }
/* советы, как фотографировать */
.tips-box { margin: 0 0 var(--sp-4); border: 1px solid var(--c-line); border-radius: 12px; background: var(--c-surface); padding: 10px 14px; }
.tips-box summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; min-height: 32px; }
.tips-box ul { margin: 8px 0 4px; padding-left: 20px; }
.tips-box li { margin: 4px 0; line-height: 1.4; }

/* фото ещё грузится / декодируется — под ним крутится кольцо (картинка непрозрачная и закроет его, когда появится) */
.pv-spin { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; color: #fff; border-width: 3.5px; }
.pv-spin[hidden] { display: none; }
.thumbs li::before, .src-w::before { content: ''; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2.5px solid var(--c-ink-2); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.thumbs img { position: relative; }
.src-w { position: relative; flex: none; display: block; width: 52px; height: 52px; }
.src-w .src { position: relative; display: block; }
@media (prefers-reduced-motion: reduce) { .thumbs li::before, .src-w::before { animation-duration: 2.4s; } }

/* поля ввода без .field (настройки, формы) — те же различимые границы */
input[type=text]:not(.dmy-native):not(.pl-in), input[type=email], input[type=password], input[type=tel], input[type=number], select, textarea { color: var(--c-ink); }
.place-sw select { color: var(--c-ink); }
.choice input, .models input { accent-color: var(--c-ink); }

/* текст-подсказка в полях — тот же контраст, что у второстепенного текста */
::placeholder { color: var(--c-ink-2); opacity: 1; }
/* «Мій лічильник» на главной — вся строка ведёт в настройки */
.tap-row { padding: 0 !important; }
.row-link { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; color: inherit; text-decoration: none; min-height: var(--tap); }
.row-link:hover { background: var(--c-ghost-hover); }
.row-link .ico { color: var(--c-ink-2); flex: none; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--c-info); } 100% { box-shadow: 0 0 0 3px transparent; } }
#meter-block:focus { outline: none; } #meter-block { scroll-margin-top: 76px; }
/* справка и советы: группы-плашки с аккордеоном */
.acc-groups { display: grid; gap: var(--sp-4); }
.acc-group { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 16px; padding: 6px 0; overflow: hidden; scroll-margin-top: 16px; }
.acc-group > h2 { display: flex; align-items: center; gap: 10px; margin: 0; padding: 14px 18px 8px; font-size: 19px; }
.acc-group > h2 .ico { color: var(--c-info); }
.acc { border-top: 1px solid var(--c-line); }
.acc:first-of-type { border-top: 0; }
.acc summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); padding: 10px 18px; font-weight: 600; font-size: 16px; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .ico { color: var(--c-ink-2); flex: none; transition: transform .2s; }
.acc[open] summary .ico { transform: rotate(90deg); }
.acc summary:hover { background: var(--c-ghost-hover); }
.acc summary:focus-visible { outline: 3px solid var(--c-info); outline-offset: -3px; }
.acc-body { padding: 10px 18px 16px; max-width: 70ch; line-height: 1.55; }
.acc-body p { margin: 0 0 8px; } .acc-body ul, .acc-body ol { padding-left: 1.3em; margin: 0 0 8px; } .acc-body li { margin-bottom: 6px; }
@media (prefers-reduced-motion: reduce) { .acc summary .ico { transition: none; } .flash { animation: none; } }
/* политика и условия */
.legal h2 { font-size: 18px; margin: 0 0 8px; } .legal p, .legal ul { margin: 0 0 6px; line-height: 1.55; max-width: 70ch; } .legal ul { padding-left: 1.3em; } .legal li { margin-bottom: 4px; }
.legal-foot { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; margin: 28px 0 8px; padding-top: 16px; border-top: 1px solid var(--c-line); font-size: 14px; }
.legal-foot a { color: var(--c-ink-2); min-height: 44px; display: inline-flex; align-items: center; }

/* ввод показаний на телефоне: меньше пустоты между полем и кнопками; с открытой клавиатурой — запас снизу,
   чтобы кнопки можно было поставить прямо над клавиатурой (а сверху остались подсказка и пример экрана) */
@media (max-width: 959px) { .wiz .field { margin-bottom: 4px; } .wiz .field .help { margin-top: 4px; } .wiz-actions { margin-top: 10px; } }
.kb-open .wiz { padding-bottom: 70vh; }

/* Шаги ввода на телефоне — компактно, чтобы на одном экране были: что нажать, пример экрана, поле и «Далі» */
@media (max-width: 959px) {
  .wiz { gap: var(--sp-3); }
  .wiz-top { margin-bottom: var(--sp-3); }
  .wiz .press { margin-bottom: var(--sp-2); font-size: 18px; }
  .wiz .press .times { font-size: 18px; }
  .step-lcd { padding-top: 10px; padding-bottom: 10px; }
  .step-lcd svg.seg { height: 40px; }
  .wiz .lcd-cap { margin-top: 4px; }
  .wiz .hint { margin: 6px 0 0; font-size: var(--fs-s); line-height: 1.4; }
  .wiz .sleep { margin-top: 6px; font-size: 13px; }
  .wiz h1 { font-size: 22px; margin: 0 0 8px; }
}
/* открыта клавиатура: убрать всё второстепенное — остаются шаг, что нажать, пример экрана, поле и кнопки */
.kb-open .top, .kb-open .date-chip, .kb-open .wiz .lcd-cap, .kb-open .wiz .sleep, .kb-open .fab { display: none !important; }
.kb-open .wiz-top { margin-bottom: 6px; }
.kb-open .step-lcd svg.seg { height: 30px; }
.kb-open .step-lcd { padding-top: 6px; padding-bottom: 6px; }
.kb-open .wiz .hint { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; }
.kb-open .wiz { gap: 8px; }
.kb-open .wiz h1 { font-size: 19px; margin-bottom: 6px; }
.kb-open .wiz .field .help:empty { min-height: 0; margin: 0; }

/* ===== Главная: три карточки учёта (опалення, гаряча, холодна) ===== */
.ucards { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); margin-bottom: 8px; }
@media (min-width: 720px) { .ucards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ucard { position: relative; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 16px; }
.ucard-main { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; min-height: 124px; color: inherit; text-decoration: none; border-radius: 16px; }
.ucard-main:hover { background: var(--c-ghost-hover); }
.ucard-main:focus-visible { outline: 3px solid var(--c-info); outline-offset: 2px; }
.ucard-top { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; min-height: 48px; padding-right: 60px; }
.ucard-heat .ucard-top .ico, .ucard-hot .ucard-top .ico, .c-hot { color: var(--c-supply); }
.ucard-cold .ucard-top .ico, .c-cold { color: var(--c-return); }
.ucard-val { font: 600 28px/1.15 var(--mono); margin-top: 6px; overflow-wrap: anywhere; }
.ucard-val small { font: 500 14px var(--font); color: var(--c-ink-2); }
.ucard-disp { margin: 4px 0 6px; display: grid; gap: 8px; }
.ucard-sub { font-size: 14px; color: var(--c-ink-2); }
.ucard-status { font-size: 14px; font-weight: 600; margin-top: 4px; color: var(--c-ink-2); }
.ucard-status.ok { color: var(--c-ok); } .ucard-status.due { color: var(--c-info); } .ucard-status.warn { color: var(--c-warn); }
.ucard-add { position: absolute; right: 12px; top: 12px; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--c-ink); color: var(--c-on-ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 12px var(--c-shadow); }
.ucard-add:hover { background: var(--c-ink-hover); }
.ucard-add:focus-visible { outline: 3px solid var(--c-info); outline-offset: 3px; }
/* ЖК на карточке тепла: во всю ширину, цифры не выше 44 px */
.lcd.card { padding: 10px 12px 8px; border-width: 4px; }
.lcd.card .line { justify-content: space-between; }
.lcd.card svg.seg { height: 44px; flex: 0 1 auto; min-width: 0; }
.lcd.card .tag { flex: none; }
.ucards-hint { margin: 4px 2px 16px; }

/* ===== Вода: экран вида, ввод, передача ===== */
.wmeters { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); margin-bottom: 16px; }
.wmeter { margin: 0; }
.wmeter .big small { font: 500 14px var(--font); color: var(--c-ink-2); }
.wsend h2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cmd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.cmd code { flex: 1 1 220px; font: 600 16px/1.4 var(--mono); background: var(--c-field-bg); border: 1.5px solid var(--c-field-line); border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; user-select: all; }
.wsteps { padding-left: 1.3em; } .wsteps li { margin-bottom: 10px; }
.wvals { list-style: none; padding: 0; margin: 8px 0; }
.wvals li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--c-line); }
.wvals li > span:first-child { flex: 1; } .wvals b { font: 600 18px var(--mono); }
.wfield .ctl { position: relative; }
.wcam { flex: none; display: grid; place-items: center; width: 52px; border-left: 1.5px solid var(--c-field-line); cursor: pointer; color: var(--c-ink-2); }
.wcam:hover { background: var(--c-ghost-hover); color: var(--c-ink); }
.wcam:focus-within { outline: 3px solid var(--c-info); outline-offset: -3px; }
.wcam[aria-busy="true"] { opacity: .5; pointer-events: none; }
.wz-opts { display: grid; gap: 10px; margin: 8px 0 12px; }
.wz-opt { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--c-field-line); border-radius: 14px; background: var(--c-surface); cursor: pointer; color: inherit; text-decoration: none; font: inherit; text-align: left; width: 100%; }
.wz-opt > span { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.wz-opt:has(input:checked) { border-color: var(--c-ink); box-shadow: 0 0 0 2px var(--c-ink) inset; }
.wz-opt input { width: 20px; height: 20px; accent-color: var(--c-ink); flex: none; }
.field label.wz-opt { display: flex; margin-bottom: 0; font-weight: inherit; }
.wz-opt:hover { background: var(--c-ghost-hover); }
.wz-link .ico:first-child { color: var(--c-info); }
.wm-row { border: 1px solid var(--c-line); border-radius: 12px; padding: 8px 14px 12px; margin: 0 0 12px; }
.wm-row legend { font-weight: 600; padding: 0 6px; display: flex; align-items: center; gap: 6px; }
.wh .grow b { margin-right: 6px; }
.field .wcam { margin: 0; font-weight: 400; display: grid; place-items: center; }
#wsend-vk { scroll-margin-top: 16px; } #wsend-vk:focus, #water-block:focus { outline: none; } #water-block { scroll-margin-top: 76px; }

/* барабан водоміра на привітанні: чорні ролики (м³) + червоні (дроби) */
.drum { display: flex; align-items: center; gap: 3px; width: max-content; margin: 14px auto 0; padding: 6px 8px; border-radius: 8px; background: #3a3d40; box-shadow: inset 0 1px 3px #0008; }
.drum span { width: 24px; height: 36px; display: grid; place-items: center; border-radius: 2px; font: 600 22px/1 var(--mono); color: #f3f3f3;
  background: linear-gradient(#08090a, #2a2c2e 50%, #08090a); }
.drum span.r { background: linear-gradient(#6e0d12, #c8151d 50%, #6e0d12); }
.drum small { margin-left: 6px; color: #e8e8e8; font-size: 14px; }

/* табло водоміра: циферблат з кільцем кольору виду, вікно з роликами (чорні — м³, червоні — літри), відблиск скла */
.wdrum { --ring: var(--c-return); --plate: radial-gradient(130% 160% at 25% 0%, #FFFFFF, #E4E9EC 72%); --plate-ink: #24323A;
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--plate);
  border: 3px solid var(--ring); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), inset 0 -3px 8px rgba(0, 0, 0, .08), 0 1px 3px var(--c-shadow); container-type: inline-size; }
.wdrum.hot { --ring: var(--c-supply); }
:root[data-theme="dark"] .wdrum { --plate: radial-gradient(130% 160% at 25% 0%, #DDE3E6, #B9C2C7 75%); }
.wd-win { position: relative; flex: 1 1 auto; min-width: 0; max-width: 360px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px;
  padding: 4px; border-radius: 6px; background: #0A0B0C; box-shadow: inset 0 2px 5px #000, 0 0 0 1px rgba(0, 0, 0, .35); }
.wd-win::after { content: ''; position: absolute; inset: 0; border-radius: 6px; pointer-events: none; background: linear-gradient(180deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 45%); }
.wd-c { aspect-ratio: .66; display: grid; place-items: center; border-radius: 2px; color: #F4F5F6; font: 600 clamp(14px, 7.2cqw, 34px)/1 var(--mono);
  background: linear-gradient(180deg, #000 0%, #2A2D30 18%, #3D4145 50%, #2A2D30 82%, #000 100%); text-shadow: 0 1px 0 #000; }
.wd-c.r { color: #FFF1F1; background: linear-gradient(180deg, #43050A 0%, #9E121A 20%, #CE1D27 50%, #9E121A 80%, #43050A 100%); }
.wd-u { flex: none; font: 600 15px/1 var(--font); color: var(--plate-ink); }
.wdrum.hero { padding: 14px 16px; border-width: 4px; max-width: 470px; }
.wdrum.hero .wd-win { gap: 3px; padding: 5px; max-width: none; }
.wdrum.sm { padding: 6px 10px; border-width: 2px; }
.wd-multi { display: grid; gap: 4px; }
.wd-name { font-size: 13px; font-weight: 600; color: var(--c-ink-2); }

/* общие вкладки: переключатель «Опалення · Гаряча · Холодна» */
.kind-sw { display: flex; gap: 4px; background: var(--c-field-bg); border: 1.5px solid var(--c-field-line); border-radius: var(--r-pill); padding: 3px; margin: 0 0 var(--sp-4); max-width: 520px; }
.kind-sw button { flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: transparent; min-height: 40px; padding: 0 10px; border-radius: var(--r-pill); font: 600 15px var(--font); color: var(--c-ink-2); cursor: pointer; white-space: nowrap; }
.kind-sw button:hover { color: var(--c-ink); }
.kind-sw button[aria-pressed="true"] { background: var(--c-surface); color: var(--c-ink); box-shadow: 0 1px 3px rgba(0,0,0,.18), inset 0 0 0 1.5px var(--c-ink); }
.kind-sw .c-heat { color: var(--c-supply); }
@media (max-width: 380px) { .kind-sw button { font-size: 14px; padding: 0 6px; gap: 4px; } }
.list.wh .rowlink .pill { flex: none; }
.ph-n { display: inline-flex; align-items: center; gap: 3px; color: var(--c-ink-2); font-size: 14px; flex: none; }
/* фото в записи истории */
.hphotos { margin: var(--sp-4) 0; }
.hphotos .section-title { display: flex; align-items: center; gap: 6px; }
.hphotos .thumbs { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
.hphotos img { cursor: zoom-in; }
.thumbs .gone-t { display: none; }
.thumbs li.gone::before { display: none; }
.thumbs li.gone img { display: none; }
.thumbs li.gone .gone-t { display: grid; place-items: center; height: 100%; padding: 6px; text-align: center; font-size: 12px; color: var(--c-ink-2); }
.thumbs .n.n-hot { background: var(--c-supply); } .thumbs .n.n-cold { background: var(--c-return); }

/* вода по фото */
.wn-photo { margin-bottom: var(--sp-4); }
.wn-photo .thumbs { margin: var(--sp-3) 0 var(--sp-2); grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
.wn-photo .thumbs img { cursor: zoom-in; }
.wn-tags { position: absolute; left: 4px; right: 4px; bottom: 4px; display: flex; flex-wrap: wrap; gap: 3px; }
.wn-tags i { font-style: normal; font-size: 12px; font-weight: 600; color: #fff; border-radius: 6px; padding: 0 6px; }
.wn-tags i.n-hot, .thumbs .n-hot { background: var(--c-supply); } .wn-tags i.n-cold, .thumbs .n-cold { background: var(--c-return); }
.wsrc { flex: none; display: grid; place-items: center; width: 48px; border-left: 1.5px solid var(--c-field-line); }
.wsrc img { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; cursor: zoom-in; display: block; }

/* настройки: флажок строкой */
.check-row { display: flex; align-items: center; gap: 10px; min-height: var(--tap); cursor: pointer; font-weight: 600; }
.check-row input { width: 22px; height: 22px; accent-color: var(--c-ink); flex: none; }

/* «Скасувати й вийти» внизу ввода; черновик на главной */
.wiz-cancel { margin: var(--sp-5) 0 0; text-align: center; }
.wiz-cancel .linkbtn { color: var(--c-bad); }
.home-draft { margin-bottom: 16px; display: grid; gap: 6px; justify-items: center; }
.home-draft .btn { width: 100%; }
.home-draft .linkbtn { color: var(--c-ink-2); }

/* «Куди передати»: адресати по черзі — хто, за що, строк, готові цифри, кнопки-переходи */
.where { margin-top: var(--sp-4); }
.where > h2 { display: flex; align-items: center; gap: 8px; }
/* «Куди передати» на сторінці лічильника — акордеон */
details.wacc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; margin: -4px 0; min-height: 44px; color: inherit; text-decoration: none; }   /* details.where (подсказка «где модель») красит summary ссылкой — тут не надо */
.wacc > summary::-webkit-details-marker { display: none; }
.wacc > summary h2 { display: flex; align-items: center; gap: 8px; margin: 0; flex: 1; }
.wacc > summary .pacc-chev { transform: rotate(90deg); transition: transform .15s; color: var(--c-ink-2); flex: none; }
.wacc[open] > summary .pacc-chev { transform: rotate(-90deg); }
.wacc[open] > .where-b { margin-top: 12px; }
.mb-newer { margin: 4px 0 0; }
.where > h2 .ico { flex: none; }
.dest { padding: 14px 0 4px; }
.dest + .dest { border-top: 1px solid var(--c-line); margin-top: 10px; }
.dest:focus { outline: none; }
.dest-h { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.dest-h .grow { flex: 1 1 200px; min-width: 0; }
.dest-h b { font-size: var(--fs-m); }
.dest-h .pill { flex: none; margin-top: 2px; }
.dest-ch { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.dest-ch .btn { flex: 1 1 200px; justify-content: center; }
.dest-more { margin: 10px 0 0; }
.dest-more a, .where a[href^="tel:"] { white-space: nowrap; }
.dest .cmd { margin-top: 6px; }
/* бот Водоканалу: «Що відповів бот?» і переслана відповідь */
.vk-ask { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--c-field-bg); border: 1.5px solid var(--c-field-line); }
.vk-ask > p:first-child { margin: 0 0 8px; } .vk-ask .row-actions { flex-wrap: wrap; } .vk-ask .vk-tips { margin-top: 10px; } .vk-ask .vk-tips ul { margin: 0 0 10px; padding-left: 20px; }
.vk-reply { margin-top: 10px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--c-field-line); }
.vk-reply.ok { border-color: var(--c-ok, #1E7B4C); } .vk-reply.bad { border-color: var(--c-bad, #A3142E); }
.vk-reply p { margin: 0 0 4px; } .vk-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.dest .tips-box { margin-top: 12px; }
.dest-mark { margin: 12px 0 0; }
.gap-add { margin: 12px 0 0; }
.gap-add a { display: inline-flex; align-items: center; gap: 8px; }
.gap-add a .ico { flex: none; }
.gap-row .rowlink { gap: 12px; }
.gap-row .rowlink > .ico { flex: none; }
.wm-col { display: grid; gap: var(--sp-4); align-content: start; }
.wm-col .panel { margin: 0; }
.wmeter h2 { margin-bottom: 12px; }
#gap-form .choice { margin-top: 4px; }
#gap-form .check-row { margin: 12px 0 4px; align-items: flex-start; font-weight: 400; }
#gap-form .check-row input { margin-top: 2px; }
#gap-form fieldset { border: 0; padding: 0; margin: 0 0 var(--sp-3); min-width: 0; }
.gap-row .grow .ico { vertical-align: -3px; }
.nm-rules { list-style: disc; padding-left: 20px; margin: 4px 0 14px; display: grid; gap: 6px; }
#gp-est .tbl td .muted { font-weight: 400; }
#gp-est .stat-tiles { grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px 14px; }
#gp-est .num.big { font-size: 22px; line-height: 1.2; } #gp-est .num.big .small { white-space: nowrap; }
#gp-est .tbl th, #gp-est .tbl td { padding: 6px 4px; }
#gp-est .tbl { font-size: 13px; }
.banner ul.plain { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 2px; }
.ucard .empty { opacity: .5; filter: saturate(.4); }

.beta .ver { text-transform: none; letter-spacing: 0; font-weight: 500; opacity: .85; white-space: nowrap; }
.beta { white-space: nowrap; }
/* кнопка «Уся історія (N)» и ссылки под списком — не прилипают к нему */
.list + p, .list + .gap-add { margin-top: var(--sp-3); }
.wq-photo { margin-top: var(--sp-3); }

/* настройки: группы-аккордеоны */
.pgroups { display: grid; gap: 10px; margin-bottom: var(--sp-5); }
.pgroup { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 14px; }
.pgroup > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 64px; cursor: pointer; border-radius: 14px; }
.pgroup > summary::-webkit-details-marker { display: none; }
.pgroup > summary:hover { background: var(--c-ghost-hover); }
.pgroup > summary:focus-visible { outline: 3px solid var(--c-info); outline-offset: 2px; }
.pgroup > summary > .ico:first-child { flex: none; color: var(--c-ink-2); }
.pgroup > summary > .ico:last-child { flex: none; margin-left: auto; transition: transform .15s; color: var(--c-ink-2); }
.pgroup[open] > summary > .ico:last-child { transform: rotate(90deg); }
.pg-t { display: grid; gap: 2px; min-width: 0; }
.pg-t b { font-size: var(--fs-m); }
.pg-body { padding: 0 16px 8px; }
.pg-body > .panel, .pg-body > details.tips-box { background: transparent; padding: 0; margin: 0 0 var(--sp-4); border-radius: 0; }
.pg-body > .panel + .panel { border-top: 1px solid var(--c-line); padding-top: var(--sp-4); }

/* Итог «сколько и почём» — один шаблон для тепла и воды (статистика, економія) */
.kpi { margin: 12px 0 16px; padding: 16px 18px; border-radius: 16px; background: var(--c-surface-2, var(--c-surface)); border: 1px solid var(--c-line); border-left: 4px solid var(--c-supply); }
.kpi.hot { border-left-color: var(--c-return); } .kpi.cold { border-left-color: var(--c-info); }
.kpi-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; }
.kpi-q b, .kpi-m b { font-size: 34px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi-q span, .kpi-m span { margin-left: 6px; font-size: 17px; font-weight: 600; color: var(--c-ink-2); }
.kpi-m b { color: var(--c-ink); }
.kpi-cap { margin-top: 6px; font-size: 14px; color: var(--c-ink-2); }
.kpi-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.kchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 13px; background: var(--c-housing); color: var(--c-ink); }
.kchip svg { flex: none; opacity: .75; }
.kpi-tip { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 10px; padding: 12px 14px; border-radius: 12px; background: var(--c-info-soft); color: var(--c-ink); }
.kpi-tip svg { flex: none; margin-top: 2px; color: var(--c-info); } .kpi-tip p { margin: 0; }
@media (max-width: 420px) { .kpi { padding: 14px; } .kpi-q b, .kpi-m b { font-size: 28px; } .kpi-row { gap: 4px 18px; } }
/* Строка истории: главное — расход и деньги */
.hrow .hr-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; }
.hrow .hr-q, .hrow .hr-m { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hrow .hr-q small, .hrow .hr-m small { font-size: 13px; font-weight: 600; color: var(--c-ink-2); }
.hrow .hr-none { font-size: 15px; font-weight: 600; color: var(--c-ink-2); }
.hrow .hr-sub { margin-top: 2px; font-size: 13px; color: var(--c-ink-2); }
.hrow .hr-date { margin-bottom: 6px; font-size: 13px; color: var(--c-ink-2); }
.hrow .hr-ico { align-self: center; display: inline-flex; margin-right: -8px; }
/* узкий экран: строка истории (тепло и вода) — главное на всю ширину, значки (погода, статус) компактно строкой ниже */
@media (max-width: 520px) {
  .list a.hrow { flex-wrap: wrap; row-gap: 6px; column-gap: 8px; }
  .list a.hrow > .grow { flex: 1 1 100%; }
  .list a.hrow > .wx { margin-left: 0; }
  .list a.hrow > .pill, .list a.hrow > .wx, .list a.hrow > .ph-n { font-size: 12px; padding: 2px 9px; min-height: 0; }
  .hrow .hr-q, .hrow .hr-m { font-size: 18px; }
}

/* ---- квартиры: цвет-метка (вдобавок к названию), шапка «где я», список, экран квартиры, «додати лічильник» ---- */
:root { --pc-teal: #1F7A6E; --pc-violet: #6A4BB0; --pc-amber: #9A6200; --pc-green: #3B7A1E; --pc-rose: #B0386A; --pc-slate: #52606E; --c-gas: #8A6400; --c-elec: #6A4BB0; }
:root[data-theme="dark"] { --pc-teal: #5CC2B1; --pc-violet: #B49CF0; --pc-amber: #E2B05C; --pc-green: #8ACB6A; --pc-rose: #F08DB5; --pc-slate: #A6B4C4; --c-gas: #E2B05C; --c-elec: #B49CF0; }
.c-heat { color: var(--c-supply); } .c-gas { color: var(--c-gas); } .c-elec { color: var(--c-elec); }
.place-bar { display: flex; align-items: center; gap: 10px; background: var(--c-surface); border: 1px solid var(--c-line); border-left: 8px solid var(--pc); border-radius: 12px; padding: 6px 6px 6px 14px; margin: 0 0 var(--sp-4); min-width: 0; }
.place-bar .pb-name { flex: 1; min-width: 0; display: flex; flex-direction: column; color: inherit; text-decoration: none; padding: 4px 0; }
.place-bar .pb-name b { font-size: var(--fs-m); line-height: 1.25; overflow-wrap: anywhere; }
.place-bar .pb-name .small, .place-bar .pb-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.place-bar .pb-all { flex: none; min-height: 44px; padding: 0 12px; font-size: var(--fs-s); }
.place-bar.compact { gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
.place-bar.compact b { font-size: var(--fs-s); }
@media (max-width: 380px) { .place-bar .pb-all .ico { display: none; } .place-bar .pb-all { padding: 0 10px; } }
.ucard-addm { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 16px; min-height: 68px; border: 2px dashed var(--c-field-line); border-radius: 16px; background: transparent; color: var(--c-ink); font: inherit; text-align: left; cursor: pointer; }
.ucard-addm:hover { background: var(--c-ghost-hover); border-color: var(--c-ink-2); }
.ucard-addm:focus-visible { outline: 3px solid var(--c-info); outline-offset: 2px; }
.ucard-addm .am-plus { width: 44px; height: 44px; border-radius: 50%; background: var(--c-ink); color: var(--c-on-ink); display: grid; place-items: center; flex: none; }
.ucard-addm .am-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ucard-addm .am-txt b { font-size: var(--fs-m); }
.ucard-addm.big { flex-direction: column; text-align: center; padding: 28px 18px; gap: 12px; background: var(--c-surface); }
.ucard-addm.big .am-plus { width: 60px; height: 60px; }
.ucard-addm.big .am-txt b { font-size: var(--fs-l); }
.ucard-addm .am-cta { pointer-events: none; }
.am-opt .ico.c-hot, .am-opt .ico.c-heat { color: var(--c-supply); } .am-opt .ico.c-cold { color: var(--c-return); }
.am-opt .ico.c-gas { color: var(--c-gas); } .am-opt .ico.c-elec { color: var(--c-elec); }
.am-opt > .ico:first-child { flex: none; }
.am-soon { cursor: default; opacity: .62; } .am-soon:hover { background: var(--c-surface); }
.am-have { opacity: .8; }
.am-opt > .pill { flex: none; }
.pl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pl-card { background: var(--c-surface); border: 1px solid var(--c-line); border-left: 8px solid var(--pc); border-radius: 14px; overflow: hidden; }
.pl-main { display: flex; flex-direction: column; gap: 2px; position: relative; width: 100%; padding: 12px 48px 12px 16px; min-height: 64px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; text-decoration: none; cursor: pointer; }
.pl-main:hover { background: var(--c-ghost-hover); }
.pl-main > .ico { position: absolute; right: 14px; top: 50%; margin-top: -10px; color: var(--c-ink-2); }
.pl-t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .pl-t b { font-size: var(--fs-l); overflow-wrap: anywhere; }
.pl-ks { color: var(--c-ink-2); }
.pl-set { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-top: 1px solid var(--c-housing); color: var(--c-return); text-decoration: none; font-size: var(--fs-s); }
.pl-set:hover { background: var(--c-ghost-hover); }
.pv-h { display: flex; align-items: flex-start; gap: 12px; }
.pv-h .pv-dot { flex: none; width: 10px; align-self: stretch; min-height: 34px; border-radius: 5px; background: var(--pc); }
.pv-h .pv-sub { display: block; font-weight: 400; margin-top: 4px; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mrow { border: 1px solid var(--c-line); border-radius: 12px; background: var(--c-surface); }
.mrow-main { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 56px; color: inherit; text-decoration: none; border-radius: 12px; }
a.mrow-main:hover { background: var(--c-ghost-hover); }
.mrow-main .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mrow-main .grow b { overflow-wrap: anywhere; }
.mrow-main > .ico { flex: none; } .mrow-main > .ico:last-child { color: var(--c-ink-2); }
.mrow-act { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 12px; }
.mrow-act .btn { min-height: 44px; padding: 0 14px; font-size: var(--fs-s); flex: 1 1 auto; }
.mlist.removed .mrow { background: transparent; border-style: dashed; }
.mlist.removed .mrow-main .btn { flex: none; min-height: 44px; padding: 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: var(--r-pill); border: 1.5px solid var(--c-field-line); background: var(--c-surface); color: var(--c-ink); font: 500 var(--fs-s) var(--font); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--c-ink); background: var(--c-ink); color: var(--c-on-ink); }
fieldset.field { border: 0; padding: 0; min-width: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 8px; }
.field .swatch { display: inline-grid; margin: 0; cursor: pointer; position: relative; }
.swatch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.swatch .sw-dot { width: 44px; height: 44px; border-radius: 50%; background: var(--pc); display: grid; place-items: center; color: #fff; box-shadow: 0 0 0 2px var(--c-surface), 0 0 0 3px var(--c-line); }
:root[data-theme="dark"] .swatch .sw-dot { color: #0E1412; }
.swatch .sw-dot .ico { opacity: 0; }
.swatch input:checked + .sw-dot { box-shadow: 0 0 0 3px var(--c-surface), 0 0 0 6px var(--c-ink); }
.swatch input:checked + .sw-dot .ico { opacity: 1; }
.swatch input:focus-visible + .sw-dot { outline: 3px solid var(--c-info); outline-offset: 6px; }

/* ---- главная-список квартир (этап 2): карточка квартиры со статусом каждого счётчика ---- */
.ov-list { gap: 14px; }
.ov-card .pl-main { gap: 6px; padding: 14px 48px 14px 16px; }
.ov-card .pl-t b { font-size: var(--fs-l); }
.ov-next { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: var(--fs-s); margin-top: 2px; }
.ov-next.due { color: var(--c-info); } .ov-next.warn { color: var(--c-warn); } .ov-next.ok { color: var(--c-ok); }
.ov-rows { display: flex; flex-direction: column; gap: 0; margin-top: 4px; border-top: 1px solid var(--c-housing); }
.ov-row { display: grid; grid-template-columns: 22px minmax(0, auto) minmax(0, 1fr); align-items: center; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--c-housing); }
.ov-row:last-child { border-bottom: 0; }
.ov-k { font-weight: 600; overflow-wrap: anywhere; }
.ov-st { justify-self: end; text-align: right; font-size: var(--fs-s); color: var(--c-ink-2); }
.ov-st.ok { color: var(--c-ok); } .ov-st.due { color: var(--c-info); } .ov-st.warn { color: var(--c-warn); font-weight: 600; }
@media (max-width: 400px) { .ov-row { grid-template-columns: 22px minmax(0, 1fr); } .ov-st { grid-column: 2; justify-self: start; text-align: left; } }

/* ---- мастер «Додати квартиру» ---- */
.aw-title { margin: 0 0 4px; }
.aw-kinds { display: grid; gap: 10px; margin: 8px 0 16px; }
.aw-kind { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px 12px; padding: 12px 12px 12px 16px; border: 1.5px solid var(--c-field-line); border-radius: 14px; background: var(--c-surface); }
.aw-kind.on { border-color: var(--c-ink); box-shadow: 0 0 0 1px var(--c-ink) inset; }
.aw-kind.am-soon { opacity: .6; }
.aw-kt { display: flex; flex-direction: column; gap: 2px; min-width: 0; } .aw-kt b { font-size: var(--fs-m); }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper .step-b { min-width: 48px; min-height: 48px; padding: 0; font-size: 26px; line-height: 1; border-radius: 12px; }
.stepper .step-n { min-width: 44px; text-align: center; font-size: var(--fs-l); font-weight: 700; }
.stepper .step-n .small { font-size: 13px; font-weight: 500; }
@media (max-width: 400px) { .aw-kind { grid-template-columns: 28px minmax(0, 1fr); } .aw-kind .stepper, .aw-kind > .pill { grid-column: 1 / -1; justify-self: end; } }
.aw-sum { border-left: 8px solid var(--pc); }
.aw-sum dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.aw-sum dt { color: var(--c-ink-2); } .aw-sum dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 400px) { .aw-sum dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } .aw-sum dd { margin-bottom: 8px; } }
.aw-q { margin-bottom: var(--sp-4); }
.dest-place { margin: 0 0 12px; padding: 4px 0 4px 12px; border-left: 6px solid var(--pc); }

/* ---- світло (этап 3) ---- */
.ucard-elec .ucard-top .ico { color: var(--c-elec); }
.kpi.elec { border-left-color: var(--c-elec); }
.efield { border: 1.5px solid var(--c-line); border-radius: 14px; padding: 12px 16px 4px; margin: 0 0 16px; background: var(--c-surface); min-width: 0; }
.efield legend { font-weight: 600; padding: 0 6px; }
.kind-sw .c-elec { color: var(--c-elec); }
/* четыре вида (тепло, гаряча, холодна, світло) — на телефоне в две строки по два */
@media (max-width: 560px) { .kind-sw.many { display: grid; grid-template-columns: 1fr 1fr; border-radius: 16px; } .kind-sw.many button { border-radius: 12px; } }
/* ---- газ ---- */
.ucard-gas .ucard-top .ico { color: var(--c-gas); }
.kpi.gas { border-left-color: var(--c-gas); }
.kind-sw .c-gas { color: var(--c-gas); }

/* ---- 4 разных табло: тепло — зелёный ЖК, вода — круглый циферблат, свет — тёмный электронный экран, газ — жёлтая панель ---- */
.lcd.elcd { --c-lcd: #14222C; --c-lcd-ink: #D6F0FF; --c-lcd-off: #23394A; background: linear-gradient(180deg, #1B2D3A, #0F1B23); border-color: #C9CED6; outline-color: #7D8794;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, .6), 0 0 0 transparent; padding-top: 8px; }
.lcd.elcd .seg .off { opacity: .45; }
.el-hd { display: flex; align-items: center; gap: 6px; font: 600 12px/1 var(--font); color: #8FB4CC; letter-spacing: .04em; margin-bottom: 4px; }
.el-led { width: 9px; height: 9px; border-radius: 50%; background: #FF4B4B; box-shadow: 0 0 6px #FF4B4B, 0 0 1px #FFF inset; }
.el-u { margin-left: auto; color: #D6F0FF; font-size: 14px; }
.el-z { flex: none; min-width: 34px; font: 600 13px/1.1 var(--font); color: #9FD3F0; border: 1px solid #3F6177; border-radius: 4px; padding: 3px 5px; text-align: center; align-self: center; }
.lcd.elcd .line { align-items: center; gap: 10px; }
.lcd.elcd .line + .line { border-top-color: rgba(214, 240, 255, .18); }
@media (prefers-reduced-motion: no-preference) { .el-led { animation: elblink 2.4s ease-in-out infinite; } @keyframes elblink { 0%, 86%, 100% { opacity: .35; } 90% { opacity: 1; } } }
.gdrum { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 5px; container-type: inline-size;
  background: linear-gradient(180deg, #F7DC6A, #E9BC2E 60%, #D9A91E); border: 3px solid #4B3D12; color: #2E2508;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -3px 8px rgba(0, 0, 0, .12), 0 1px 3px var(--c-shadow); }
:root[data-theme="dark"] .gdrum { background: linear-gradient(180deg, #D9BE55, #C79E28 60%, #B28A1A); }
.gdrum .wd-u { color: #2E2508; }
.gd-side { flex: none; display: grid; justify-items: center; gap: 2px; color: #2E2508; }
.gd-g { font: 700 11px/1 var(--font); border: 1.5px solid #2E2508; border-radius: 3px; padding: 2px 3px; }
.gdrum .wd-win { border-radius: 3px; }
.gdrum.hero { padding: 14px 16px; border-width: 4px; max-width: 470px; }
.gdrum.hero .wd-win { gap: 3px; padding: 5px; max-width: none; }
.gdrum.sm { padding: 6px 10px; border-width: 2px; }
.gdrum.empty .wd-c, .wdrum.empty .wd-c { color: #6B7178; }
/* ---- главная по квартирам: одна — шапка с адресом; несколько — аккордеон ---- */
.hp.one { margin-bottom: 8px; }
.hp-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
.hp-head .hp-ico { flex: none; color: var(--c-ink-2); }
.hp-id { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.hp-name { font-size: var(--fs-l); line-height: 1.25; overflow-wrap: anywhere; }
.hp-addr { font-size: var(--fs-s); color: var(--c-ink-2); overflow-wrap: anywhere; }
.hp-addr .linkbtn { margin-left: 6px; font-size: var(--fs-s); }
.hp-addr-add { display: inline-flex; align-items: center; gap: 4px; justify-self: start; font-size: var(--fs-s); }
.hp-addp { flex: none; min-height: 44px; padding: 0 14px; }
.hp-edit { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 14px; padding: 14px 16px 6px; margin: 0 0 12px; }
.hp-edit .pv-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.hp-list { display: grid; gap: 12px; }
.pacc { background: var(--c-surface); border: 1px solid var(--c-line); border-left: 8px solid var(--pc); border-radius: 16px; overflow: hidden; }
.pacc > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; min-height: 64px; }
.pacc > summary::-webkit-details-marker { display: none; }
.pacc > summary:hover { background: var(--c-ghost-hover); }
.pacc-t { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.pacc-t b { font-size: var(--fs-l); line-height: 1.25; overflow-wrap: anywhere; }
.pacc-ks { overflow-wrap: anywhere; }
.pacc-chev { flex: none; transform: rotate(90deg); transition: transform .15s; color: var(--c-ink-2); }
.pacc[open] .pacc-chev { transform: rotate(-90deg); }
.pacc-body { padding: 0 12px 12px; border-top: 1px solid var(--c-line); background: var(--c-surface-2); }
.pacc-body .ucards { margin: 0; }
.hp-tools { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin: 10px 4px; font-size: var(--fs-s); }
.hp-tools a { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
.pacc-body .hp-edit { margin-top: 12px; }
.hp-more { margin: 4px 0 0; }
/* ---- блок счётчика на его странице: название + табло + данные + настройки одним «прибором» ---- */
.mbox { --kc: var(--c-ink-2); border-top: 6px solid var(--kc); padding-top: 14px; }
.mbox-heat { --kc: var(--c-supply); } .mbox-hot { --kc: var(--c-supply); } .mbox-cold { --kc: var(--c-return); }
.mbox-elec { --kc: var(--c-elec); } .mbox-gas { --kc: var(--c-gas); }
.mbox-h { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
.mbox-h > .ico { flex: none; color: var(--kc); }
.mbox-t { display: grid; gap: 1px; min-width: 0; }
.mbox-t b { font-size: var(--fs-l); line-height: 1.2; overflow-wrap: anywhere; }
.mbox-disp { display: grid; }
.mbox-meta { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: var(--fs-s); color: var(--c-ink-2); }
.mbox-meta li::before { content: '·'; margin-right: 6px; color: var(--kc); font-weight: 700; }
.mbox-set { margin-top: 12px; border-top: 1px solid var(--c-line); }
.mbox-set > summary { list-style: none; display: flex; align-items: center; gap: 8px; min-height: 48px; cursor: pointer; font-weight: 600; color: var(--c-ink); }
.mbox-set > summary::-webkit-details-marker { display: none; }
.mbox-set > summary > span { flex: 1 1 auto; }
.mbox-set[open] .pacc-chev { transform: rotate(-90deg); }
.mbox-set-b { padding: 4px 0 8px; }
.mbox-links { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--c-line); font-size: var(--fs-s); }
.mbox-links a { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
.mbox + .mbox { margin-top: 12px; }
/* ---- «лише для себе» и «стартові — передано» ---- */
.pill.own { background: var(--c-surface-2); color: var(--c-ink); border: 1.5px dashed var(--c-field-line); }
.own-box { margin: 14px 0; padding: 10px 14px; border-radius: 12px; border: 1px dashed var(--c-line); }
.own-box.on { border-color: var(--c-field-line); background: var(--c-surface-2); }
.own-box p { margin: 4px 0; }
.own-chk { margin: 12px 0 4px; }
/* ---- первый вход: 4 табло на привітанні, образцы табло в выборе счётчиков ---- */
.whero { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; max-width: 440px; }
.whero-c { margin: 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
.whero-c figcaption { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--c-ink-2); }
.whero-c figcaption .ico { flex: none; }
.whero .lcd { padding: 8px 10px 6px; border-width: 4px; border-radius: 10px; }
.whero .lcd svg.seg { height: 30px; }
.whero .lcd .tag { font-size: 12px; } .whero .lcd .line { gap: 6px; justify-content: space-between; } .whero .lcd .line .tag { padding-bottom: 3px; }
.whero .elcd .el-hd { font-size: 10px; margin-bottom: 2px; } .whero .el-led { width: 7px; height: 7px; } .whero .el-u { font-size: 11px; }
.whero .wdrum, .whero .gdrum { padding: 7px 8px; gap: 6px; border-width: 3px; }
.whero .wd-win { gap: 1px; padding: 3px; } .whero .wd-c { font-size: clamp(10px, 6.4cqw, 20px); } .whero .wd-u { font-size: 12px; }
.whero .gd-side .ico { width: 14px; height: 14px; } .whero .gd-g { font-size: 9px; padding: 1px 2px; }
/* строка вида со образцом табло: на телефоне — образец слева, справа название и под ним +/−; шире — в одну строку */
.aw-kind.kp { grid-template-columns: 108px minmax(0, 1fr); grid-template-areas: "p t" "p s"; gap: 8px 12px; padding: 12px; }
.aw-kind.kp .kprev { grid-area: p; align-self: center; } .aw-kind.kp .aw-kt { grid-area: t; } .aw-kind.kp .stepper, .aw-kind.kp > .pill { grid-area: s; justify-self: start; }

    var today = p.today || ymd(new Date());
    var items = [], d = {};
    var v = {}; FIELDS.forEach(function (f) { if (f.key !== 'date' && f.key !== 'errCode') v[f.key] = num(r[f.key]); });
    var pv = {}; if (prev) FIELDS.forEach(function (f) { if (f.key !== 'date' && f.key !== 'errCode') pv[f.key] = num(prev[f.key]); });

    // --- A. Заполнено ли всё (форма ХТМ требует все 10 значений)
    var missing = FIELDS.filter(function (f) {

      else if (dToday > 2) items.push(item('F_DATE_OLD', 'warn', 'date',

        else if (dd === 0) items.push(item('R_ONE_PER_DATE', 'warn', 'date', 'На цю дату вже є запис — ХТМ дозволяє один запис на дату.', 'На эту дату уже есть запись — ХТМ разрешает одну запись на дату.', 'Нове значення замінить попереднє (редагування останнього запису).', 'Новое значение заменит прежнее (редактирование последней записи).'));

        'Температура ' + f1(t) + ' °C — робот приймає від 5 до 95 і не 0.', 'Температура ' + f1(t) + ' °C — робот принимает от 5 до 95 и не 0.',
        'Навіть при вимкненому опаленні температура не 0. Якщо лічильник показує 0 або нічого — він несправний.',

        'Обратка гарячіша за подачу — схоже, температури переплутані.', 'Обратка горячее подачи — похоже, температуры перепутаны.',
        'Подача (ht) — перша з двох, що чергуються.', 'Подача (ht) — первая из двух чередующихся.'));
      if (v.power !== null && dtNow >= 0) {

        else if (v.flow > 0 && Math.abs(v.power - expected) > Math.max(C.POWER_ABS, Math.abs(expected) * C.POWER_TOL)) items.push(item('P_POWER', 'warn', 'power',

          'Перевірте потужність, витрату і обидві температури — одна з цифр, ймовірно, переписана з помилкою.', 'Проверьте мощность, расход и обе температуры — одна из цифр, вероятно, переписана с ошибкой.', { expected: expected }));
      }
    }

        (ex ? ex[2] + ' ' : '') + 'Поки є помилка, енергія може не рахуватися. Якщо на екрані «E» і лише прочерки — помилки немає, виберіть «Помилок немає».',
        (ex ? ex[3] + ' ' : '') + 'Пока есть ошибка, энергия может не считаться. Если на экране «E» и только прочерки — ошибки нет, выберите «Ошибок нет».'));

    } else {

      mono.forEach(function (m) {

          'Показання, ймовірно, приймуть, але варто зменшити витрату.', 'Показания, вероятно, примут, но стоит уменьшить расход.'));
