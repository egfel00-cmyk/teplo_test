<title>Лічильники — тепло й вода</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Теплосервис — стили. Токены: design/02-brandbook.md, компоненты: design/03-design-system.md */
:root {
  --c-housing: #E9EEEB; --c-surface: #FFFFFF; --c-ink: #17211E; --c-ink-2: #4A5652; --c-line: #CFD7D3;
  /* границы полей ввода и других элементов управления — не меньше 3:1 к фону (WCAG 2.1 / ДСТУ EN 301 549:2022, п. 1.4.11) */
  --c-field-line: #768480; --c-field-bg: #FFFFFF;
  --c-lcd: #BCC8A2; --c-lcd-ink: #1C2618; --c-lcd-off: #AAB78E; --c-bezel: #8E9A94;
  --c-supply: #B53D15; --c-return: #2F68B0;
  --c-ok: #18693F; --c-ok-soft: #DFF1E7; --c-warn: #8F5600; --c-warn-soft: #FBEFD5;
  --c-bad: #A3142E; --c-bad-soft: #F9E1E5; --c-info: #2F68B0; --c-info-soft: #E2ECF8;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
  --r-lcd: 10px; --r-field: 10px; --r-btn: 12px; --r-pill: 999px;
  --fs-s: 15px; --fs-m: 17px; --fs-l: 20px; --fs-xl: 26px; --fs-xxl: 34px;
  --tap: 48px;
  --c-surface-2: #F3F6F4; --c-on-ink: #FFFFFF; --c-ink-hover: #2A3733; --c-ghost-hover: rgba(23, 33, 30, .06); --c-bezel-in: #DCE2DE;
  --c-info-ink: #173A61; --c-warn-ink: #5C3700; --c-bad-ink: #6E0D1F; --c-ok-ink: #134D30; --c-warn-line: #C98A1E; --c-seg-sample: #66745A;
  --c-scrim: rgba(23, 33, 30, .35); --c-scrim-strong: rgba(23, 33, 30, .75); --c-shadow: rgba(23, 33, 30, .14); --c-shadow-strong: rgba(23, 33, 30, .25);
  --c-focus-ring: rgba(47, 104, 176, .25); --c-tip-bg: #17211E; --c-tip-ink: #FFFFFF; --lcd-glow: 0 0 0 transparent;
  --ch-ax: #4A5652; --ch-vl: #17211E; --ch-grid: #E3E8E5; --ch-bar: #2F68B0; --ch-bar-soft: #9DB5D6; --ch-ok: #18693F; --ch-low: #B7791F; --ch-bad: #A3142E; --ch-none: #4A5652; --ch-off: #8E9A94; --ch-dot-ring: #FFFFFF;
  --wx-cold-bg: #E2ECF8; --wx-cold-ink: #24508A; --wx-zero-bg: #EEF1EF; --wx-zero-ink: #4A5652; --wx-warm-bg: #FBEFD5; --wx-warm-ink: #7A4A00;
  --spark-cold: #2F68B0; --spark-warm: #C98A1E; --spark-axis: #CFD7D3;
  color-scheme: light;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", monospace;
}
/* Тёмная тема — «котельная ночью»: графит с зелёным оттенком корпуса (не чистый чёрный), глубина — светлее поверхность,
   а не тень; акценты подачи/обратки и статусы осветлены и приглушены; ЖК-экран светится, как настоящая подсветка. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --c-housing: #0E1412; --c-surface: #161E1B; --c-surface-2: #1E2824; --c-ink: #E3EBE7; --c-ink-2: #9EACA6; --c-line: #2D3934;
  --c-field-line: #7B8A84; --c-field-bg: #0B110F;
  --c-lcd: #A8BB7C; --c-lcd-ink: #10170C; --c-lcd-off: #97AA6C; --c-bezel: #46534E; --c-bezel-in: #27312D; --c-seg-sample: #5E6E4C;
  --lcd-glow: 0 0 28px rgba(168, 187, 124, .22), 0 0 2px rgba(168, 187, 124, .35);
  --c-supply: #F0906A; --c-return: #8DB4EE; --c-info: #8DB4EE;
  --c-ok: #74CFA0; --c-ok-soft: #12291E; --c-ok-ink: #A9E5C5; --c-warn: #E7B86A; --c-warn-soft: #2C2310; --c-warn-ink: #F1D39C; --c-warn-line: #D9A24A;
  --c-bad: #F5949F; --c-bad-soft: #34161C; --c-bad-ink: #F9C4CB; --c-info-soft: #142235; --c-info-ink: #BCD3F5;
  --c-on-ink: #0E1412; --c-ink-hover: #C6D2CC; --c-ghost-hover: rgba(227, 235, 231, .07);
  --c-scrim: rgba(0, 0, 0, .6); --c-scrim-strong: rgba(0, 0, 0, .7); --c-shadow: rgba(0, 0, 0, .45); --c-shadow-strong: rgba(0, 0, 0, .6);
  --c-focus-ring: rgba(141, 180, 238, .35); --c-tip-bg: #E3EBE7; --c-tip-ink: #0E1412;
  --ch-ax: #9EACA6; --ch-vl: #E3EBE7; --ch-grid: #24302B; --ch-bar: #7EA6E0; --ch-bar-soft: #34496A; --ch-ok: #74CFA0; --ch-low: #E7B86A; --ch-bad: #F5949F; --ch-none: #9EACA6; --ch-off: #5F6D67; --ch-dot-ring: #161E1B;
  --wx-cold-bg: #142235; --wx-cold-ink: #A9C8F2; --wx-zero-bg: #1E2824; --wx-zero-ink: #C4CFCA; --wx-warm-bg: #2C2310; --wx-warm-ink: #F1D39C;
  --spark-cold: #7EA6E0; --spark-warm: #D9A24A; --spark-axis: #2D3934;
}
:root[data-theme="dark"] .btn.danger { color: var(--c-on-ink); }
:root[data-theme="dark"] img { filter: brightness(.92); }
@media (prefers-reduced-motion: no-preference) { body { transition: background-color .25s ease, color .25s ease; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--c-housing); color: var(--c-ink); font: 400 var(--fs-m)/1.5 var(--font); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 var(--sp-3); font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: var(--fs-xl); } h2 { font-size: var(--fs-l); } h3 { font-size: var(--fs-m); }
p { margin: 0 0 var(--sp-3); max-width: 68ch; }
a { color: var(--c-return); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--c-return); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--c-ink-2); }
.small { font-size: var(--fs-s); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- оболочка ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: var(--fs-m); color: var(--c-ink); text-decoration: none; }
.brand svg { flex: none; }
.top .spacer { flex: 1; }
.main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: var(--sp-2) var(--sp-4) calc(var(--tap) + 48px); }
.main.bare { padding-bottom: var(--sp-7); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(var(--nav-n, 5), 1fr); background: var(--c-surface);
  border-top: 1px solid var(--c-line); box-shadow: 0 -6px 18px var(--c-ghost-hover); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; font-size: 13px; color: var(--c-ink-2); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--c-ink); font-weight: 600; }
.nav a[aria-current="page"] svg { stroke: var(--c-ink); }
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: auto 1fr; }
  .top { grid-column: 1 / -1; padding: var(--sp-4) var(--sp-5); }
  .nav { position: sticky; top: 0; align-self: start; grid-template-columns: 1fr; box-shadow: none; border: 0; background: transparent; padding: var(--sp-2) var(--sp-3); gap: 2px; }
  .nav a { flex-direction: row; justify-content: flex-start; gap: var(--sp-3); padding: 0 var(--sp-4); min-height: 48px; font-size: var(--fs-m); border-radius: var(--r-btn); }
  .nav a[aria-current="page"] { background: var(--c-surface); }
  .main { max-width: 1040px; margin: 0; padding: var(--sp-2) var(--sp-6) var(--sp-7); }
  .app.bare-app { grid-template-columns: 1fr; }
}

/* ---------- кнопки ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); min-height: var(--tap); padding: 0 var(--sp-5);
  border-radius: var(--r-btn); border: 1.5px solid var(--c-ink); background: var(--c-ink); color: var(--c-on-ink); font: 600 var(--fs-m)/1 var(--font);
  cursor: pointer; text-decoration: none; transition: background .15s, transform .05s; }
.btn:hover { background: var(--c-ink-hover); border-color: var(--c-ink-hover); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { background: var(--c-line); border-color: var(--c-line); color: var(--c-ink-2); cursor: not-allowed; }
.btn.sec { background: var(--c-surface); color: var(--c-ink); border-color: var(--c-field-line); }
.btn.sec:hover { border-color: var(--c-ink-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--c-ink); padding: 0 var(--sp-3); }
.btn.ghost:hover { background: var(--c-ghost-hover); }
.btn.danger { background: var(--c-bad); border-color: var(--c-bad); }
.btn.block { width: 100%; }
.btn.big { min-height: 56px; font-size: var(--fs-l); }
.row-actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }
.row-actions .btn { flex: 1 1 auto; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--c-return); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; }

/* ---------- экран счётчика (подпись — главная вещь) ---------- */
.lcd { background: var(--c-lcd); border: 6px solid var(--c-bezel-in); outline: 1.5px solid var(--c-bezel); border-radius: var(--r-lcd);
  padding: 14px 16px 12px; position: relative; color: var(--c-lcd-ink); box-shadow: inset 0 2px 6px rgba(28, 38, 24, .25), var(--lcd-glow); }
.lcd svg.seg { display: block; height: 52px; width: auto; max-width: 100%; }
.lcd .tag { font: 600 15px/1 var(--font); letter-spacing: .02em; }
.lcd .tag.corner { position: absolute; top: 10px; right: 14px; }
.lcd .line { display: flex; align-items: flex-end; gap: 12px; }
.lcd .line + .line { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(28, 38, 24, .25); }
.lcd .line .tag { padding-bottom: 6px; }
.lcd.hero svg.seg { height: 64px; }
.lcd.small svg.seg { height: 30px; }
.lcd.small { padding: 8px 10px; border-width: 4px; }
.lcd-cap { font-size: var(--fs-s); color: var(--c-ink-2); margin-top: var(--sp-2); }
@media (prefers-reduced-motion: no-preference) {
  .lcd.boot .on { animation: segon .5s ease-out both; }
  @keyframes segon { from { fill: var(--c-lcd-off); } to { fill: var(--c-lcd-ink); } }
}

/* ---------- метки и баннеры ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pill); font-size: 14px; font-weight: 500; background: var(--c-line); color: var(--c-ink); white-space: nowrap; }
.pill.ok { background: var(--c-ok-soft); color: var(--c-ok); } .pill.warn { background: var(--c-warn-soft); color: var(--c-warn); }
.pill.bad { background: var(--c-bad-soft); color: var(--c-bad); } .pill.info { background: var(--c-info-soft); color: var(--c-info); }
.banner { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-btn); background: var(--c-info-soft); color: var(--c-info-ink); margin: 0 0 var(--sp-4); }
.banner.warn { background: var(--c-warn-soft); color: var(--c-warn-ink); } .banner.bad { background: var(--c-bad-soft); color: var(--c-bad-ink); } .banner.ok { background: var(--c-ok-soft); color: var(--c-ok-ink); }
.banner svg { flex: none; margin-top: 2px; }
.banner p { margin: 0; } .banner p + p { margin-top: 4px; font-size: var(--fs-s); }

/* ---------- блоки ---------- */
.panel { background: var(--c-surface); border-radius: 14px; padding: var(--sp-4); margin: 0 0 var(--sp-4); }
.panel > h2:first-child, .panel > h3:first-child { margin-top: 0; }
.section-title { font-size: var(--fs-m); font-weight: 600; margin: var(--sp-5) 0 var(--sp-2); }
.list { list-style: none; margin: 0; padding: 0; background: var(--c-surface); border-radius: 14px; }
.list > li { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-housing); min-height: 56px; }
.list > li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.list a.rowlink { display: flex; align-items: center; gap: var(--sp-3); color: inherit; text-decoration: none; width: 100%; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- главная ---------- */
.hero-grid { display: grid; gap: var(--sp-4); }
@media (min-width: 960px) { .hero-grid { grid-template-columns: 1.2fr 1fr; align-items: start; } }
.meter-row { display: flex; align-items: center; gap: var(--sp-3); }

/* ---------- приветствие ---------- */
.welcome { max-width: 860px; margin: 0 auto; }
.welcome h1 { font-size: var(--fs-xxl); max-width: 16ch; margin-bottom: var(--sp-3); }
.welcome .lead { font-size: var(--fs-l); color: var(--c-ink-2); max-width: 40ch; }
.welcome ul { padding: 0; list-style: none; margin: var(--sp-5) 0; display: grid; gap: var(--sp-3); }
.welcome li { display: flex; gap: var(--sp-3); align-items: flex-start; max-width: 52ch; }
.welcome li svg { flex: none; margin-top: 3px; }
@media (min-width: 960px) { .welcome-grid { display: grid; grid-template-columns: 1fr 360px; gap: var(--sp-7); align-items: center; } }

/* ---------- поля ---------- */
.field { margin: 0 0 var(--sp-4); }
.field label, .field .lbl { display: block; font-weight: 500; margin-bottom: 6px; }
.field .ctl { display: flex; align-items: stretch; background: var(--c-field-bg); border: 1.5px solid var(--c-field-line); border-radius: var(--r-field); overflow: hidden; }
.field .ctl:focus-within { border-color: var(--c-ink); box-shadow: 0 0 0 3px var(--c-focus-ring); }
.field input, .field select, .field textarea { flex: 1; min-width: 0; min-height: 52px; border: 0; padding: 0 var(--sp-4); font: 500 var(--fs-l) var(--font); color: var(--c-ink); background: transparent; }
.field textarea { min-height: 96px; padding: var(--sp-3) var(--sp-4); font-size: var(--fs-m); font-weight: 400; }
.field input.num { font-family: var(--mono); letter-spacing: .02em; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; }
.field .unit { display: flex; align-items: center; padding: 0 var(--sp-4); color: var(--c-ink-2); background: var(--c-surface-2); border-left: 1.5px solid var(--c-field-line); font-size: var(--fs-s); white-space: nowrap; }
.field .help { font-size: var(--fs-s); color: var(--c-ink-2); margin-top: 6px; min-height: 1.5em; }
.field .help.ok { color: var(--c-ok); } .field .help.warn { color: var(--c-warn); } .field .help.block { color: var(--c-bad); font-weight: 500; }
.field.is-block .ctl { border-color: var(--c-bad); } .field.is-warn .ctl { border-color: var(--c-warn-line); }
.field .ctl.supply { border-left: 5px solid var(--c-supply); } .field .ctl.return { border-left: 5px solid var(--c-return); }
.grid2 { display: grid; gap: 0 var(--sp-4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 600px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.choice { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.choice label { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 var(--sp-4); border: 1.5px solid var(--c-field-line); border-radius: var(--r-btn); background: var(--c-surface); cursor: pointer; font-weight: 500; }
.choice input { accent-color: var(--c-ink); width: 18px; height: 18px; }
.choice label:has(input:checked) { border-color: var(--c-ink); box-shadow: inset 0 0 0 1px var(--c-ink); }

/* ---------- мастер ---------- */
.wiz-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px var(--sp-3); margin-bottom: var(--sp-4); }   /* узкий экран: полоска прогресса уходит строкой ниже */
.wiz-top .count { font-weight: 600; white-space: nowrap; }
.progress { height: 6px; background: var(--c-line); border-radius: 3px; overflow: hidden; flex: 1 1 64px; min-width: 64px; }
.progress i { display: block; height: 100%; background: var(--c-ink); border-radius: 3px; transition: width .25s; }
.wiz { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); }
@media (min-width: 960px) { .wiz { grid-template-columns: minmax(320px, 440px) 1fr; align-items: start; } }
.press { display: flex; align-items: center; gap: var(--sp-3); margin: 0 0 var(--sp-3); font-size: var(--fs-l); font-weight: 600; }
.press .times { font-family: var(--mono); background: var(--c-ink); color: var(--c-on-ink); border-radius: 8px; padding: 2px 10px; font-size: var(--fs-l); }
.hint { color: var(--c-ink-2); margin-top: var(--sp-3); }
.sleep { display: flex; gap: var(--sp-2); align-items: flex-start; font-size: var(--fs-s); color: var(--c-ink-2); margin-top: var(--sp-3); }
.wiz-actions { display: flex; gap: var(--sp-3); margin-top: var(--sp-5); }
.wiz-actions .btn:last-child { flex: 1; }

/* ---------- проверка ---------- */
.verdict { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-4); border-radius: 14px; margin: 0 0 var(--sp-4); font-size: var(--fs-l); font-weight: 600; }
.verdict.ok { background: var(--c-ok-soft); color: var(--c-ok-ink); } .verdict.warn { background: var(--c-warn-soft); color: var(--c-warn-ink); } .verdict.block { background: var(--c-bad-soft); color: var(--c-bad-ink); }
.issues { list-style: none; margin: 0 0 var(--sp-4); padding: 0; background: var(--c-surface); border-radius: 14px; }
.issues li { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-housing); }
.issues li:last-child { border-bottom: 0; }
.issues .ic { grid-row: span 3; margin-top: 2px; }
.issues .msg { font-weight: 500; } .issues .fix { color: var(--c-ink-2); font-size: var(--fs-s); }
.vals { width: 100%; border-collapse: collapse; background: var(--c-surface); border-radius: 14px; overflow: hidden; }
.vals th, .vals td { text-align: left; padding: 10px var(--sp-4); border-bottom: 1px solid var(--c-housing); font-size: var(--fs-s); vertical-align: middle; }
.vals th { font-weight: 400; color: var(--c-ink-2); }
.vals td { font-family: var(--mono); font-size: var(--fs-m); text-align: right; white-space: nowrap; }
.vals tr.is-block td { color: var(--c-bad); font-weight: 600; } .vals tr.is-warn td { color: var(--c-warn); font-weight: 600; }
.vals tr:last-child th, .vals tr:last-child td { border-bottom: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }   /* minmax(0,…): поле ввода не распирает колонку шире экрана (вход на телефоне ездил вбок) */
@media (min-width: 960px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }

/* ---------- передача ---------- */
.copy-list { list-style: none; margin: 0; padding: 0; background: var(--c-surface); border-radius: 14px; }
.copy-list li { display: grid; grid-template-columns: 1fr auto auto; gap: var(--sp-3); align-items: center; padding: 8px var(--sp-2) 8px var(--sp-4); border-bottom: 1px solid var(--c-housing); }
.copy-list li:last-child { border-bottom: 0; }
.copy-list .k { font-size: var(--fs-s); color: var(--c-ink-2); }
.copy-list .v { font-family: var(--mono); font-size: var(--fs-l); font-weight: 500; font-variant-numeric: tabular-nums; }
.copy-list .btn { min-height: 44px; padding: 0 var(--sp-3); font-size: var(--fs-s); }
.copy-list .btn.done { background: var(--c-ok); border-color: var(--c-ok); color: var(--c-on-ink); }
.steps { margin: 0; padding-left: 1.4em; } .steps li { margin: 0 0 var(--sp-2); padding-left: 4px; }
.soon { border: 1.5px dashed var(--c-line); background: transparent; }

/* ---------- модели ---------- */
.models > li { cursor: pointer; }
.models > li:hover { background: var(--c-surface-2); }
.models label { display: flex; align-items: center; gap: var(--sp-3); width: 100%; cursor: pointer; }
.models input { width: 20px; height: 20px; accent-color: var(--c-ink); flex: none; }
.models .name { font-weight: 600; } .models .vendor { color: var(--c-ink-2); font-size: var(--fs-s); }
details.where { margin: var(--sp-3) 0 var(--sp-4); }
details.where summary { cursor: pointer; color: var(--c-return); text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }

/* ---------- справка ---------- */
.help-doc h2 { margin-top: var(--sp-6); }
.help-doc h2:first-of-type { margin-top: var(--sp-3); }
.help-doc ul, .help-doc ol { padding-left: 1.3em; max-width: 68ch; } .help-doc li { margin-bottom: 6px; }
.toc { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: 0 0 var(--sp-4); }
.toc a, .toc .tocb { border: 0; cursor: pointer; font-family: var(--font); display: inline-flex; align-items: center; min-height: 40px; padding: 0 var(--sp-3); background: var(--c-surface); border-radius: var(--r-pill); text-decoration: none; color: var(--c-ink); font-size: var(--fs-s); }

/* ---------- тост и сегмент ---------- */
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--c-ink); color: var(--c-on-ink); padding: 12px 18px; border-radius: var(--r-btn); font-weight: 500; z-index: 10; max-width: calc(100% - 32px); }
@media (min-width: 960px) { .toast { bottom: 32px; } }
.seg-ctl { display: inline-flex; background: var(--c-field-bg); border: 1.5px solid var(--c-field-line); border-radius: var(--r-pill); padding: 2px; }
.seg-ctl button { border: 0; background: transparent; min-height: 36px; min-width: 44px; padding: 0 12px; border-radius: var(--r-pill); font: 600 14px var(--font); color: var(--c-ink-2); cursor: pointer; }
.seg-ctl button[aria-pressed="true"] { background: var(--c-ink); color: var(--c-on-ink); }
.confirm { background: var(--c-bad-soft); border-radius: var(--r-btn); padding: var(--sp-4); margin-top: var(--sp-3); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* сегменты и иконки уровней */
.seg .on { fill: var(--c-lcd-ink); } .seg .off { fill: var(--c-lcd-off); opacity: .55; }
.lcd .line.sample .seg .on { fill: var(--c-seg-sample); }
.c-ok { color: var(--c-ok); } .c-warn { color: var(--c-warn); } .c-bad { color: var(--c-bad); } .c-info { color: var(--c-info); }

.linkbtn { text-align: left; }
.meta-row { display: flex; gap: var(--sp-4); align-items: baseline; }
.welcome-lcd { margin: 0 0 var(--sp-5); max-width: 360px; }
@media (min-width: 960px) { .welcome-lcd { order: 2; margin: 0; } }
@media (max-width: 959px) { .ho-steps { order: -1; } }

/* ---------- фото ---------- */
.thumbs { list-style: none; margin: 0 0 var(--sp-4); padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp-2); }
.thumbs li { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--c-surface); border: 1px solid var(--c-line); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs .n { position: absolute; left: 6px; top: 6px; background: var(--c-ink); color: var(--c-on-ink); font-size: 13px; font-weight: 600; border-radius: 6px; padding: 0 6px; }
.thumbs .rm { position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--c-scrim-strong); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ph-fields li { gap: var(--sp-3); }
.ph-fields .src { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; border: 1px solid var(--c-line); }
.ph-fields .src.none { background: repeating-linear-gradient(45deg, var(--c-housing), var(--c-housing) 6px, var(--c-surface) 6px, var(--c-surface) 12px); }
.ph-in { width: 100%; min-height: 44px; background: var(--c-field-bg); color: var(--c-ink); border: 1.5px solid var(--c-field-line); border-radius: var(--r-field); padding: 0 var(--sp-3); font: 500 var(--fs-l) var(--mono); background: var(--c-surface); margin-top: 4px; }
.ph-in:focus { outline: none; border-color: var(--c-ink); box-shadow: 0 0 0 3px var(--c-focus-ring); }
label.btn { cursor: pointer; }

/* ---------- тестовая версия, отзыв ---------- */
.beta { font: 600 12px/1 var(--font); letter-spacing: .04em; text-transform: uppercase; color: var(--c-warn); background: var(--c-warn-soft); border-radius: var(--r-pill); padding: 5px 9px; }
.fab { position: fixed; right: var(--sp-4); bottom: calc(58px + env(safe-area-inset-bottom) + var(--sp-3)); z-index: 6; display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 16px 0 12px; border-radius: var(--r-pill); border: 1.5px solid var(--c-field-line); background: var(--c-surface); color: var(--c-ink);
  font: 600 var(--fs-s)/1 var(--font); box-shadow: 0 6px 18px var(--c-shadow); cursor: pointer; }
.fab:hover { border-color: var(--c-ink); }
.fab.fab-bare { bottom: calc(env(safe-area-inset-bottom) + var(--sp-4)); }
@media (max-width: 420px) { .fab span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } .fab { padding: 0; width: 48px; justify-content: center; } }
@media (min-width: 960px) { .fab { bottom: var(--sp-5); right: var(--sp-5); } }
.fb-back { position: fixed; inset: 0; background: var(--c-scrim); z-index: 20; }
.fb { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto;
  background: var(--c-surface); border-radius: 16px; padding: var(--sp-5); box-shadow: 0 20px 50px var(--c-shadow-strong); }
.fb textarea, .fb input { width: 100%; box-sizing: border-box; font: 400 var(--fs-m)/1.4 var(--font); padding: 10px 12px; background: var(--c-field-bg); color: var(--c-ink); border: 1.5px solid var(--c-field-line); border-radius: var(--r-field); margin-bottom: var(--sp-3); background: #fff; color: var(--c-ink); }
.fb .lbl { display: block; font-weight: 600; margin: var(--sp-2) 0 6px; }
@media (max-width: 600px) { .fb { top: auto; bottom: 0; transform: translateX(-50%); border-radius: 16px 16px 0 0; width: 100vw; padding-bottom: calc(var(--sp-5) + env(safe-area-inset-bottom)); } }
.test-reset { margin-top: var(--sp-6); border: 1.5px dashed var(--c-line); background: transparent; }

/* карточка показаний в истории */
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 8px; }
.num.big { font-size: 28px; line-height: 1.2; }

/* дата «дд.мм.рррр»: своё текстовое поле + кнопка-календарь; настоящее type=date — невидимое, под кнопкой */
.has-dmy { position: relative; display: flex; align-items: center; }
.has-dmy .dmy { flex: 1; min-width: 0; }
.has-dmy .dmy.bad { color: var(--c-bad); }
.dmy-cal { flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin-left: 4px; border: 0; background: transparent; color: inherit; cursor: pointer; border-radius: 10px; }
.dmy-cal:hover { background: var(--c-ghost-hover); }
.dmy-native { position: absolute; right: 0; bottom: 0; width: 44px; height: 44px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
/* телефоны: календарь открывается только прямым нажатием на сам input[type=date] (iOS не умеет showPicker/focus) —
   кладём невидимое родное поле поверх кнопки-календаря */
@media (pointer: coarse) { .dmy-native { pointer-events: auto; z-index: 1; top: 50%; bottom: auto; transform: translateY(-50%); font-size: 16px; -webkit-appearance: none; appearance: none; min-width: 0; color: transparent; background: transparent; } }

/* экономия тепла */
.tips { padding-left: 22px; } .tips li { margin-bottom: 14px; } .tips h3 { margin: 0 0 4px; font-size: 17px; } .tips p { margin: 0; }
.tip h3 { margin: 4px 0; font-size: 16px; } .tip { margin-top: 16px; }
.date-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--c-surface); color: inherit; text-decoration: none; border: 1px solid var(--c-line); white-space: nowrap; }
@media (max-width: 420px) { .nav a span { font-size: 11px; letter-spacing: -0.1px; } }
@media (max-width: 359px) { .nav a span { font-size: 10px; letter-spacing: -0.2px; } }

/* статистика */
.chart { width: 100%; height: auto; display: block; margin-top: 8px; overflow: visible; }
.chart .ax { font: 11px var(--font, sans-serif); fill: var(--ch-ax); }
.chart .vl { font: 600 11px var(--font, sans-serif); fill: var(--ch-vl); }
.chart .mk { cursor: default; outline: none; }
.chart .mk:hover path, .chart .mk:focus path, .chart .mk:hover circle, .chart .mk:focus circle { filter: brightness(1.12); }
.chart .mk:focus-visible rect { stroke: var(--c-ink); stroke-dasharray: 3 3; }
.chart-panel h2 { margin-bottom: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--c-ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .ring { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid var(--c-ink-2); box-sizing: border-box; }
.stat-tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin: 12px 0 16px; }
.ctip { position: fixed; z-index: 50; background: var(--c-tip-bg); color: var(--c-tip-ink); padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; pointer-events: none; max-width: 300px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.ctip .ctip-v { font-weight: 600; font-size: 14px; }
.tbl-wrap { overflow-x: auto; } .tbl { border-collapse: collapse; width: 100%; font-size: 13px; } .tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--c-line); text-align: left; white-space: nowrap; } .tbl td.num { text-align: right; }
.legend .dash { width: 18px; height: 0; border-top: 2px dashed var(--c-ink-2); display: inline-block; } .legend .dash.dot2 { border-top: 2px dotted var(--ch-off); }
.chart .ax.ref { font-weight: 600; }
.chart .ax.x2 { fill: var(--c-info); font-weight: 600; }

/* погода в истории */
.wx { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 5px; border-radius: 999px; font-size: 13px; margin-right: 8px; white-space: nowrap; flex: none; }
.wx .num { font-weight: 600; }
.wx-cold { background: var(--wx-cold-bg); color: var(--wx-cold-ink); } .wx-zero { background: var(--wx-zero-bg); color: var(--wx-zero-ink); } .wx-warm { background: var(--wx-warm-bg); color: var(--wx-warm-ink); }
.wx-panel h2 { display: flex; align-items: center; gap: 6px; }
.wx-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.num.mid { font-size: 20px; line-height: 1.3; }
.wx-t-cold { color: var(--wx-cold-ink); } .wx-t-warm { color: var(--wx-warm-ink); }
.spark { width: 100%; height: 56px; display: block; margin-top: 12px; }
.ctip[hidden] { display: none; } .wx:focus-visible { outline: 2px solid var(--c-ink); outline-offset: 2px; }

/* квартиры */
.place-sw { display: inline-flex; align-items: center; gap: 8px; background: var(--c-field-bg); border: 1.5px solid var(--c-field-line); border-radius: 999px; padding: 4px 6px 4px 12px; margin-bottom: 16px; }
.place-sw select { border: 0; background: transparent; font: inherit; font-weight: 600; padding: 6px 4px; max-width: 70vw; }
.pl-in { width: 100%; color: var(--c-ink); border: 0; border-bottom: 1.5px dashed var(--c-field-line); background: transparent; font: inherit; font-weight: 600; padding: 4px 0; }
.pl-in:focus { outline: none; border-bottom-color: var(--c-ink); }
.docs { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
.docs li { display: flex; align-items: center; gap: 12px; background: var(--c-housing); border-radius: 12px; padding: 8px; }
.doc-th { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; background: var(--c-surface); display: grid; place-items: center; flex: none; }
.doc-th img { width: 100%; height: 100%; object-fit: cover; } .doc-th .pdf { font: 700 13px var(--mono); color: var(--c-bad); }
/* узкий экран: в строке истории — текст на всю ширину, погода и статус строкой ниже */
@media (max-width: 480px) {
  [data-key="reading-list"] .rowlink { flex-wrap: wrap; row-gap: 6px; }
  [data-key="reading-list"] .rowlink > .grow { flex: 1 1 100%; }
  [data-key="reading-list"] .rowlink > .wx { margin-left: 0; }
}
.theme-btn { display: grid; place-items: center; width: var(--tap); height: var(--tap); border: 1.5px solid var(--c-field-line); border-radius: 50%; background: var(--c-surface); color: var(--c-ink); cursor: pointer; flex: none; }
.theme-btn:hover { border-color: var(--c-ink-2); }
.top .theme-btn + .btn { margin-left: var(--sp-2); }
/* узкие телефоны (320–359 px): шапка «логотип · ТЕСТ · тема · ✕» не влезала — страница ездила вбок */
.brand { min-width: 0; } .brand span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 359px) {
  .top { gap: 4px; padding: var(--sp-3); } .brand { gap: 8px; }
  .beta { font-size: 10px; padding: 4px 6px; }
  .top .theme-btn { width: 44px; height: 44px; } .top .btn { min-height: 44px; padding: 0 10px; } .top .theme-btn + .btn { margin-left: 0; }
}

/* просмотр фото на весь экран */
.pv { position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, .94); touch-action: none; overflow: hidden; overscroll-behavior: contain; }
.pv img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; }
.pv-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: calc(env(safe-area-inset-top) + 10px) 12px 10px; background: linear-gradient(rgba(0,0,0,.6), transparent); color: #fff; }
.pv-n { margin-right: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.pv-b { width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .16); color: #fff; font-size: 28px; line-height: 1; display: grid; place-items: center; cursor: pointer; }
.pv-b:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.thumbs img[data-pv], .ph-fields img[data-pv] { cursor: zoom-in; }
/* узкий телефон (≤ 420 px): «Закрити» — только крестиком, иначе шапка шире экрана и страница уменьшается */
@media (max-width: 420px) { .cl-txt { display: none; } .pv-bar { box-sizing: border-box; } }

/* загрузка: значок-кольцо, кнопка «в работе», полоса хода */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; flex: none; width: 20px; height: 20px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -4px; }
.banner > .spin { width: 22px; height: 22px; margin-top: 2px; }
.btn[aria-busy="true"] { pointer-events: none; opacity: .85; }
.btn[aria-busy="true"]::before { content: ''; flex: none; width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.pbar { height: 6px; border-radius: 3px; background: var(--c-line); overflow: hidden; margin-top: 10px; }
.pbar i { display: block; height: 100%; background: var(--c-accent, var(--c-ink)); border-radius: 3px; transition: width .4s ease; }
@media (prefers-reduced-motion: reduce) { .spin, .btn[aria-busy="true"]::before { animation-duration: 2.4s; } .pbar i { transition: none; } }
/* советы, как фотографировать */
.tips-box { margin: 0 0 var(--sp-4); border: 1px solid var(--c-line); border-radius: 12px; background: var(--c-surface); padding: 10px 14px; }
.tips-box summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; min-height: 32px; }
.tips-box ul { margin: 8px 0 4px; padding-left: 20px; }
.tips-box li { margin: 4px 0; line-height: 1.4; }

/* фото ещё грузится / декодируется — под ним крутится кольцо (картинка непрозрачная и закроет его, когда появится) */
.pv-spin { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; color: #fff; border-width: 3.5px; }
.pv-spin[hidden] { display: none; }
.thumbs li::before, .src-w::before { content: ''; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2.5px solid var(--c-ink-2); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.thumbs img { position: relative; }
.src-w { position: relative; flex: none; display: block; width: 52px; height: 52px; }
.src-w .src { position: relative; display: block; }
@media (prefers-reduced-motion: reduce) { .thumbs li::before, .src-w::before { animation-duration: 2.4s; } }

/* поля ввода без .field (настройки, формы) — те же различимые границы */
input[type=text]:not(.dmy-native):not(.pl-in), input[type=email], input[type=password], input[type=tel], input[type=number], select, textarea { color: var(--c-ink); }
.place-sw select { color: var(--c-ink); }
.choice input, .models input { accent-color: var(--c-ink); }

/* текст-подсказка в полях — тот же контраст, что у второстепенного текста */
::placeholder { color: var(--c-ink-2); opacity: 1; }
/* «Мій лічильник» на главной — вся строка ведёт в настройки */
.tap-row { padding: 0 !important; }
.row-link { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; color: inherit; text-decoration: none; min-height: var(--tap); }
.row-link:hover { background: var(--c-ghost-hover); }
.row-link .ico { color: var(--c-ink-2); flex: none; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--c-info); } 100% { box-shadow: 0 0 0 3px transparent; } }
#meter-block:focus { outline: none; } #meter-block { scroll-margin-top: 76px; }
/* справка и советы: группы-плашки с аккордеоном */
.acc-groups { display: grid; gap: var(--sp-4); }
.acc-group { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 16px; padding: 6px 0; overflow: hidden; scroll-margin-top: 16px; }
.acc-group > h2 { display: flex; align-items: center; gap: 10px; margin: 0; padding: 14px 18px 8px; font-size: 19px; }
.acc-group > h2 .ico { color: var(--c-info); }
.acc { border-top: 1px solid var(--c-line); }
.acc:first-of-type { border-top: 0; }
.acc summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); padding: 10px 18px; font-weight: 600; font-size: 16px; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .ico { color: var(--c-ink-2); flex: none; transition: transform .2s; }
.acc[open] summary .ico { transform: rotate(90deg); }
.acc summary:hover { background: var(--c-ghost-hover); }
.acc summary:focus-visible { outline: 3px solid var(--c-info); outline-offset: -3px; }
.acc-body { padding: 10px 18px 16px; max-width: 70ch; line-height: 1.55; }
.acc-body p { margin: 0 0 8px; } .acc-body ul, .acc-body ol { padding-left: 1.3em; margin: 0 0 8px; } .acc-body li { margin-bottom: 6px; }
@media (prefers-reduced-motion: reduce) { .acc summary .ico { transition: none; } .flash { animation: none; } }
/* политика и условия */
.legal h2 { font-size: 18px; margin: 0 0 8px; } .legal p, .legal ul { margin: 0 0 6px; line-height: 1.55; max-width: 70ch; } .legal ul { padding-left: 1.3em; } .legal li { margin-bottom: 4px; }
.legal-foot { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; margin: 28px 0 8px; padding-top: 16px; border-top: 1px solid var(--c-line); font-size: 14px; }
.legal-foot a { color: var(--c-ink-2); min-height: 44px; display: inline-flex; align-items: center; }

/* ввод показаний на телефоне: меньше пустоты между полем и кнопками; с открытой клавиатурой — запас снизу,

<body>

<div id="root"></div>
<noscript>Для роботи сервісу потрібен JavaScript.</noscript>
<script>
/*
 * Теплосервис — движок проверок показаний «как робот ХТМ».
 * Один файл для браузера (window.TeploRules) и Node (module.exports).
 * Коды R_* совпадают с документом «кабинет ХТМ (снятие 01.11.2026)», §7.
 * Уровни: ok · info · warn (похоже на ошибку, можно подтвердить) · block (робот ХТМ отклонит).
 */
(function (root) {
  'use strict';

  var C = {
    GCAL_KW_FACTOR: 1.163,     // кВт = 1.163 · м³/ч · ΔT
    DT_MIN: 2.5, DT_MAX: 50,   // средняя ΔT за период (робот ХТМ)
    DT_WARN: 3.0,              // близко к порогу
    TEMP_MIN: 5, TEMP_MAX: 95,
    HOURS_TOL: 24,             // |Δчасов − календарь| ≤ 24
    ENERGY_JUMP: 15,           // Гкал за период
    FLOW_K: 0.3,               // средний расход ≥ 0.3 × переходного
    POWER_TOL: 0.10, POWER_ABS: 0.3,
    DT_NO_FLOW: 15,
    TARIFF: 1539.50,
    ABON: 29.40,               // абонплата за індивідуальний договір на теплопостачання, грн/міс (платіжка ХТМ, 2025)           // грн/Гкал с НДС (КП «ХТМ», население; мораторий — так и в сезоне 2026/27)
    WINDOW_FROM: 5, WINDOW_RECOMMENDED: 23, WINDOW_TO: 25
  };

  // Поля журнала ХТМ в порядке формы. decimals — как требует форма (разделитель — точка).
  var FIELDS = [
    { key: 'date',     htm: 'LastDtPok',    uk: 'Дата зняття',                 ru: 'Дата снятия',                 unit: '',     dec: null },
    { key: 'energy',   htm: 'LastValuePok', uk: 'Накопичена енергія',          ru: 'Накопленная энергия',         unit: 'Гкал', dec: 3 },
    { key: 'volume',   htm: 'LastRashPok',  uk: 'Обсяг теплоносія',            ru: 'Объём теплоносителя',         unit: 'м³',   dec: 3 },
    { key: 'flow',     htm: 'HeatRash',     uk: 'Миттєва витрата',             ru: 'Мгновенный расход',           unit: 'м³/год', dec: 3 },
    { key: 'power',    htm: 'HeatPower',    uk: 'Миттєва потужність',          ru: 'Мгновенная мощность',         unit: 'кВт',  dec: 3 },
    { key: 'tSupply',  htm: 'TempPod',      uk: 'Температура подачі',          ru: 'Температура подачи',          unit: '°C',   dec: 2 },
    { key: 'tReturn',  htm: 'TempO',        uk: 'Температура повернення',      ru: 'Температура обратки',         unit: '°C',   dec: 2 },
    { key: 'hours',    htm: 'LastTimePok',  uk: 'Час роботи',                  ru: 'Время работы',                unit: 'год',  dec: 0 },
    { key: 'errHours', htm: 'ErrorTime',    uk: 'Час роботи з помилкою',       ru: 'Время работы с ошибкой',      unit: 'год',  dec: 0 },
    { key: 'errCode',  htm: 'ErrorKod',     uk: 'Код помилки',                 ru: 'Код ошибки',                  unit: '',     dec: null }
  ];

  function num(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).replace(/[\s ]/g, '').replace(',', '.');
    if (s === '' || !/^-?\d*\.?\d+$/.test(s)) return null;
    return parseFloat(s);
  }

  function parseDate(s) {
    if (!s) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s) || null;
    if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
    m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s);
    if (m) return Date.UTC(+m[3], +m[2] - 1, +m[1]);
    return null;
  }
  function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function toHtmDate(s) { var t = parseDate(s); if (t === null) return ''; var d = new Date(t); return ('0' + d.getUTCDate()).slice(-2) + '.' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '.' + d.getUTCFullYear(); }

  /** Формат «как в форме ХТМ»: точка, фиксированное число знаков. */
  function formatForHtm(key, v) {
    var f = FIELDS.filter(function (x) { return x.key === key; })[0];
    if (!f) return String(v == null ? '' : v);
    if (key === 'date') return toHtmDate(v);
    if (key === 'errCode') return normCode(v);
    var n = num(v); if (n === null) return '';
    return f.dec === 0 ? String(Math.round(n)) : n.toFixed(f.dec);
  }
  function normCode(v) {
    var s = String(v == null ? '' : v).trim();
    if (s === '' || /^E[-–—]*$/i.test(s) || s === '0') return 'E---';
    return s.toUpperCase();
  }
  function noError(code) { return normCode(code) === 'E---'; }

  /** Состояние окна приёма на дату (локальная дата). */
  function windowState(today) {
    var d = today ? new Date(parseDate(today)) : new Date();
    var day = today ? d.getUTCDate() : d.getDate();
    if (day < C.WINDOW_FROM) return { state: 'closed_before', day: day, opensOn: C.WINDOW_FROM };
    if (day <= C.WINDOW_RECOMMENDED - 2) return { state: 'open', day: day, daysLeft: C.WINDOW_RECOMMENDED - day };
    if (day < C.WINDOW_RECOMMENDED) return { state: 'soon_recommended', day: day, daysLeft: C.WINDOW_RECOMMENDED - day };
    if (day < C.WINDOW_TO) return { state: 'late', day: day, daysLeft: C.WINDOW_TO - day };
    if (day === C.WINDOW_TO) return { state: 'last_day', day: day };
    return { state: 'closed_after', day: day, opensOn: C.WINDOW_FROM };
  }

  function item(code, level, field, uk, ru, fixUk, fixRu, extra) {
    var o = { code: code, level: level, field: field, msg: { uk: uk, ru: ru } };
    if (fixUk) o.fix = { uk: fixUk, ru: fixRu || fixUk };
    if (extra) for (var k in extra) o[k] = extra[k];
    return o;
  }
  function f3(n) { return (Math.round(n * 1000) / 1000).toString(); }
  function f1(n) { return (Math.round(n * 10) / 10).toString(); }

  /**
   * Проверка одного показания.
   * @param {object} p  { reading, prev, meter, today }
   *   reading/prev: { date:'YYYY-MM-DD', energy, volume, flow, power, tSupply, tReturn, hours, errHours, errCode }
   *   prev — последнее ПРИНЯТОЕ ХТМ показание (строка журнала), может быть null.
   *   meter: { hoursOnlyWithFlow:bool, transitionalFlow:number|null, verifiedUntil:'YYYY-MM-DD'|null }
   *   today: 'YYYY-MM-DD' (по умолчанию — сегодня)
   * @returns {{verdict:string, items:Array, derived:object}}
   */
  function validate(p) {
    var r = p.reading || {}, prev = p.prev || null, meter = p.meter || {};
    var today = p.today || ymd(new Date());
    var items = [], d = {};
    var v = {}; FIELDS.forEach(function (f) { if (f.key !== 'date' && f.key !== 'errCode') v[f.key] = num(r[f.key]); });
    var pv = {}; if (prev) FIELDS.forEach(function (f) { if (f.key !== 'date' && f.key !== 'errCode') pv[f.key] = num(prev[f.key]); });

    // --- A. Заполнено ли всё (форма ХТМ требует все 10 значений)
    var missing = FIELDS.filter(function (f) {
      if (f.key === 'date') return !parseDate(r.date);
      if (f.key === 'errCode') return false; // пусто = E--- (нет ошибки)
      return v[f.key] === null;
    });
    missing.forEach(function (f) {
      items.push(item('F_MISSING', 'block', f.key,
        'Не заповнено: ' + f.uk + '.', 'Не заполнено: ' + f.ru + '.',
        'Кабінет ХТМ приймає лише всі 10 значень.', 'Кабинет ХТМ принимает только все 10 значений.'));
    });

    // --- Дата
    if (parseDate(r.date)) {
      var dToday = daysBetween(r.date, today);
      if (dToday < 0) items.push(item('F_DATE_FUTURE', 'block', 'date', 'Дата в майбутньому.', 'Дата в будущем.', 'Вкажіть день, коли знімали показання.', 'Укажите день, когда снимали показания.'));
      else if (r.date.slice(0, 7) !== today.slice(0, 7)) items.push(item('R_CURRENT_MONTH', 'block', 'date',
        'ХТМ приймає показання лише поточного місяця.', 'ХТМ принимает показания только текущего месяца.',
        'Зніміть нові показання цього місяця.', 'Снимите новые показания в этом месяце.'));
      else if (dToday > 2) items.push(item('F_DATE_OLD', 'warn', 'date',
        'Показання зняті ' + dToday + ' дн. тому.', 'Показания сняты ' + dToday + ' дн. назад.',
        'Це нормально, якщо дата справжня: робот рахує години саме від дати зняття.', 'Это нормально, если дата настоящая: робот считает часы именно от даты снятия.'));
      if (prev && parseDate(prev.date)) {
        var dd = daysBetween(prev.date, r.date);
        if (dd < 0) items.push(item('F_DATE_BEFORE_PREV', 'block', 'date', 'Дата раніше за попередні прийняті показання.', 'Дата раньше предыдущих принятых показаний.', 'Перевірте дату.', 'Проверьте дату.'));
        else if (dd === 0) items.push(item('R_ONE_PER_DATE', 'warn', 'date', 'На цю дату вже є запис — ХТМ дозволяє один запис на дату.', 'На эту дату уже есть запись — ХТМ разрешает одну запись на дату.', 'Нове значення замінить попереднє (редагування останнього запису).', 'Новое значение заменит прежнее (редактирование последней записи).'));
      }
    }

    // --- Температуры
    ['tSupply', 'tReturn'].forEach(function (k) {
      var t = v[k]; if (t === null) return;
      if (t === 0 || t < C.TEMP_MIN || t > C.TEMP_MAX) items.push(item('R_TEMP_RANGE', 'block', k,

 * Бэкенды, по порядку:
 *   server — свой сервер (window.TEPLO_API, напр. '/api'): аккаунт через Telegram или email+пароль;
 *   claude — опубликованный прототип на claude.ai: личный документ data/users/<id>/teplo (возможности db + user);
 *   local  — только этот браузер.
 * Слияние: показания — объединение по id (новее по updatedAt), остальное — из более свежего состояния;
 * wipedAt — «удалить всё» побеждает старые записи.

  /** Ваші цифри: середнє за 30 днів з останнього проміжку і скільки дасть −1 °C (≈5 %). */
  function myMonth() {
    var last = RD().slice().sort(function (a, b) { return a.htm.date < b.htm.date ? -1 : 1; }).reverse();
    for (var i = 0; i < last.length; i++) { var iv = interval(last[i]); if (iv && iv.dE > 0 && iv.days >= 7) return { g: iv.dE / iv.days * 30, from: iv.from, to: last[i].htm.date }; }
    return null;
  }

  /* Фото, присланные боту в Telegram: лежат в аккаунте и ждут; распознаёт браузер, как обычные фото. */

  function api0(path, opts) {
    opts = opts || {}; var c = (document.cookie.match(/(?:^|; )ts_csrf=([^;]*)/) || [])[1] || '';

  }
  /** Фото из бота. Главная зовёт это на каждой отрисовке — спрашиваем сервер не чаще раза в минуту и перерисовываем,
   *  только если список изменился (иначе ответ → перерисовка → запрос… и главная «мигает», нажатия теряются). */
  function loadInbox(force) {
    if (!window.TEPLO_API || !Y().account || INBOX.loading) return;
    if (!force && !INBOX.auto && INBOX.items !== null && Date.now() - (INBOX.at || 0) < 60000) return;
    INBOX.loading = true; INBOX.at = Date.now();
    var before = JSON.stringify((INBOX.items || []).map(function (x) { return x.id; }));
    api0('/inbox').then(function (r) { return r.json(); }).then(function (j) {
      INBOX.loading = false; INBOX.items = (j && j.items) || [];
      var changed = before !== JSON.stringify(INBOX.items.map(function (x) { return x.id; }));
      if (INBOX.auto) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* нет */ } }
      if (INBOX.auto && INBOX.items.length && PH.status !== 'working') { INBOX.auto = false; inboxRun(); return; }
      INBOX.auto = false;
      if (changed && ['home', ''].indexOf(routeName()) >= 0) safeRender();
    }, function () { INBOX.loading = false; });
  }
  function inboxRun() {
    var items = (INBOX.items || []).slice(); if (!items.length) return;
    phReset('reading'); PH.inbox = items.map(function (x) { return x.id; }); PH.status = 'working'; PH.progress = t('ib_loading'); PH.pct = 2;

  /** Даты — всегда «дд.мм.рррр», как в ХТМ, независимо от языка браузера. Настоящее поле type=date остаётся

  function enhanceDates(root) {

      nat.setAttribute('data-dmy', '1');
      var txt = document.createElement('input'); txt.type = 'text'; txt.className = 'num dmy'; txt.inputMode = 'numeric'; txt.autocomplete = 'off';

      if (nat.id) { txt.id = nat.id + '-dmy'; var lb = document.querySelector('label[for="' + nat.id + '"]'); if (lb) lb.setAttribute('for', txt.id); }
      var toDmy = function (iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] : ''; };

      nat.classList.add('dmy-native'); nat.tabIndex = -1; nat.setAttribute('aria-hidden', 'true');

        if (d.length > 2) out += '.' + d.slice(2, 4); if (d.length > 4) out += '.' + d.slice(4);

        if (!d) { push(''); return; }
        if (d.length === 8) {

      else { var b = document.querySelector('[data-act="step-next"]'); if (b) b.click(); }
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'rec-form') {   // правка показаний из истории
      e.preventDefault();
      var rf = RD().filter(function (x) { return x.id === e.target.getAttribute('data-id'); })[0]; if (!rf) return;
      var dt = document.getElementById('re-date').value, er = document.getElementById('re-err'), vals = {};
      Array.prototype.forEach.call(document.querySelectorAll('[data-re]'), function (el) { vals[el.getAttribute('data-re')] = el.value.trim().replace(',', '.'); });
      var badNums = Object.keys(vals).filter(function (k) { return k !== 'errCode' && vals[k] !== '' && R.num(vals[k]) === null; }).map(fieldLabel).join(', ');
      var bad = !/^\d{4}-\d{2}-\d{2}$/.test(dt) ? t('rec_bad_date') : dt > today() ? t('rec_future') : R.num(vals.energy) === null ? t('rec_need_energy') : badNums ? t('rec_bad_num', { f: badNums }) : '';
      if (bad) { er.textContent = bad; return; }
      var nh = Object.assign({}, rf.htm, { date: dt });
      Object.keys(vals).forEach(function (k) { nh[k] = k === 'errCode' ? R.normCode(vals[k]) : (vals[k] === '' ? null : R.num(vals[k])); });
      rf.htm = nh; rf.editedAt = new Date().toISOString(); rf.updatedAt = Date.now(); delete rf.derived;
      save(); toast(t('b_saved')); go('rec-' + rf.id); return;
    }
    e.preventDefault();
    var f = e.target;
    if (f.id === 'baseline-form') {
      var b = {}; Array.prototype.forEach.call(f.querySelectorAll('[data-b]'), function (el) { b[el.getAttribute('data-b')] = el.value.trim(); });
      var hasAny = Object.keys(b).some(function (k) { return k !== 'errCode' && b[k]; });
      if (hasAny) { b.errCode = R.normCode(b.errCode); ['energy', 'volume', 'flow', 'power', 'tSupply', 'tReturn', 'hours', 'errHours'].forEach(function (k) { var n = R.num(b[k]); b[k] = n === null ? '' : n; }); S.baseline = b; }
      S.meter = S.meter || {};
      Array.prototype.forEach.call(f.querySelectorAll('[data-m]'), function (el) { S.meter[el.getAttribute('data-m')] = el.value.trim(); });
      S.onboarded = true; delete S._baseFill; save(); toast(t('b_saved')); go('home');
    } else if (f.id === 'step-form') {
      var nb = document.querySelector('[data-act="step-next"]'); if (nb) nb.click();
    } else if (f.id === 'reject-form') {
      var r = RD().filter(function (x) { return x.id === f.getAttribute('data-id'); })[0];
      var text = document.getElementById('rej-text').value.trim();
      if (r) { var dec = R.decodeRobot(text); r.status = 'rejected'; r.updatedAt = Date.now(); r.robot = { text: text, code: dec.code, fix: dec.fix || null }; save(); }
      render();
    } else if (f.id === 'login-form') {
      var em = document.getElementById('a-email').value.trim(), pw = document.getElementById('a-pass').value, er = document.getElementById('login-err');
      er.textContent = '';
      var done = busy(f.querySelector('[type=submit]'));
      (f.getAttribute('data-mode') === 'register' ? Y().register(em, pw) : Y().login(em, pw)).then(function (j) { done(); afterLogin(j, er); }, function () { done(); er.textContent = t('err_network'); });
    } else if (f.id === 'setpass-form') {
      var em2 = document.getElementById('a-email').value.trim(), pw2 = document.getElementById('a-pass').value, er2 = document.getElementById('setpass-err');
      var done2 = busy(f.querySelector('[type=submit]'));
      Y().setPassword(em2, pw2).then(function (j) { done2(); if (j._status === 200) { toast(t('b_saved')); render(true); } else er2.textContent = authError(j); });
    } else if (f.id === 'import-form') {
      try { var data = JSON.parse(document.getElementById('p-import').value); if (!data || typeof data !== 'object' || !Array.isArray(data.readings)) throw new Error('bad'); S = Object.assign(defaults(), data); S.lang = browserLang(); save(); toast(t('p_import_ok')); render(); }
      catch (err) { toast(t('p_import_bad')); }
    }
  });
  // назад/вперёд: после pushState браузер шлёт popstate, а hashchange — не всегда; рисуем один раз на каждый адрес
  var lastHash = null;
  var onNav = function () { if (location.hash === lastHash) return; render(); };
  window.addEventListener('hashchange', onNav); window.addEventListener('popstate', onNav);
  var tw = window.Telegram && window.Telegram.WebApp;
  if (tw && tw.initData) { try { tw.ready(); tw.expand(); applyTheme(); if (tw.onEvent) tw.onEvent('themeChanged', function () { applyTheme(); safeRender(); }); } catch (e) { /* старый клиент */ } }
  if (window.TEPLO_API && window.TeploVision) window.TeploVision.initServer({}, false);
  // кнопка из напоминания бота: ?go=wnew — ввод воды, ?go=heat — тепло
  (function () {
    var g = (location.search.match(/[?&]go=(wnew|heat)(?=&|$)/) || [])[1]; if (!g) return;
    var q = location.search.replace(/([?&])go=[\w-]+(&|$)/, '$1').replace(/[?&]$/, '');
    try { history.replaceState(null, '', location.pathname + q + '#' + g); } catch (e) { location.hash = g; }
    if (g === 'wnew') WN = wnFresh('hot');
  })();
  render();
  PHS.restore().then(function (ok) { if (ok && routeName() === 'photo') safeRender(); });
  if (window.TeploSync) {
    var onSync = function () {
      var el = document.getElementById('sync-status'); if (el) el.textContent = syncStatusText();
      if (window.TEPLO_API && window.TeploVision && window.TeploSync._cfg) window.TeploVision.initServer(window.TeploSync._cfg, !!window.TeploSync.account);
      if (!window.TeploSync.account) ADMIN = null; else { checkAdmin(); if (INBOX.items === null || INBOX.auto) loadInbox(); histFlush(); }
      if (['prefs', 'login', 'welcome', 'home', 'meter', 'baseline'].indexOf(routeName() || 'welcome') >= 0 || /^step-/.test(routeName())) safeRender();
    };
    window.TeploSync.init(function () { return S; }, applyRemote, onSync);
    if (window.TEPLO_API) window.TeploSync.config().then(function (c) { window.TeploSync._cfg = c; onSync(); }, function () { /* сервер недоступен */ });
  }
  if (window.TeploVision) window.TeploVision.init(function () { if (['home', 'meter', 'photo', 'step-0', ''].indexOf(routeName()) >= 0) safeRender(); });
})();

</script>
