<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Счётчики — аналитика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --housing:#E9EEEB; --surface:#fff; --ink:#17211E; --ink2:#4A5652; --line:#CFD7D3; --lcd:#BCC8A2; --ok:#1E7B4C; --oks:#DFF1E7; --warn:#8F5600; --warns:#FBEFD5; --bad:#A3142E; --bads:#F9E1E5; --info:#2F68B0; --infos:#E2ECF8;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--housing); color: var(--ink); font: 400 15px/1.45 var(--font); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px; }
header b { font-size: 17px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 16px 10px; position: sticky; top: 0; background: var(--housing); z-index: 2; }
nav button { font: 600 14px/1 var(--font); border: 1.5px solid transparent; background: transparent; color: var(--ink2); padding: 10px 14px; border-radius: 999px; cursor: pointer; }
nav button[aria-current="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); }
nav .n { display: inline-block; min-width: 18px; padding: 2px 6px; margin-left: 6px; border-radius: 999px; background: var(--bads); color: var(--bad); font-size: 12px; }
main { padding: 0 20px 48px; max-width: 1280px; }
.dbar { display: grid; grid-template-columns: minmax(110px, 200px) 1fr minmax(150px, auto); gap: 10px; align-items: center; margin: 6px 0; font-size: 14px; }
.dbar .dt { height: 10px; background: var(--housing); border-radius: 6px; overflow: hidden; } .dbar .dt i { display: block; height: 100%; background: var(--info); border-radius: 6px; }
#devices h3 { font-size: 15px; margin: 16px 0 4px; } .btn.on { outline: 2px solid var(--info); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card { background: var(--surface); border-radius: 12px; padding: 14px 16px; }
.card .v { font: 500 30px/1.1 var(--mono); }
.card .k { color: var(--ink2); font-size: 13px; }
.panel { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 16px; overflow-x: auto; }
h2 { font-size: 18px; margin: 0 0 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--ink2); font-size: 13px; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: #F4F7F5; }
.mono { font-family: var(--mono); }
.muted { color: var(--ink2); } .small { font-size: 13px; }
.pill { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.p-ok { background: var(--oks); color: var(--ok); } .p-warn { background: var(--warns); color: var(--warn); } .p-bad { background: var(--bads); color: var(--bad); } .p-info { background: var(--infos); color: var(--info); }
.btn { font: 600 14px/1 var(--font); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
input[type=search] { font: 400 15px var(--font); padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; width: min(420px, 100%); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.ph { background: var(--surface); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.ph img { width: 100%; height: 200px; object-fit: cover; background: #222; cursor: zoom-in; display: block; }
.ph .noimg { height: 200px; display: grid; place-items: center; background: var(--line); color: var(--ink2); }
.ph .b { padding: 10px 12px; font-size: 13px; display: grid; gap: 6px; }
.problem { color: var(--bad); }
.reads { font-family: var(--mono); font-size: 12px; background: var(--lcd); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; }
.msg { white-space: pre-wrap; max-width: 60ch; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.center { max-width: 520px; margin: 12vh auto; background: var(--surface); padding: 24px; border-radius: 16px; }
.zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 9; cursor: zoom-out; }
.zoom img { max-width: 96vw; max-height: 96vh; }
pre.state { font: 12px/1.4 var(--mono); background: #F4F7F5; padding: 10px; border-radius: 8px; max-height: 360px; overflow: auto; }
@media (max-width: 640px) { main { padding: 0 10px 40px; } th, td { padding: 6px; } }
</style>
</head>
<body>
<div id="app"><div class="center">Загрузка…</div></div>
<script>
(function () {
  'use strict';
  var API = '__TEPLO_API__';
  var SITE = API.replace(/\/api$/, '') + '/';
  var app = document.getElementById('app');
  var TAB = (location.hash || '#overview').slice(1), DATA = {}, Q = '', PF = 'all', DDAYS = 30;
  var FIELD = { energy: 'Энергия', volume: 'Объём', flow: 'Расход', power: 'Мощность', tSupply: 'Подача', tReturn: 'Обратка', hours: 'Часы', errHours: 'Часы ошибки', errCode: 'Код ошибки', water_hot: 'Горячая вода', water_cold: 'Холодная вода',
    elec_all: 'Свет', elec_day: 'Свет, день', elec_night: 'Свет, ночь', elec_peak: 'Свет, пик', elec_half: 'Свет, полупик', gas_all: 'Газ' };
  // виды счётчиков: короткие подписи для таблиц
  var KN = { heat: 'тепло', hot: 'гор. вода', cold: 'хол. вода', elec: 'свет', gas: 'газ', water: 'вода' };
  var ZN = { all: '', day: 'день', night: 'ночь', peak: 'пик', half: 'полупик' };
  function kindsLine(k) { k = k || {}; var a = ['heat', 'hot', 'cold', 'elec', 'gas'].filter(function (x) { return k[x] > 0; }).map(function (x) { return KN[x] + (k[x] > 1 ? ' ×' + k[x] : ''); }); return a.length ? esc(a.join(' · ')) : '<span class="muted">—</span>'; }
  /** «2026-11-02» → «02.11.26», как в остальных датах админки. */
  function dday(d) { var m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(d || '')); return m ? m[3] + '.' + m[2] + '.' + m[1].slice(2) : esc(d || ''); }
  function lastLine(l) {
    if (!l) return '—';
    var st = l.own ? 'для себя' : l.kind === 'heat' ? (STATUS[l.status] || l.status || '') : l.sent ? 'передано' : 'не передано';
    return dday(l.date) + '<div class="muted small">' + esc(KN[l.kind] || l.kind) + ' · ' + esc(st) + (l.source === 'photo' ? ' · с фото' : '') + '</div>';
  }
  var MODEL = { sharky774: 'SHARKY 774', sharky775: 'SHARKY 775', t330: 'ULTRAHEAT T330', t230: 'ULTRAHEAT T230', multical302: 'MULTICAL 302', elf: 'ELF', sensostar: 'SensoStar', nik7071: 'НІК 7071', trust: 'TRUST', other: 'другая' };
  var STATUS = { checked: 'проверено', handed: 'передано в ХТМ', accepted: 'принято ХТМ', rejected: 'отклонено ХТМ', intermediate: 'промежуточное' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function cookie(n) { var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; }
  function get(path) { return fetch(API + path, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); }); }
  function post(path, body) { return fetch(API + path, { method: 'POST', credentials: 'same-origin', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json', 'X-CSRF': cookie('ts_csrf'), Accept: 'application/json' } }).then(function (r) { return r.json(); }); }
  function when(iso) { if (!iso) return '—'; var d = new Date(iso); if (isNaN(d)) return esc(iso); return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }); }
  function who(x) { var a = []; if (x.email) a.push(esc(x.email)); if (x.tg_username) a.push('@' + esc(x.tg_username)); else if (x.tg_id) a.push('tg ' + esc(x.tg_id)); return a.join('<br>') || ('#' + esc(x.user_id || x.id)); }
  function ua(s) { s = s || ''; return /iPhone|iPad/.test(s) ? 'iPhone/iPad' : /Android/.test(s) ? 'Android' : /Telegram/.test(s) ? 'Telegram' : /Mac/.test(s) ? 'Mac' : /Windows/.test(s) ? 'Windows' : s ? 'другое' : '—'; }
  function pill(cls, t) { return '<span class="pill p-' + cls + '">' + esc(t) + '</span>'; }

  function shell(body) {
    var o = DATA.overview || {};
    var tabs = [['overview', 'Сводка'], ['users', 'Пользователи', 0], ['feedback', 'Сообщения', o.feedbackNew], ['photos', 'Фото', 0], ['reports', 'Ошибки распознавания', o.reportsBad], ['reminders', 'Напоминания', o.cronAgo == null || o.cronAgo > 600 ? '!' : 0], ['settings', 'Настройки', !o.telegram ? '!' : 0]];
    app.innerHTML = '<header><b>Счётчики · аналитика</b><span class="muted small">' + esc(o.me || '') + '</span><span style="flex:1"></span><a class="btn" href="' + esc(SITE) + '">На сайт</a></header>' +
      '<nav>' + tabs.map(function (t) { return '<button data-tab="' + t[0] + '"' + (TAB === t[0] ? ' aria-current="true"' : '') + '>' + t[1] + (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>'; }).join('') + '</nav><main>' + body + '</main>';
  }

  var VIEW = {};
  VIEW.overview = function () {
    var o = DATA.overview;
    var c = function (v, k) { return '<div class="card"><div class="v">' + esc(v) + '</div><div class="k">' + k + '</div></div>'; };
    var warn = [];

    if (o.cronAgo == null || o.cronAgo > 600) warn.push('Фоновые задачи (cron.php) ' + (o.cronAgo == null ? '<b>ни разу не запускались</b>' : '<b>не запускались ' + Math.round(o.cronAgo / 60) + ' мин</b>') + ' — напоминания не уйдут, старые фото не удалятся. Сервер должен запускать cron.php раз в минуту.');
    if (!o.telegram) warn.push('Вход через Telegram <b>выключен</b> — подключите бота во вкладке <a href="#settings">«Настройки»</a>.');
    return (warn.length ? '<div class="panel" style="background:var(--warns)">' + warn.map(function (w) { return '<p style="margin:4px 0">' + w + '</p>'; }).join('') + '</div>' : '') +
      '<div class="cards">' + c(o.users, 'пользователей всего') + c(o.usersWeek, 'новых за 7 дней') + c(o.activeWeek, 'входили за 7 дней') + c(o.withTelegram, 'с Telegram') + c(o.withData, 'сохранили данные') +
      c(o.feedback, 'сообщений (новых: ' + o.feedbackNew + ')') + c(o.photos, 'фото загружено') + c(o.photosFailed, 'фото с проблемами') + c(o.reportsBad + ' / ' + o.reports, 'распознаваний с замечаниями') + '</div>' +
      '<p class="muted small">Фото хранятся ' + o.photoKeepDays + ' дней, потом удаляются автоматически.</p>' + trackBlock(o.tracking) + devicesBlock();
  };
  /** Что ведут: у скольких людей есть каждый вид счётчика и сколько по нему показаний (без удалённых и стартовых). */
  function trackBlock(t) {
    if (!t) return '';
    return '<div class="panel"><h2>Что ведут</h2><p class="muted small">Из тех, кто сохранил данные: прошли первую настройку — ' + t.onboarded + ', есть хоть один счётчик — ' + t.withMeters +
      ', с двумя и больше квартирами — ' + t.multi + ', показаний «для себя» — ' + t.own + '.</p><table><thead><tr><th>Вид</th><th>Людей со счётчиком</th><th>Показаний</th></tr></thead><tbody>' +
      // вода — одна запись на дату с горячей и холодной вместе, поэтому показания воды — одной строкой
      [['тепло', t.users.heat, t.recs.heat], ['вода', 'горячая ' + (t.users.hot || 0) + ' · холодная ' + (t.users.cold || 0), t.recs.water], ['свет', t.users.elec, t.recs.elec], ['газ', t.users.gas, t.recs.gas]].map(function (r) {
        return '<tr><td>' + esc(r[0]) + '</td><td class="mono">' + esc(r[1] || 0) + '</td><td class="mono">' + (r[2] || 0) + '</td></tr>'; }).join('') +
      '</tbody></table></div>';
  }
  /** С чего работают: телефон / планшет / компьютер, система, Telegram, «на экране Домой», ширина экрана, по дням. */
  var DEV = { mobile: 'Телефон', tablet: 'Планшет', desktop: 'Компьютер' };
  function devicesBlock() {
    var d = DATA.devices; if (!d || !d.total) return '';
    var all = d.total.v || 0, pc = function (v) { return all ? Math.round(v * 100 / all) : 0; };
    var bar = function (label, x) { x = x || { v: 0, u: 0, h: 0 }; return '<div class="dbar"><span class="dl">' + esc(label) + '</span><span class="dt"><i style="width:' + pc(x.v) + '%"></i></span><span class="dv"><b>' + pc(x.v) + '%</b> <span class="muted small">' + x.v + ' браузер.' + (x.u ? ' · ' + x.u + ' вошедш.' : '') + ' · ' + x.h + ' откр.</span></span></div>'; };
    var sel = [7, 30, 90].map(function (n) { return '<button class="btn' + (DDAYS === n ? ' on' : '') + '" data-ddays="' + n + '">' + n + ' дн.</button>'; }).join(' ');
    var os = Object.keys(d.os || {}).sort(function (a, b) { return d.os[b].v - d.os[a].v; });
    var days = Object.keys(d.daily || {}).slice(0, 14);
    var wmax = Math.max.apply(null, Object.keys(d.width).map(function (k) { return d.width[k]; }).concat([1]));
    return '<div class="panel" id="devices"><h2>С чего работают <span class="muted small">за ' + d.days + ' дн. · ' + all + ' браузеров, ' + d.total.u + ' вошедших, ' + d.total.h + ' открытий</span></h2>' +
      '<p>' + sel + '</p>' + (all ? '' : '<p class="muted">Пока никто не открывал сайт с этого обновления.</p>') +
      ['mobile', 'tablet', 'desktop'].map(function (k) { return bar(DEV[k], d.device[k]); }).join('') +
      '<h3>Система</h3>' + os.map(function (k) { return bar(k === 'other' ? 'другая' : k, d.os[k]); }).join('') +
      '<h3>Где открывают</h3>' + bar('Telegram (мини-приложение)', d.tg.tg) + bar('Браузер', d.tg.web) + (d.pwa.pwa ? bar('Как приложение (экран «Домой»)', d.pwa.pwa) : '') +
      '<h3>Ширина экрана, px</h3>' + Object.keys(d.width).map(function (k) { var n = d.width[k]; return '<div class="dbar"><span class="dl">' + esc(k) + '</span><span class="dt"><i style="width:' + Math.round(n * 100 / wmax) + '%"></i></span><span class="dv">' + n + '</span></div>'; }).join('') +
      (days.length ? '<h3>По дням (браузеров)</h3><table><thead><tr><th>День</th><th>Телефон</th><th>Планшет</th><th>Компьютер</th></tr></thead><tbody>' + days.map(function (k) { var x = d.daily[k]; return '<tr><td>' + esc(k.split('-').reverse().join('.')) + '</td><td>' + (x.mobile || 0) + '</td><td>' + (x.tablet || 0) + '</td><td>' + (x.desktop || 0) + '</td></tr>'; }).join('') + '</tbody></table>' : '') +
      '<p class="muted small">Считаем браузеры (случайный id в браузере, без IP и личных данных); один человек с телефона и компьютера — два браузера. «Вошедших» — сколько из них с входом в аккаунт. Собираем с ' + esc((d.since || '').split('-').reverse().join('.') || 'сегодня') + '.</p></div>';
  }

  /** Показаний по видам: «тепло 4 (3 перед.) · вода 7 · свет 3 · газ 2 · для себя 1». */
  function recsLine(s) {
    var r = s.recs || { heat: s.readings || 0 }, a = [];
    if (r.heat) a.push('тепло ' + r.heat + (s.handed ? ' <span class="muted">(' + s.handed + ' перед.)</span>' : ''));
    ['water', 'elec', 'gas'].forEach(function (k) { if (r[k]) a.push(KN[k] + ' ' + r[k]); });
    if (s.own) a.push('<span class="muted">для себя ' + s.own + '</span>');
    return a.length ? a.join('<br>') : '0';
  }
  VIEW.users = function () {
    var us = DATA.users || [];
    return '<div class="filters"><input type="search" id="q" placeholder="Поиск: e-mail, @telegram, id, номер квартиры, телефон" value="' + esc(Q) + '"><span class="muted small">' + us.length + ' чел.</span></div>' +
      '<div class="panel"><table><thead><tr><th>#</th><th>Кто</th><th>Регистрация</th><th>Последний вход</th><th>Квартиры и счётчики</th><th>Показаний</th><th>Последнее</th><th>Фото</th><th>Сообщ.</th></tr></thead><tbody>' +
      us.map(function (u) {
        var s = u.state || {};
        return '<tr class="click" data-user="' + u.id + '"><td class="mono">' + u.id + '</td><td>' + who(u) + (s.phone ? '<div class="muted small">' + esc(s.phone) + '</div>' : '') + '</td><td>' + when(u.created_at) + '</td><td>' + when(u.last_login_at) + '</td>' +
          '<td>' + (s.places > 1 ? '<b>' + s.places + ' кв.</b> · ' : '') + kindsLine(s.kinds) + (s.meter ? '<div class="muted small">' + esc(MODEL[s.meter] || s.meter) + '</div>' : '') + (s.apartment ? '<div class="muted small">' + esc(s.apartment) + '</div>' : '') + '</td>' +
          '<td class="mono">' + recsLine(s) + '</td>' +
          '<td>' + lastLine(s.last) + '</td><td class="mono">' + (+u.photos || '') + '</td><td class="mono">' + (+u.feedback || '') + '</td></tr>';
      }).join('') + '</tbody></table>' + (us.length ? '' : '<p class="muted">Никого не найдено.</p>') + '</div>';
  };

  function photoCard(p) {
    var r = p.result && p.result.photo, m = p.result && p.result.meter;
    var reads = r && r.readings && r.readings.length ? r.readings.map(function (x) { return (FIELD[x.field] || x.field) + ': ' + (x.value != null ? x.value : (x.partial || '?')) + (x.unit ? ' ' + x.unit : '') + (x.confidence != null ? '  ' + Math.round(x.confidence * 100) + '%' : '') + (x.half ? '  (ролик между цифрами)' : '') + (x.guess ? '  (наугад)' : ''); }).join('\n') : '';
    var drums = p.result && p.result.drums && p.result.drums.length ? p.result.drums.map(function (d) { return d.text + (d.red ? ',' + d.red : '') + (d.tint ? ' ' + d.tint : '') + '  ' + Math.round((d.score || 0) * 100) + '% · голосов ' + (d.votes || 0) + (d.half ? ' · переход: ' + d.half.map(function (h) { return h.d == null ? '?' : h.d + '|' + ((h.d + 1) % 10); }).join(',') : '') + (d.shifted ? ' · сдвинут: ' + d.shifted.map(function (h) { return h.d; }).join(',') : ''); }).join('\n') : '';
    var st = p.status === 'recognized' ? (p.problem ? pill('warn', 'распознано с замечаниями') : pill('ok', 'распознано')) : p.status === 'failed' ? pill('bad', 'ошибка') : pill('info', 'загружено, не распознавалось');
    return '<div class="ph">' + (p.exists ? '<img loading="lazy" src="' + esc(API + '/admin/photo?id=' + p.id) + '" alt="фото ' + esc(p.id) + '" data-zoom>' : '<div class="noimg">файл удалён</div>') +
      '<div class="b"><div>' + st + '</div><div class="muted">' + when(p.created_at) + ' · ' + who(p).replace('<br>', ' ') + '</div>' +
      (m && (m.modelId || m.modelText) ? '<div>Счётчик: <b>' + esc(MODEL[m.modelId] || m.modelText || m.modelId) + '</b>' + (m.serial ? ' · № ' + esc(m.serial) : '') + '</div>' : '') +
      (r && r.kind ? '<div class="muted">тип снимка: ' + esc({ screen: 'экран', nameplate: 'шильдик', overview: 'общий план', other: 'другое', water: 'водомер', elec: 'электросчётчик', gas: 'газовый счётчик' }[r.kind] || r.kind) + (r.where === 'setup' ? ' · при настройке нового счётчика' : '') + '</div>' : '') +
      (reads ? '<div class="reads">' + esc(reads) + '</div>' : '') + (p.problem ? '<div class="problem">' + esc(p.problem) + '</div>' : '') +

      (wasmOk() ? '' : '<div class="panel" style="background:var(--bads)"><p><b>Распознавание в браузере сейчас заблокировано сервером.</b> Общий заголовок Content-Security-Policy, который Caddy ставит всем сайтам на этом домене, запрещает WebAssembly. Пока так — фото только сохраняются, цифры люди вводят вручную.</p>' +
        '<p>Исправить (на сервере, один раз): в конфиге Caddy в строке <code>script-src</code> после <code>\'unsafe-inline\'</code> дописать <code>\'wasm-unsafe-eval\'</code> и перезагрузить Caddy. Найти строку: <code>sudo grep -rn "script-src" /etc/caddy /srv/app</code>, потом <code>sudo systemctl reload caddy</code>.</p></div>') +
      '<p>' + (a.key ? pill('info', 'нейросеть Claude') + ' ключ <span class="mono">' + esc(a.key) + '</span> <span class="muted small">(' + esc(SRC[a.source] || '') + ')</span>' : pill('ok', 'бесплатно, в браузере')) + '</p>' +
      '<p class="small">По умолчанию фото распознаются <b>прямо в браузере человека</b> (PaddleOCR) — бесплатно, без ключа и без входа. ' +
      'Ключ Claude API ниже <b>не обязателен</b>: если его вставить, вошедшие пользователи будут распознаваться нейросетью на сервере (точнее на плохих фото, но платно — за каждое фото). Удалите ключ — снова бесплатно.</p>' +
      '<p class="muted small">Ключ берётся на <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com → API Keys</a> (нужен пополненный баланс). Перед сохранением сервер делает пробный запрос — неверный ключ не сохранится. Ключ хранится только на сервере, сюда он больше не показывается.</p>' +
      '<form id="fa"><p><label>Ключ API<br><input id="ak" type="password" autocomplete="off" placeholder="' + (a.key ? 'оставьте пустым, чтобы не менять' : 'sk-ant-…') + '" ' + INP + '></label></p>' +
      '<p><label>Модель<br><input id="am" class="mono" value="' + esc(a.model || '') + '" ' + INP + '></label><span class="muted small">' + esc(SRC[a.modelSource] || '') + '</span></p>' +
      note('a') + '<p><button class="btn" type="submit">Проверить и сохранить</button>' + (a.source === 'admin' ? ' <button class="btn" type="button" id="ac">Удалить ключ</button>' : '') + '</p></form></div>' +

      '<div class="panel"><h2>Telegram-бот (вход и Mini App)</h2>' +
      '<p>' + (t.token ? pill(hookOk ? 'ok' : 'warn', hookOk ? 'подключён' : 'токен есть, вебхук не настроен') + ' <a href="https://t.me/' + esc(t.username) + '" target="_blank" rel="noopener">@' + esc(t.username) + '</a> <span class="muted small">(' + esc(SRC[t.source] || '') + ')</span>' : pill('bad', 'не подключён')) + '</p>' +
      (w && w.lastError ? '<p class="problem small">Последняя ошибка доставки от Telegram (' + when(w.lastErrorAt) + '): ' + esc(w.lastError) + '</p>' : '') +
      '<ol class="small" style="padding-left:20px;line-height:1.6">' +
      '<li>В Telegram откройте <a href="https://t.me/BotFather" target="_blank" rel="noopener">@BotFather</a> → <code>/newbot</code> → имя (например «Лічильники») → username, оканчивающийся на <code>bot</code>.</li>' +
      '<li>BotFather пришлёт токен вида <code>1234567890:AA…</code> — вставьте его ниже и нажмите «Подключить». Сервер сам узнает имя бота, придумает секрет вебхука, поставит вебхук, кнопку меню и команду /start.</li>' +
      '<li>Для входа через Telegram на обычном сайте: в @BotFather <code>/setdomain</code> → выберите бота → отправьте <code>' + esc(d.host || '') + '</code>.</li>' +
      '<li>Проверка: откройте бота, нажмите «Старт» — придёт кнопка «Відкрити «Лічильники»», сервис откроется уже с входом.</li></ol>' +
      '<form id="ft"><p><label>Токен бота<br><input id="tk" type="password" autocomplete="off" placeholder="' + (t.token ? 'оставьте пустым, чтобы переподключить текущего' : '1234567890:AA…') + '" ' + INP + '></label></p>' +
      note('t') + '<p><button class="btn" type="submit">' + (t.token ? 'Сохранить и переподключить' : 'Подключить') + '</button>' + (t.source === 'admin' ? ' <button class="btn" type="button" id="tc">Отключить бота</button>' : '') + '</p></form></div>' +
      '<p class="muted small">Значения, заданные здесь, главнее config.php. Адрес сайта для бота: <span class="mono">' + esc(d.appUrl || '') + '</span></p>';
  };
  function saveSettings(path, body, k, okText) {
    var btns = document.querySelectorAll('#fa button, #ft button'); btns.forEach(function (b) { b.disabled = true; });
    return post(path, body).then(function (r) {
      DATA.settingsMsg = DATA.settingsMsg || {};
      if (r && r.settings) DATA.settings = r.settings;
      DATA.settingsMsg[k] = r && r.ok ? { ok: true, text: okText(r) } : { ok: false, text: (r && (r.human || (r.setup && r.setup.errors && r.setup.errors.join('; ')) || r.error)) || 'Ошибка' };
      return show('settings', null, true);
    }, function () { DATA.settingsMsg = {}; DATA.settingsMsg[k] = { ok: false, text: 'Сервер недоступен.' }; show('settings', null, true); });
  }
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'fa') { e.preventDefault(); saveSettings('/admin/settings/anthropic', { key: document.getElementById('ak').value.trim(), model: document.getElementById('am').value.trim() }, 'a', function (r) { return 'Ключ работает (модель ' + ((r.checked && r.checked.model) || '') + '), распознавание включено. Можно пробовать «з фото» на сайте.'; }); }
    if (e.target.id === 'ft') { e.preventDefault(); saveSettings('/admin/settings/telegram', { token: document.getElementById('tk').value.trim() }, 't', function (r) { return 'Бот @' + r.bot + ' подключён: вебхук, кнопка меню и /start настроены. Не забудьте /setdomain в @BotFather.'; }); }
  });
  document.addEventListener('click', function (e) {
    if (e.target.id === 'ac' && confirm('Удалить ключ API? Распознавание выключится.')) saveSettings('/admin/settings/anthropic', { clear: 1 }, 'a', function () { return 'Ключ удалён.'; });
    if (e.target.id === 'tc' && confirm('Отключить бота от сайта?')) saveSettings('/admin/settings/telegram', { clear: 1 }, 't', function () { return 'Бот отключён.'; });
  });

  var LOAD = {
    settings: function () { return get('/admin/settings').then(function (j) { DATA.settings = j; }); },
    overview: function () { return get('/admin/devices?days=' + DDAYS).then(function (j) { DATA.devices = j; }); },
    users: function () { return get('/admin/users?q=' + encodeURIComponent(Q)).then(function (j) { DATA.users = j.users; }); },
    feedback: function () { return get('/admin/feedback').then(function (j) { DATA.feedback = j.feedback; }); },
    photos: function () { return get('/admin/photos' + (PF === 'problems' ? '?filter=problems' : '')).then(function (j) { DATA.photos = j.photos; }); },
    reports: function () { return get('/admin/reports').then(function (j) { DATA.reports = j.reports; }); },
    reminders: function () { return get('/admin/reminders').then(function (j) { DATA.reminders = j; }); }
  };
  function show(tab, uid, keepMsg) {
    TAB = tab; if (!keepMsg) DATA.settingsMsg = {};
    var p = get('/admin/overview').then(function (j) { DATA.overview = j; });
    p = p.then(uid ? function () { return get('/admin/user?id=' + uid).then(function (j) { DATA.user = j; }); } : (LOAD[tab] || LOAD.overview));
    return p.then(function () { shell((VIEW[tab] || VIEW.overview)()); if (tab === 'users') { var q = document.getElementById('q'); if (q && Q) { q.focus(); q.setSelectionRange(Q.length, Q.length); } } },
      function () { shell('<div class="panel problem">Не удалось загрузить. Обновите страницу.</div>'); });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-tab],[data-user],[data-pf],[data-fb],[data-zoom],[data-ddays],.zoom'); if (!el) return;
    if (el.hasAttribute('data-ddays')) { e.preventDefault(); DDAYS = +el.getAttribute('data-ddays'); show('overview'); return; }
    if (el.classList.contains('zoom')) { el.remove(); return; }
    if (el.hasAttribute('data-zoom')) { var z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = '<img src="' + esc(el.src) + '" alt="">'; document.body.appendChild(z); return; }
    e.preventDefault();
    if (el.hasAttribute('data-tab')) { location.hash = el.getAttribute('data-tab'); return; }
    if (el.hasAttribute('data-user')) { location.hash = 'user-' + el.getAttribute('data-user'); return; }
    if (el.hasAttribute('data-pf')) { PF = el.getAttribute('data-pf'); show('photos'); return; }
    if (el.hasAttribute('data-fb')) { post('/admin/feedback', { id: +el.getAttribute('data-fb'), status: el.getAttribute('data-st') }).then(function () { show('feedback'); }); }
  });
  var qt;
  document.addEventListener('input', function (e) { if (e.target.id === 'q') { Q = e.target.value; clearTimeout(qt); qt = setTimeout(function () { show('users'); }, 300); } });
  window.addEventListener('hashchange', route);
  function route() { var h = (location.hash || '#overview').slice(1), m = h.match(/^user-(\d+)$/); if (m) show('user', +m[1]); else show(h); }

  function loginForm(err) {
    app.innerHTML = '<form class="center" id="lf"><h2>Вход в аналитику</h2>' +
      '<p><label>E-mail<br><input id="le" type="email" autocomplete="username" required style="width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px"></label></p>' +
      '<p><label>Пароль<br><input id="lp" type="password" autocomplete="current-password" required style="width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px"></label></p>' +
      (err ? '<p class="problem">' + esc(err) + '</p>' : '') + '<p><button class="btn" type="submit">Войти</button></p></form>';
    document.getElementById('lf').addEventListener('submit', function (e) {
      e.preventDefault();
      var go = function () { return post('/auth/login', { email: document.getElementById('le').value, password: document.getElementById('lp').value }); };
      (cookie('ts_csrf') ? go() : get('/config').then(go)).then(function (r) {
        if (r && r.user) location.reload();
        else loginForm(r && r.error === 'locked' ? 'Слишком много попыток — подождите 15 минут.' : r && r.error === 'rate_limited' ? 'Слишком много попыток — подождите.' : 'Неверный e-mail или пароль.');
      }, function () { loginForm('Сервер недоступен.'); });
    });
  }

  get('/admin/me').then(function (j) {
    if (j._status === 401 || j.error === 'unauthorized') { loginForm(''); return; }
    if (!j.admin) {
      return get('/me').then(function (me) {
        var u = me.user || {};
        app.innerHTML = '<div class="center"><h2>Нет доступа</h2><p>Аналитика открыта только владельцу. Чтобы открыть её этому аккаунту, допишите в <code>/srv/sites/teplo_test_data/config.php</code>:</p><pre class="state">\'admins\' => [\'emails\' => [' + (u.email ? "'" + esc(u.email) + "'" : '') + '], \'telegram\' => [' + (u.telegram ? "'" + esc(u.telegram.id) + "'" : '') + ']],</pre><p><a class="btn" href="' + esc(SITE) + '">На сайт</a> <button class="btn" id="lo">Войти другим аккаунтом</button></p></div>';
        document.getElementById('lo').onclick = function () { post('/auth/logout', {}).then(function () { location.reload(); }); };
      });
    }
    route();
  }, function () { app.innerHTML = '<div class="center">Сервер недоступен.</div>'; });
})();
</script>
</body>
</html>
