<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Счётчики — аналитика</title>
<link rel="stylesheet" href="web/fonts/fonts.css">
<style>
:root { --housing:#E9EEEB; --surface:#fff; --ink:#17211E; --ink2:#4A5652; --line:#CFD7D3; --lcd:#BCC8A2; --ok:#1E7B4C; --oks:#DFF1E7; --warn:#8F5600; --warns:#FBEFD5; --bad:#A3142E; --bads:#F9E1E5; --info:#2F68B0; --infos:#E2ECF8;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--housing); color: var(--ink); font: 400 15px/1.45 var(--font); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px; }
header b { font-size: 17px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 16px 10px; position: sticky; top: 0; background: var(--housing); z-index: 2; }
nav button { font: 600 14px/1 var(--font); border: 1.5px solid transparent; background: transparent; color: var(--ink2); padding: 10px 14px; border-radius: 999px; cursor: pointer; }
nav button[aria-current="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); }
nav .n { display: inline-block; min-width: 18px; padding: 2px 6px; margin-left: 6px; border-radius: 999px; background: var(--bads); color: var(--bad); font-size: 12px; }
main { padding: 0 20px 48px; max-width: 1280px; }
.dbar { display: grid; grid-template-columns: minmax(110px, 200px) 1fr minmax(150px, auto); gap: 10px; align-items: center; margin: 6px 0; font-size: 14px; }
.dbar .dt { height: 10px; background: var(--housing); border-radius: 6px; overflow: hidden; } .dbar .dt i { display: block; height: 100%; background: var(--info); border-radius: 6px; }
#devices h3 { font-size: 15px; margin: 16px 0 4px; } .btn.on { outline: 2px solid var(--info); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card { background: var(--surface); border-radius: 12px; padding: 14px 16px; }
.card .v { font: 500 30px/1.1 var(--mono); }
.card .k { color: var(--ink2); font-size: 13px; }
.panel { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 16px; overflow-x: auto; }
h2 { font-size: 18px; margin: 0 0 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--ink2); font-size: 13px; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: #F4F7F5; }
.mono { font-family: var(--mono); }
.muted { color: var(--ink2); } .small { font-size: 13px; }
.pill { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.p-ok { background: var(--oks); color: var(--ok); } .p-warn { background: var(--warns); color: var(--warn); } .p-bad { background: var(--bads); color: var(--bad); } .p-info { background: var(--infos); color: var(--info); }
.btn { font: 600 14px/1 var(--font); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
input[type=search] { font: 400 15px var(--font); padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; width: min(420px, 100%); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.ph { background: var(--surface); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.ph img { width: 100%; height: 200px; object-fit: cover; background: #222; cursor: zoom-in; display: block; }
.ph .noimg { height: 200px; display: grid; place-items: center; background: var(--line); color: var(--ink2); }
.ph .b { padding: 10px 12px; font-size: 13px; display: grid; gap: 6px; }
.problem { color: var(--bad); }
.btn.ghost { background: transparent; color: inherit; border: 1.5px solid var(--line); } td.warn { color: var(--warn); } td.ok { color: var(--ok); }
.reads { font-family: var(--mono); font-size: 12px; background: var(--lcd); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; }
.msg { white-space: pre-wrap; max-width: 60ch; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.center { max-width: 520px; margin: 12vh auto; background: var(--surface); padding: 24px; border-radius: 16px; }
.zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 9; cursor: zoom-out; }
.zoom img { max-width: 96vw; max-height: 96vh; }
.geo-r { border-top: 1px solid var(--line); padding: 10px 0; } .geo-r summary { cursor: pointer; padding: 4px 0; } .geo-r[open] summary { margin-bottom: 8px; }
.geo-k { padding: 4px 0; } .geo-k + .geo-k { border-top: 1px dashed var(--line); }
.okmsg { color: var(--ok); font-weight: 600; } #hist summary { cursor: pointer; } #hist[open] summary { margin-bottom: 10px; }
pre.state { font: 12px/1.4 var(--mono); background: #F4F7F5; padding: 10px; border-radius: 8px; max-height: 360px; overflow: auto; }
@media (max-width: 640px) { main { padding: 0 10px 40px; } th, td { padding: 6px; }
  /* история версий на телефоне — карточками, без горизонтальной прокрутки */
  #hist thead { display: none; } #hist table, #hist tbody, #hist tr, #hist td { display: block; } #hist tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
  #hist td { border: 0; padding: 2px 6px; white-space: normal !important; } #hist td[data-l]::before { content: attr(data-l) ': '; color: var(--ink2); font-size: 13px; } #hist td.ha { padding-top: 8px; } }
.vbars{display:grid;gap:6px}.vb{display:grid;grid-template-columns:minmax(140px,38%) 1fr 40px;gap:8px;align-items:center}.vb-l{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb-t{height:12px;background:#EEF1F4;border-radius:6px;overflow:hidden}.vb-t i{display:block;height:100%;background:#2F6FDE;border-radius:6px}.vb-n{text-align:right;font-variant-numeric:tabular-nums}
.vdays{display:flex;gap:3px;align-items:flex-end;height:110px;overflow-x:auto;margin:6px 0 12px;padding-bottom:18px}.vd{flex:0 0 22px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;padding:0;cursor:pointer;position:relative}
.vd i{display:block;width:16px;background:#9DB9EE;border-radius:3px 3px 0 0}.vd.on i,.vd:hover i{background:#2F6FDE}.vd span{position:absolute;bottom:-17px;font-size:10px;color:#777;white-space:nowrap}
</style>
</head>
<body>
<div id="app"><div class="center">Загрузка…</div></div>
<script>
(function () {
  'use strict';
  var API = '__TEPLO_API__';
  var SITE = API.replace(/\/api$/, '') + '/';
  var app = document.getElementById('app');
  var TAB = (location.hash || '#overview').slice(1), DATA = {}, Q = '', PF = 'all', DDAYS = 30;
  var FIELD = { energy: 'Энергия', volume: 'Объём', flow: 'Расход', power: 'Мощность', tSupply: 'Подача', tReturn: 'Обратка', hours: 'Часы', errHours: 'Часы ошибки', errCode: 'Код ошибки', water_hot: 'Горячая вода', water_cold: 'Холодная вода',
    elec_all: 'Свет', elec_day: 'Свет, день', elec_night: 'Свет, ночь', elec_peak: 'Свет, пик', elec_half: 'Свет, полупик', gas_all: 'Газ' };
  // виды счётчиков: короткие подписи для таблиц
  var KN = { heat: 'тепло', hot: 'гор. вода', cold: 'хол. вода', elec: 'свет', gas: 'газ', water: 'вода' };
  var ZN = { all: '', day: 'день', night: 'ночь', peak: 'пик', half: 'полупик' };
  function kindsLine(k) { k = k || {}; var a = ['elec', 'hot', 'cold', 'gas', 'heat'].filter(function (x) { return k[x] > 0; }).map(function (x) { return KN[x] + (k[x] > 1 ? ' ×' + k[x] : ''); }); return a.length ? esc(a.join(' · ')) : '<span class="muted">—</span>'; }
  /** «2026-11-02» → «02.11.26», как в остальных датах админки. */
  function dday(d) { var m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(d || '')); return m ? m[3] + '.' + m[2] + '.' + m[1].slice(2) : esc(d || ''); }
  function lastLine(l) {
    if (!l) return '—';
    var st = l.own ? 'для себя' : l.kind === 'heat' ? (STATUS[l.status] || l.status || '') : l.sent ? 'передано' : 'не передано';
    return dday(l.date) + '<div class="muted small">' + esc(KN[l.kind] || l.kind) + ' · ' + esc(st) + (l.source === 'photo' ? ' · с фото' : '') + '</div>';
  }
  var MODEL = { sharky774: 'SHARKY 774', sharky775: 'SHARKY 775', t330: 'ULTRAHEAT T330', t230: 'ULTRAHEAT T230', multical302: 'MULTICAL 302', elf: 'ELF', sensostar: 'SensoStar', nik7071: 'НІК 7071', trust: 'TRUST', other: 'другая' };
  var STATUS = { checked: 'проверено', handed: 'передано в ХТМ', accepted: 'принято ХТМ', rejected: 'отклонено ХТМ', intermediate: 'промежуточное' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function cookie(n) { var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; }
  function get(path) { return fetch(API + path, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); }); }
  function post(path, body) { return fetch(API + path, { method: 'POST', credentials: 'same-origin', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json', 'X-CSRF': cookie('ts_csrf'), Accept: 'application/json' } }).then(function (r) { return r.json(); }); }
  function when(iso) { if (!iso) return '—'; var d = new Date(iso); if (isNaN(d)) return esc(iso); return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }); }
  function who(x) { if (x.guest) return esc(x.guest) + ' <span class="muted">(без входа)</span>'; var a = []; if (x.email) a.push(esc(x.email)); if (x.tg_username) a.push('@' + esc(x.tg_username)); else if (x.tg_id) a.push('tg ' + esc(x.tg_id)); return a.join('<br>') || ('#' + esc(x.user_id || x.id)); }
  function ua(s) { s = s || ''; return /iPhone|iPad/.test(s) ? 'iPhone/iPad' : /Android/.test(s) ? 'Android' : /Telegram/.test(s) ? 'Telegram' : /Mac/.test(s) ? 'Mac' : /Windows/.test(s) ? 'Windows' : s ? 'другое' : '—'; }
  function pill(cls, t) { return '<span class="pill p-' + cls + '">' + esc(t) + '</span>'; }

  function shell(body) {
    var o = DATA.overview || {};
    var tabs = [['overview', 'Сводка'], ['users', 'Пользователи', 0], ['geo', 'Откуда и сколько', 0], ['visitors', 'Откуда заходят', 0], ['feedback', 'Сообщения', o.feedbackNew], ['photos', 'Фото', 0], ['reports', 'Ошибки распознавания', o.reportsBad], ['journal', 'Журнал', 0], ['reminders', 'Напоминания', o.cronAgo == null || o.cronAgo > 600 ? '!' : 0], ['prov', 'Справочник', 0], ['pages', 'Отчёты', 0], ['settings', 'Настройки', !o.telegram ? '!' : 0]];
    app.innerHTML = '<header><b>Счётчики · аналитика</b><span class="muted small">' + esc(o.me || '') + '</span><span style="flex:1"></span><a class="btn" href="' + esc(SITE) + '">На сайт</a></header>' +
      '<nav>' + tabs.map(function (t) { return '<button data-tab="' + t[0] + '"' + (TAB === t[0] || (TAB === 'jsession' && t[0] === 'journal') || (/^prov/.test(TAB) && t[0] === 'prov') ? ' aria-current="true"' : '') + '>' + t[1] + (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>'; }).join('') + '</nav><main>' + body + '</main>';
  }

  var VIEW = {};
  VIEW.overview = function () {
    var o = DATA.overview;
    var c = function (v, k) { return '<div class="card"><div class="v">' + esc(v) + '</div><div class="k">' + k + '</div></div>'; };
    var warn = [];

    if (o.cronAgo == null || o.cronAgo > 600) warn.push('Фоновые задачи (cron.php) ' + (o.cronAgo == null ? '<b>ни разу не запускались</b>' : '<b>не запускались ' + Math.round(o.cronAgo / 60) + ' мин</b>') + ' — напоминания не уйдут, старые фото не удалятся. Сервер должен запускать cron.php раз в минуту.');
    if (!o.telegram) warn.push('Вход через Telegram <b>выключен</b> — подключите бота во вкладке <a href="#settings">«Настройки»</a>.');
    // Водоканал: бот (по ответам людей) и кабинет (сервер открывает страницу входа раз в 10 мин)
    var vk = o.vk || {}, vb = vk.bot || {}, vc = vk.cab;
    var vkLine = 'Водоканал — бот: ' + (vb.state === 'silent' ? '<b class="problem">не отвечает с ' + when(new Date(vb.since * 1000).toISOString()) + '</b> (заметили: ' + vb.users + ')' : vb.state === 'ok' ? 'отвечал ' + when(new Date(vb.lastOk * 1000).toISOString()) : 'нет данных (никто не пересылал ответов)') +
      ' · кабинет: ' + (!vc ? 'ещё не проверяли' : vc.state === 'ok' ? 'открывается (' + when(new Date(vc.at * 1000).toISOString()) + ')' : '<b class="problem">не открывается с ' + when(new Date(vc.since * 1000).toISOString()) + '</b>, код ' + esc(vc.code) + (vc.everOk ? '' : ' — с нашего сервера ни разу не открылся (может не пускать заграничные адреса)'));
    return (warn.length ? '<div class="panel" style="background:var(--warns)">' + warn.map(function (w) { return '<p style="margin:4px 0">' + w + '</p>'; }).join('') + '</div>' : '') +
      '<div class="panel small" data-key="adm-vk">' + vkLine + '</div>' +
      '<div class="cards">' + c(o.users, 'пользователей всего') + c(o.usersWeek, 'новых за 7 дней') + c(o.activeWeek, 'входили за 7 дней') + c(o.withTelegram, 'с Telegram') + c(o.withData, 'сохранили данные') +
      c(o.feedback, 'сообщений (новых: ' + o.feedbackNew + ')') + c(o.photos, 'фото загружено') + c(o.photosFailed, 'фото с проблемами') + c(o.reportsBad + ' / ' + o.reports, 'распознаваний с замечаниями') + '</div>' +
      '<p class="muted small">Фото хранятся ' + o.photoKeepDays + ' дней, потом удаляются автоматически.</p>' + consentLine(o.consent) + actBlock() + errorsBlock(o.errors) + botRepliesBlock(o.botReplies) + relayBlock(o.relay) + uaProbeBlock(o.uaProbe, o.uaCmd) + vkcabBlock(o.vkcab, vc) + htmcabBlock(o.htmcab) + trackBlock(o.tracking) + devicesBlock();
  };
  /** Баннер cookie (с 07.11.2026): журнал действий и «С чего работают» пишутся только у тех, кто разрешил аналитику — иначе цифры кажутся «пропавшими». */
  function consentLine(c) {
    if (!c) return '';
    var pc = c.total ? Math.round(c.yes * 100 / c.total) : 0;
    return '<p class="small" data-key="adm-consent"><b>Cookie</b> за ' + c.days + ' дней: ' + (c.total ? 'разрешили аналитику <b>' + c.yes + '</b> из ' + c.total + ' браузеров (' + pc + ' %), отказались ' + c.no +
      (c.changed ? ', меняли решение ' + c.changed : '') : 'ещё никто не выбирал') + '. <span class="muted">Журнал действий и «С чего работают» видят только разрешивших; кто не ответил на баннер — не считается.</span></p>';
  }
  /** Сбои сервера (500): что упало — по ним чинить; пусто — хорошо. */
  function errorsBlock(l) {
    l = l || []; var day = l.filter(function (x) { return Date.now() / 1000 - x.at < 86400; }).length;
    return '<details class="panel" data-key="adm-errors"' + (day ? ' open' : '') + '><summary><b>Сбои сервера</b> <span class="muted small">(' + (day ? '<b class="problem">за сутки: ' + day + '</b>, ' : '') + 'всего ' + l.length + ')</span></summary>' +
      (l.length ? '<table><thead><tr><th>Когда</th><th>Запрос</th><th>Что</th><th>Где</th></tr></thead><tbody>' + l.map(function (x) {
        return '<tr><td data-l="Когда" class="nowrap">' + when(new Date(x.at * 1000).toISOString()) + '</td><td data-l="Запрос">' + esc(x.m + ' ' + x.p) + '</td><td data-l="Что" style="white-space:pre-wrap">' + esc(x.e) + '</td><td data-l="Где" class="nowrap">' + esc(x.w) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="muted small">Сбоев нет.</p>') + '</details>';
  }
  /** Ответы ботов поставщиков, которые люди переслали нашему боту: по ним видно, ловит ли Telegram::botKind «прийнято». */
  function botRepliesBlock(l) {
    var SRC = { vk: 'Водоканал @hvk_user_bot', obl: 'Харьковоблэнерго @Kooz2bot', grm: 'Газсети @mygrmu_bot' }, KIND = { ok: 'принято', err: 'ошибка', info: 'прочее' };
    return '<details class="panel" data-key="adm-botreplies"><summary><b>Пересланные ответы ботов поставщиков</b> <span class="muted small">(' + (l || []).length + ')</span></summary>' +
      (l && l.length ? '<p class="muted small">Как сервис понял ответ: «принято» — отметил «передано» сам; «прочее» — человек жмёт «Прийняв». Если «принято» попало в «прочее» — поправить Telegram::botKind (app/telegram.php).</p>' +
        '<table><thead><tr><th>Когда</th><th>Бот</th><th>Понял как</th><th>Текст</th><th>Кто</th></tr></thead><tbody>' + l.map(function (r) {
          return '<tr><td data-l="Когда" class="nowrap">' + when(new Date(r.msg_at * 1000).toISOString()) + '</td><td data-l="Бот">' + esc(SRC[r.src] || r.src) + '</td><td data-l="Понял как"' + (r.kind === 'err' ? ' class="problem"' : '') + '>' + esc(KIND[r.kind] || r.kind) + '</td>' +
            '<td data-l="Текст" style="white-space:pre-wrap">' + esc(String(r.text || '').slice(0, 500)) + '</td><td data-l="Кто"><a href="#user-' + r.user_id + '" data-user="' + r.user_id + '">' + esc(r.email || (r.tg_username ? '@' + r.tg_username : '#' + r.user_id)) + '</a></td></tr>';
        }).join('') + '</tbody></table>' : '<p class="muted small">Пока никто не пересылал.</p>') + '</details>';
  }
  /** Кабинет Водоканала: проверки рахунку и отправки через наш сервер — что увидели (цифры скрыты #). */
  function vkcabBlock(l, vc) {
    var R = { ok: 'ок', err: 'ошибка сайта', unknown: '<b class="problem">непонятный ответ</b>', notfound: 'рахунок не найден', changed: '<b class="problem">страница не узнана</b>', down: '<b class="problem">не отвечает</b>', mismatch: 'список счётчиков другой' };
    return '<details class="panel" data-key="adm-vkcab"><summary><b>Кабинет Водоканала — проверки и отправки</b> <span class="muted small">(' + (l || []).length + (vc && vc.send === false ? ', <b class="problem">разбор HTML на сервере выключен: нужен php-xml</b>' : '') + ')</span></summary>' +
      (l && l.length ? '<table><thead><tr><th>Когда</th><th>Что</th><th>Итог</th><th>Подробно</th></tr></thead><tbody>' + l.map(function (d) {
        var det = { steps: d.steps, where: d.where, msgs: d.msgs, fieldErr: d.fieldErr, form: d.form, forms: d.forms, err: d.err };
        return '<tr><td data-l="Когда" class="nowrap">' + when(new Date(d.at * 1000).toISOString()) + '</td><td data-l="Что">' + (d.op === 'send' ? 'отправка' + (d.n ? ' (' + d.n + ')' : '') : d.op === 'probe' ? 'проба сервера (выдуманный рахунок)' : 'проверка') + (d.user ? ' · <a href="#user-' + d.user + '" data-user="' + d.user + '">#' + d.user + '</a>' : '') + '</td>' +
          '<td data-l="Итог">' + (R[d.result] || esc(d.result)) + '</td><td data-l="Подробно"><details><summary class="small">структура</summary><pre class="small" style="white-space:pre-wrap;max-width:60ch">' + esc(JSON.stringify(det, null, 1)) + '</pre></details></td></tr>';
      }).join('') + '</tbody></table>' : '<p class="muted small">Ещё никто не проверял рахунок через сайт Водоканала.</p>') + '</details>';
  }
  /** Свет: пускает ли обленерго робота с украинского адреса. Нет итога — команда с «Скопировать» и как запустить на NAS / Mac; есть — что это значит. */
  /** Свет — ретранслятор на NAS: токен и сценарий для DSM, на связи ли, пауза, проба, проверка без отправки и подача, очередь. */

  }

  document.addEventListener('click', function (e) {
    var jr = e.target.closest('[data-js],[data-jdays],[data-jall],[data-jtag]');
    if (jr) {
      e.preventDefault();
      if (jr.hasAttribute('data-js')) { location.hash = 'js-' + jr.getAttribute('data-js').replace('|', '-'); return; }
      if (jr.hasAttribute('data-jdays')) { JD.days = +jr.getAttribute('data-jdays'); show('journal'); return; }
      if (jr.hasAttribute('data-jall')) { JD.all = !JD.all; show('journal'); return; }
      if (jr.hasAttribute('data-jtag')) { post('/admin/journal/tag', { vid: JD.vid, tag: jr.getAttribute('data-jtag') }).then(function () { show('jsession'); }); return; }
    }
    var rl = e.target.closest('[data-relay]');
    if (rl) {
      var act = rl.getAttribute('data-relay'), rm = document.querySelector('[data-key=relay-msg]'), say = function (t) { if (rm) rm.textContent = t; };
      if (act === 'off' && !confirm('Выключить ретранслятор? Сценарий на NAS перестанет получать задания.')) return;
      if (act === 'token' && rl.textContent.indexOf('Новый') === 0 && !confirm('Новый ключ: старый сценарий на NAS перестанет работать — его нужно будет заменить. Продолжить?')) return;
      var body = {};
      if (act === 'dry' || act === 'send') {
        var acc = (document.querySelector('[data-ra]') || {}).value || '', z = {};
        Array.prototype.forEach.call(document.querySelectorAll('[data-rz]'), function (i) { if (i.value.trim()) z[i.getAttribute('data-rz')] = i.value.trim(); });
        body = { acc: acc, zones: z, force: (document.querySelector('[data-rforce]') || {}).checked ? 1 : 0 };
        if (act === 'send' && !confirm('Отправить в Харківобленерго: рахунок ' + acc + ', показания ' + JSON.stringify(z) + '?')) return;
      }
      var RE = { bad_acc: 'рахунок — 5–20 цифр', bad_zones: 'зоны: только «Показания», или день + ночь, или пик + полупик + ночь', bad_value: 'показания — цифры', window_closed: 'окно приёма закрыто (отметьте «вне окна», если нужно)', busy: 'предыдущая подача ещё не закончилась', relay_paused: 'пауза — сначала «Продолжить»', relay_off: 'ретранслятор выключен' };
      say('…'); post('/admin/relay/' + act, body).then(function (j) {
        if (j && j.error) { say('Не вышло: ' + (RE[j.error] || j.error)); return; }
        if (j && j.id) say('Задание #' + j.id + ' в очереди' + (j.online === false ? ' — NAS сейчас не на связи, выполнится, когда выйдет' : ''));
        show('overview');
      }, function () { say('Сервер недоступен'); });
      return;
    }
    var pgl = e.target.closest('[data-page]');
    if (pgl) { e.preventDefault(); PG.id = pgl.getAttribute('data-page'); show('pages'); return; }
    var cp = e.target.closest('[data-copy]');
    if (cp) { var src = document.querySelector('[data-key="' + cp.getAttribute('data-copy') + '"]'), msg = cp.parentNode.querySelector('[data-copied]') || document.querySelector('[data-key=ua-copied]'), txt = src ? src.textContent : '';
      var done = function (ok) { if (msg) msg.textContent = ok ? 'Скопировано' : 'Не вышло — выделите текст выше и скопируйте вручную'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { done(false); }); else done(false);
      return; }
    var vg = e.target.closest('[data-vgdays],[data-vgall],[data-vgday]');
    if (vg) { e.preventDefault(); if (vg.hasAttribute('data-vgdays')) { VG.days = +vg.getAttribute('data-vgdays'); VG.day = ''; } else if (vg.hasAttribute('data-vgall')) VG.all = !VG.all; else VG.day = vg.getAttribute('data-vgday') || ''; show('visitors'); return; }
    var ga = e.target.closest('[data-gall]'); if (ga) { e.preventDefault(); GA.all = ga.getAttribute('data-gall') === '1'; show('geo'); return; }
    var el = e.target.closest('[data-tab],[data-user],[data-pf],[data-fb],[data-fbr],[data-zoom],[data-ddays],.zoom'); if (!el) return;
    if (el.hasAttribute('data-ddays')) { e.preventDefault(); DDAYS = +el.getAttribute('data-ddays'); show('overview'); return; }
    if (el.classList.contains('zoom')) { el.remove(); return; }
    if (el.hasAttribute('data-zoom')) { var z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = '<img src="' + esc(el.src) + '" alt="">'; document.body.appendChild(z); return; }
    e.preventDefault();
    if (el.hasAttribute('data-tab')) { location.hash = el.getAttribute('data-tab'); return; }
    if (el.hasAttribute('data-user')) { location.hash = 'user-' + el.getAttribute('data-user'); return; }
    if (el.hasAttribute('data-pf')) { PF = el.getAttribute('data-pf'); show('photos'); return; }
    // ответ на отзыв (121-а): человеку — карточка в Telegram («Понятно» / «Ещё вопрос») или письмо
    if (el.hasAttribute('data-fbr')) { var tx = prompt('Ответ человеку (уйдёт в Telegram карточкой, нет Telegram — на e-mail):'); if (tx && tx.trim()) post('/admin/feedback/reply', { id: +el.getAttribute('data-fbr'), text: tx.trim() }).then(function (j) { if (j && j.error) alert(j.human || j.error); show('feedback'); }); return; }
    if (el.hasAttribute('data-fb')) { post('/admin/feedback', { id: +el.getAttribute('data-fb'), status: el.getAttribute('data-st') }).then(function () { show('feedback'); }); }
  });
  var qt;
  document.addEventListener('input', function (e) { if (e.target.id === 'q') { Q = e.target.value; clearTimeout(qt); qt = setTimeout(function () { show('users'); }, 300); } });
  window.addEventListener('hashchange', route);
  function route() { var h = (location.hash || '#overview').slice(1), m = h.match(/^user-(\d+)$/), js = h.match(/^js-([A-Za-z0-9]+)-([A-Za-z0-9]+)$/), pv = h.match(/^prov\/([a-z]{2})(?:\/(oblast|hromadas|settlements)(?:\/(.+))?)?$/);
    if (pv) { PV.r = pv[1]; if (pv[2]) { PV.scope = pv[2]; PV.key = pv[3] ? decodeURIComponent(pv[3]) : ''; show('prove'); } else show('provr'); return; }
    if (m) show('user', +m[1]); else if (js) { JD.vid = js[1]; JD.sid = js[2]; show('jsession'); } else show(h); }

  function loginForm(err) {
    app.innerHTML = '<form class="center" id="lf"><h2>Вход в аналитику</h2>' +
      '<p><label>E-mail<br><input id="le" type="email" autocomplete="username" required style="width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px"></label></p>' +
      '<p><label>Пароль<br><input id="lp" type="password" autocomplete="current-password" required style="width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px"></label></p>' +
      (err ? '<p class="problem">' + esc(err) + '</p>' : '') + '<p><button class="btn" type="submit">Войти</button></p></form>';
    document.getElementById('lf').addEventListener('submit', function (e) {
      e.preventDefault();
      var go = function () { return post('/auth/login', { email: document.getElementById('le').value, password: document.getElementById('lp').value }); };
      (cookie('ts_csrf') ? go() : get('/config').then(go)).then(function (r) {
        if (r && r.user) location.reload();
        else loginForm(r && r.error === 'locked' ? 'Слишком много попыток — подождите 15 минут.' : r && r.error === 'rate_limited' ? 'Слишком много попыток — подождите.' : 'Неверный e-mail или пароль.');
      }, function () { loginForm('Сервер недоступен.'); });
    });
  }

  get('/admin/me').then(function (j) {
    if (j._status === 401 || j.error === 'unauthorized') { loginForm(''); return; }
    if (!j.admin) {
      return get('/me').then(function (me) {
        var u = me.user || {};
        app.innerHTML = '<div class="center"><h2>Нет доступа</h2><p>Аналитика открыта только владельцу. Чтобы открыть её этому аккаунту, допишите в <code>/srv/sites/teplo_test_data/config.php</code>:</p><pre class="state">\'admins\' => [\'emails\' => [' + (u.email ? "'" + esc(u.email) + "'" : '') + '], \'telegram\' => [' + (u.telegram ? "'" + esc(u.telegram.id) + "'" : '') + ']],</pre><p><a class="btn" href="' + esc(SITE) + '">На сайт</a> <button class="btn" id="lo">Войти другим аккаунтом</button></p></div>';
        document.getElementById('lo').onclick = function () { post('/auth/logout', {}).then(function () { location.reload(); }); };
      });
    }
    route();
  }, function () { app.innerHTML = '<div class="center">Сервер недоступен.</div>'; });
})();
</script>
</body>
</html>
